name: Runtime contracts
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELIX_REQUIRE_PIPELINE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML yq
      - run: sudo apt-get update && sudo apt-get install -y jq curl
      - run: mkdir -p runtime
      - name: Fast regression contracts
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: ./manage.py test --suite golden --suite harness --suite cli --suite effects --suite generated --suite dogfood --suite imports --suite library --suite execution --suite parser --suite startup --suite type_time --suite pipeline --suite errors --suite semantics --suite type_algebra --suite permissions --suite resources 2>&1 | tee runtime/test.log
      - name: Full bounded sweep
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./manage.py test 2>&1 | tee runtime/test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-failures
          path: runtime/
          if-no-files-found: ignore
      - name: Retain trust measurements
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: trust-measurements
          path: |
            runtime/memory/report.json
            runtime/coverage/actors.json
            runtime/mutants/report.json
          if-no-files-found: ignore
      - name: Retain speed benchmark reports
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: speed-benchmarks
          path: runtime/speed/
          if-no-files-found: ignore
