# Repository test orchestration over host observations. No filesystem or process authority.
# Shapes belong to Helix policy; the host independently enforces observations and authority.
strings_type: {$call: [list_of, {$ref: string}]}
status_type: {$call: [enum, passed, failed, skipped]}
observation_type:
  $call: [record, suite, {$ref: string}, failures, {$ref: strings_type},
    stdout, {$call: [optional, {$ref: string}]}, stderr, {$call: [optional, {$ref: string}]},
    cases, {$call: [optional, {$ref: integer}]}, jobs, {$call: [optional, {$ref: integer}]},
    blessed, {$call: [optional, {$ref: boolean}]}, reason, {$call: [optional, {$ref: string}]}]
result_type: {$call: [with_field, {$ref: observation_type}, status, {$ref: status_type}]}
report_type:
  $call: [record, command, {$call: [literal, test]}, status, {$call: [enum, passed, failed]},
    exit_code, {$call: [enum, 0, 1]}, failure_count, {$ref: integer},
    results, {$call: [list_of, {$ref: result_type}]}]
# Selection consumes the host's compact projection, independent of retained report metadata.
selection_row_type: {$call: [record, suite, {$ref: string}, status, {$ref: status_type}]}
selection_type: {$call: [record, results, {$call: [list_of, {$ref: selection_row_type}]}]}
run_task_type: {$call: [record, suite, {$ref: string}, action, {$call: [literal, run]}]}
skip_task_type: {$call: [with_field, {$call: [with_field, {$ref: run_task_type}, action, {$call: [literal, skip]}]}, reason, {$ref: string}]}
tasks_type: {$call: [list_of, {$call: [union, {$ref: run_task_type}, {$ref: skip_task_type}]}]}
rerun:
  $call:
  - fn
  - [[catalog, {$ref: strings_type}], [previous, {$ref: selection_type}]]
  - $call:
    - let
    - rows: {$call: [get, {$ref: previous}, results]}
      failed: {$call: [filter, {$call: [fn, [row], {$call: [eq, {$ref: row.status}, failed]}]}, {$ref: rows}]}
      failed_names: {$call: [map, {$call: [fn, [row], {$ref: row.suite}]}, {$ref: failed}]}
      companions:
        $call: [filter, {$call: [fn, [row], {$call: [and, {$call: [has, [golden, robustness], {$ref: row.suite}]}, {$call: [ne, {$ref: row.status}, skipped]}]}]}, {$ref: rows}]
      companion_names: {$call: [map, {$call: [fn, [row], {$ref: row.suite}]}, {$ref: companions}]}
    - $call:
      - filter
      - $call:
        - fn
        - [name]
        - $call: [or, {$call: [has, {$ref: failed_names}, {$ref: name}]}, {$call: [and, {$call: [has, {$ref: failed_names}, standard_library]}, {$call: [has, {$ref: companion_names}, {$ref: name}]}]}]
      - {$ref: catalog}
  - {$ref: strings_type}
plan:
  $call:
  - fn
  - [[catalog, {$ref: strings_type}], [requested, {$ref: strings_type}], [bless, {$ref: boolean}]]
  - $call:
    - let
    - selected: {$call: [if, {$call: [eq, {$ref: requested}, []]}, {$ref: catalog}, {$ref: requested}]}
      ordinary:
        $call: [filter, {$call: [fn, [name], {$call: [and, {$call: [has, {$ref: selected}, {$ref: name}]}, {$call: [not, {$call: [has, [golden, robustness], {$ref: name}]}]}]}]}, {$ref: catalog}]
      fixtures: {$call: [filter, {$call: [fn, [name], {$call: [has, {$ref: selected}, {$ref: name}]}]}, [golden, robustness]]}
      ordered: {$call: [concat, {$ref: ordinary}, {$call: [if, {$call: [eq, {$ref: fixtures}, []]}, [], [standard_library]]}, {$ref: fixtures}]}
    - $call:
      - map
      - $call:
        - fn
        - [name]
        - $call:
          - if
          - {$call: [and, {$ref: bless}, {$call: [eq, {$ref: name}, robustness]}]}
          - {suite: {$ref: name}, action: skip, reason: disabled while blessing expectations}
          - $call:
            - if
            - {$call: [and, {$call: [eq, {$ref: requested}, []]}, {$call: [eq, {$ref: name}, docker_nginx]}]}
            - {suite: {$ref: name}, action: skip, reason: 'requires explicit --suite docker_nginx (provisions disposable Docker resources)'}
            - {suite: {$ref: name}, action: run}
      - {$ref: ordered}
  - {$ref: tasks_type}
result:
  $call:
  - fn
  - [[observation, {$ref: observation_type}]]
  - $call:
    - set
    - {$ref: observation}
    - status
    - $call:
      - if
      - {$call: [has, {$ref: observation}, reason]}
      - skipped
      - {$call: [if, {$call: [eq, {$call: [get, {$ref: observation}, failures]}, []]}, passed, failed]}
  - {$ref: result_type}
report:
  $call:
  - fn
  - [[observations, {$call: [list_of, {$ref: observation_type}]}]]
  - $call:
    - let
    - processed_results: {$call: [map, {$ref: result}, {$ref: observations}]}
      total_failures: {$call: [fold, {$call: [fn, [count, row], {$call: [add, {$ref: count}, {$call: [len, {$call: [get, {$ref: row}, failures]}]}]}]}, 0, {$ref: processed_results}]}
      passed: {$call: [eq, {$ref: total_failures}, 0]}
    - command: test
      status: {$call: [if, {$ref: passed}, passed, failed]}
      exit_code: {$call: [if, {$ref: passed}, 0, 1]}
      failure_count: {$ref: total_failures}
      results: {$ref: processed_results}
  - {$ref: report_type}
