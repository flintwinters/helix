# A stateless Helix message handler served over an HTTP substrate.
include: [web.so]
response:
  status: 200
  content_type: text/html; charset=utf-8
  body: |
    <!doctype html>
    <html lang="en">
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Helix web demo</title>
      <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #282828; color: #ebdbb2; font: 18px/1.5 system-ui, sans-serif; }
        main { max-width: 42rem; padding: 2rem; border: 1px solid #665c54; border-radius: .5rem; background: #3c3836; }
        code { color: #fabd2f; }
      </style>
      <main>
        <h1>Helix handled this message.</h1>
        <p><code>web.serve</code> carried one request into a stateless Helix function and returned its response.</p>
      </main>
    </html>
handler:
  type: function
  params: [message]
  body:
    - [return, response]
main:
  - web.serve
  - port: 8080
    max_requests: 0
  - handler
