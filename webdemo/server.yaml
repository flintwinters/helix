# A Helix program whose native `web` capability serves this literal YAML body.
# max_requests: 0 means serve until the process is interrupted.
include: [web.so]
main:
  - web.serve
  - port: 8080
    max_requests: 0
  - - path: /
      body: |
        <!doctype html>
        <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Helix web demo</title>
          <style>
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #282828; color: #ebdbb2; font: 18px/1.5 system-ui, sans-serif; }
            main { max-width: 42rem; padding: 2rem; border: 1px solid #665c54; border-radius: .5rem; background: #3c3836; }
            code { color: #fabd2f; }
          </style>
          <main>
            <h1>Helix is serving this page.</h1>
            <p>The listener, response lifecycle, and HTML body are configured by <code>server.yaml</code>.</p>
          </main>
        </html>
    - path: /health
      body: ok
