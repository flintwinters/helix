# Helix explicit syntax; migrated from legacy source.
"t": {"$call": ["import", "std:test"]}
"s": {"$call": ["import", "std:set"]}
"k": {"$call": ["import", "std:stack"]}
"q": {"$call": ["import", "std:queue"]}
"l": {"$call": ["import", "std:list"]}
"examples":
  "$call":
  - "t.suite"
  - - "name": "normalize"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["s.from", {"$call": ["list", 2, 1, 2.0, null, false, null, {"a": 1}, {"a": 1}]}]}
          - {"$call": ["list", 2, 1, null, false, {"a": 1}]}
    - "name": "union_order"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["s.union", {"$call": ["list", 2, 1, 2]}, {"$call": ["list", 3, 1, 4]}]}
          - {"$call": ["list", 2, 1, 3, 4]}
    - "name": "intersection_order"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["s.intersection", {"$call": ["list", 3, 1, 3, 2]}, {"$call": ["list", 2, 3]}]}
          - {"$call": ["list", 3, 2]}
    - "name": "difference_order"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["s.difference", {"$call": ["list", 3, 1, 3, 2]}, {"$call": ["list", 2]}]}
          - {"$call": ["list", 3, 1]}
    - "name": "insert_duplicate"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["s.insert", {"$call": ["list", 2, 2, 1]}, 2.0]}, {"$call": ["list", 2,
                1]}]}
    - "name": "remove_all"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["s.remove", {"$call": ["list", null, false, null]}, null]}
          - {"$call": ["list", false]}
    - "name": "empty_subset"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["s.is_subset", [], []]}, true]}]}
    - "name": "missing_member"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["s.is_subset", {"$call": ["list", 1, 2]}, {"$call": ["list", 1]}]}, false]}
    - "name": "contains_nested"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["s.contains", {"$call": ["list", {"a": [1, 2]}]}, {"a": [1, 2]}]}, true]}
    - "name": "empty_stack"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["list", {"$call": ["k.pop", []]}, {"$call": ["k.peek", [], "missing"]}]}
          - {"$call": ["list", [], "missing"]}
    - "name": "empty_queue"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["list", {"$call": ["q.dequeue", []]}, {"$call": ["q.peek", [], "missing"]}]}
          - {"$call": ["list", [], "missing"]}
    - "name": "lifo"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "let"
          - "xs": {"$call": ["k.push", {"$call": ["k.push", [], null]}, false]}
          - "$call":
            - "t.equal"
            - "$call":
              - "list"
              - {"$call": ["k.peek", {"$ref": "xs"}, "missing"]}
              - {"$call": ["k.peek", {"$call": ["k.pop", {"$ref": "xs"}]}, "missing"]}
              - {"$call": ["k.pop", {"$call": ["k.pop", {"$ref": "xs"}]}]}
            - {"$call": ["list", false, null, []]}
    - "name": "fifo"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "let"
          - "xs": {"$call": ["q.enqueue", {"$call": ["q.enqueue", [], null]}, false]}
          - "$call":
            - "t.equal"
            - "$call":
              - "list"
              - {"$call": ["q.peek", {"$ref": "xs"}, "missing"]}
              - {"$call": ["q.peek", {"$call": ["q.dequeue", {"$ref": "xs"}]}, "missing"]}
              - {"$call": ["q.dequeue", {"$call": ["q.dequeue", {"$ref": "xs"}]}]}
            - {"$call": ["list", null, false, []]}
    - "name": "set_contract"
      "run": {"$call": ["fn", [], {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["s.union", [], 1]}]}, "type"]}]}
    - "name": "stack_contract"
      "run": {"$call": ["fn", [], {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["k.pop", {}]}]}, "type"]}]}
    - "name": "queue_contract"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["q.peek", null, false]}]}, "type"]}
"samples":
  "$call":
  - "list"
  - []
  - {"$call": ["list", null]}
  - {"$call": ["list", false, null, false]}
  - {"$call": ["list", 2, 1, 2.0]}
  - {"$call": ["list", {"a": 1}, {"$call": ["list", 2]}]}
"stack_law":
  "$call":
  - "t.property"
  - "push then pop restores the stack"
  - {"$ref": "samples"}
  - "$call":
    - "fn"
    - - "xs"
    - {"$call": ["eq", {"$call": ["k.pop", {"$call": ["k.push", {"$ref": "xs"}, "new"]}]}, {"$ref": "xs"}]}
"queue_law":
  "$call":
  - "t.property"
  - "enqueue then drain preserves FIFO order"
  - {"$ref": "samples"}
  - "$call":
    - "fn"
    - - "xs"
    - "$call":
      - "let"
      - "queued":
          "$call":
          - "fold"
          - {"$call": ["fn", ["acc", "x"], {"$call": ["q.enqueue", {"$ref": "acc"}, {"$ref": "x"}]}]}
          - []
          - {"$ref": "xs"}
        "drained":
          "$call":
          - "fold"
          - "$call":
            - "fn"
            - - "state"
              - "ignored"
            - "$call":
              - "list"
              - {"$call": ["q.dequeue", {"$call": ["get", {"$ref": "state"}, 0]}]}
              - "$call":
                - "append"
                - {"$call": ["get", {"$ref": "state"}, 1]}
                - {"$call": ["q.peek", {"$call": ["get", {"$ref": "state"}, 0]}, "missing"]}
          - {"$call": ["list", {"$ref": "queued"}, []]}
          - {"$ref": "xs"}
      - {"$call": ["eq", {"$ref": "drained"}, {"$call": ["list", [], {"$ref": "xs"}]}]}
"set_law":
  "$call":
  - "t.property"
  - "normalization is idempotent and union with self preserves it"
  - {"$ref": "samples"}
  - "$call":
    - "fn"
    - - "xs"
    - "$call":
      - "let"
      - "normalized": {"$call": ["s.from", {"$ref": "xs"}]}
      - "$call":
        - "and"
        - {"$call": ["eq", {"$call": ["s.from", {"$ref": "normalized"}]}, {"$ref": "normalized"}]}
        - {"$call": ["eq", {"$call": ["s.union", {"$ref": "xs"}, {"$ref": "xs"}]}, {"$ref": "normalized"}]}
        - {"$call": ["s.is_subset", {"$ref": "xs"}, {"$ref": "normalized"}]}
        - {"$call": ["eq", {"$call": ["s.difference", {"$ref": "xs"}, {"$ref": "xs"}]}, []]}
"report":
  "$call":
  - "t.suite"
  - - "name": "examples"
      "run": {"$call": ["fn", [], {"$call": ["t.require_pass", {"$ref": "examples"}]}]}
    - "name": "stack"
      "run": {"$call": ["fn", [], {"$call": ["t.require_pass", {"$ref": "stack_law"}]}]}
    - "name": "queue"
      "run": {"$call": ["fn", [], {"$call": ["t.require_pass", {"$ref": "queue_law"}]}]}
    - "name": "set"
      "run": {"$call": ["fn", [], {"$call": ["t.require_pass", {"$ref": "set_law"}]}]}
