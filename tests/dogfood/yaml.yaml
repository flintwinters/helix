# Helix explicit syntax; migrated from legacy source.
"t": {"$call": ["import", "std:test"]}
"y": {"$call": ["import", "std:yaml"]}
"samples":
  "$call":
  - "list"
  - null
  - true
  - false
  - 42
  - -3
  - 1.25
  - ""
  - "true"
  - "42"
  - "a: b\n"
  - []
  - {}
  - {"$call": ["list", "add", "x", 1]}
  - "a": [1, null, false]
    "b": "hello"
"roundtrip":
  "$call":
  - "t.property"
  - "data survives YAML dump and parse"
  - {"$ref": "samples"}
  - "$call":
    - "fn"
    - - "value"
    - {"$call": ["eq", {"$call": ["y.parse", {"$call": ["y.dump", {"$ref": "value"}]}]}, {"$ref": "value"}]}
"examples":
  "$call":
  - "t.suite"
  - - "name": "expressions_are_data"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["y.parse", "[add, missing, 1]"]}, {"$call": ["list", "add", "missing",
                1]}]}
    - "name": "imports_are_data"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["y.parse", "[import, missing.yaml]"]}
          - {"$call": ["list", "import", "missing.yaml"]}
    - "name": "nested_lookup"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["y.get_in", {"a": [false, null]}, {"$call": ["list", "a", 1]}]}, null]}
    - "name": "nested_update"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["y.set_in", {"a": [1, 2]}, {"$call": ["list", "a", 0]}, 7]}, {"a": [
                7, 2]}]}
    - "name": "root_update"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.set_in", {"a": 1}, [], false]}, false]}]}
    - "name": "new_key"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["y.set_in", {}, {"$call": ["list", "a"]}, null]}, {"a": null}]}
    - "name": "invalid_syntax"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "[broken"]}, false]}]}
    - "name": "duplicate_keys"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "a: 1\na: 2"]}, false]}]}
    - "name": "multiple_documents"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "1\n---\n2\n"]}, false]}]}
    - "name": "trailing_syntax"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "1\n---\n["]}, false]}]}
    - "name": "empty_input"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", ""]}, false]}]}
    - "name": "alias_accepted"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "a: &a 1\nb: *a"]}, true]}]}
    - "name": "missing_path"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - "$call":
            - "try"
            - {"$call": ["y.get_in", {}, {"$call": ["list", "missing"]}]}
            - {"$call": ["fn", ["error"], {"$call": ["get", {"$ref": "error"}, "kind"]}]}
          - "missing"
    - "name": "valid_document"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["y.valid", "a: [1, false, null]"]}, true]}]}
"report": {"$call": ["t.combine", {"$call": ["list", {"$ref": "roundtrip"}, {"$ref": "examples"}]}]}
