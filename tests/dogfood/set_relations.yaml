# Helix explicit syntax; migrated from legacy source.
"t": {"$call": ["import", "std:test"]}
"s": {"$call": ["import", "std:set"]}
"l": {"$call": ["import", "std:list"]}
"report":
  "$call":
  - "let"
  - "samples": {"$call": ["t.lists", [0, 1], 2]}
    "relations":
      "$call":
      - "t.property"
      - "set relations match finite membership truth tables"
      - {"$ref": "samples"}
      - "$call":
        - "fn"
        - - "left"
        - "$call":
          - "l.all"
          - {"$ref": "samples"}
          - "$call":
            - "fn"
            - - "right"
            - "$call":
              - "and"
              - "$call":
                - "eq"
                - {"$call": ["s.is_disjoint", {"$ref": "left"}, {"$ref": "right"}]}
                - "$call":
                  - "l.all"
                  - [0, 1]
                  - "$call":
                    - "fn"
                    - - "x"
                    - "$call":
                      - "not"
                      - "$call":
                        - "and"
                        - {"$call": ["has", {"$ref": "left"}, {"$ref": "x"}]}
                        - {"$call": ["has", {"$ref": "right"}, {"$ref": "x"}]}
              - "$call":
                - "eq"
                - {"$call": ["s.equals", {"$ref": "left"}, {"$ref": "right"}]}
                - "$call":
                  - "l.all"
                  - [0, 1]
                  - "$call":
                    - "fn"
                    - - "x"
                    - "$call":
                      - "eq"
                      - {"$call": ["has", {"$ref": "left"}, {"$ref": "x"}]}
                      - {"$call": ["has", {"$ref": "right"}, {"$ref": "x"}]}
              - "$call":
                - "s.equals"
                - {"$call": ["s.symmetric_difference", {"$ref": "left"}, {"$ref": "right"}]}
                - "$call":
                  - "filter"
                  - "$call":
                    - "fn"
                    - - "x"
                    - "$call":
                      - "ne"
                      - {"$call": ["has", {"$ref": "left"}, {"$ref": "x"}]}
                      - {"$call": ["has", {"$ref": "right"}, {"$ref": "x"}]}
                  - [0, 1]
    "examples":
      "$call":
      - "t.suite"
      - - "name": "stable_encounter_order"
          "run":
            "$call":
            - "fn"
            - []
            - {"$call": ["t.equal", {"$call": ["s.symmetric_difference", [3, 1, 3, 2, 5], [4, 2, 4, 6, 1]]}, [3,
                  5, 4, 6]]}
        - "name": "structural_numeric_equality"
          "run":
            "$call":
            - "fn"
            - []
            - "$call":
              - "t.equal"
              - {"$call": ["s.equals", [{"a": 1}, [2], null, false], [false, [2.0], {"a": 1.0}, null, null]]}
              - true
        - "name": "numeric_overlap"
          "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["s.is_disjoint", [1], [1.0]]}, false]}]}
        - "name": "structural_unique_difference"
          "run":
            "$call":
            - "fn"
            - []
            - "$call":
              - "t.equal"
              - {"$call": ["s.symmetric_difference", [{"a": 1}, [2], {"a": 1}, null], [[2.0], false, false]]}
              - - "a": 1
                - null
                - false
        - "name": "empty_left_validation"
          "run": {"$call": ["fn", [], {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["s.equals", [], 1]}]},
                  "type"]}]}
        - "name": "empty_right_validation"
          "run":
            "$call":
            - "fn"
            - []
            - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["s.is_disjoint", [], false]}]}, "type"]}
        - "name": "difference_validation"
          "run":
            "$call":
            - "fn"
            - []
            - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["s.symmetric_difference", {}, []]}]}, "type"]}
  - {"$call": ["t.combine", {"$call": ["list", {"$ref": "relations"}, {"$ref": "examples"}]}]}
