t: [import, std:test]
s: [import, std:set]
l: [import, std:list]
report:
  - let
  - samples: [t.lists, [0, 1], 2]
    # Independent finite-domain membership truth tables cover every pair,
    # including empty lists, permutations and duplicates.
    relations:
      - t.property
      - "set relations match finite membership truth tables"
      - samples
      - - fn
        - [left]
        - - l.all
          - samples
          - - fn
            - [right]
            - - and
              - [eq, [s.is_disjoint, left, right], [l.all, [0, 1], [fn, [x], [not, [and, [has, left, x], [has, right, x]]]]]]
              - [eq, [s.equals, left, right], [l.all, [0, 1], [fn, [x], [eq, [has, left, x], [has, right, x]]]]]
              - [s.equals, [s.symmetric_difference, left, right], [filter, [fn, [x], [ne, [has, left, x], [has, right, x]]], [0, 1]]]
    examples:
      - t.suite
      - - {name: stable_encounter_order, run: [fn, [], [t.equal, [s.symmetric_difference, [3, 1, 3, 2, 5], [4, 2, 4, 6, 1]], [3, 5, 4, 6]]]}
        - {name: structural_numeric_equality, run: [fn, [], [t.equal, [s.equals, [{a: 1}, [2], null, false], [false, [2.0], {a: 1.0}, null, null]], true]]}
        - {name: numeric_overlap, run: [fn, [], [t.equal, [s.is_disjoint, [1], [1.0]], false]]}
        - {name: structural_unique_difference, run: [fn, [], [t.equal, [s.symmetric_difference, [{a: 1}, [2], {a: 1}, null], [[2.0], false, false]], [{a: 1}, null, false]]]}
        - {name: empty_left_validation, run: [fn, [], [t.throws, [fn, [], [s.equals, [], 1]], "type"]]}
        - {name: empty_right_validation, run: [fn, [], [t.throws, [fn, [], [s.is_disjoint, [], false]], "type"]]}
        - {name: difference_validation, run: [fn, [], [t.throws, [fn, [], [s.symmetric_difference, {}, []]], "type"]]}
  - [t.combine, [list, relations, examples]]
