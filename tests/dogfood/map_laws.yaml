# Helix explicit syntax; migrated from legacy source.
# All maps over two keys with absent/null/false values, in both key orders.
"t": {"$call": ["import", "std:test"]}
"l": {"$call": ["import", "std:list"]}
"m": {"$call": ["import", "std:map"]}
"choices": {"$call": ["list", null, false]}
"singles":
  "$call":
  - "l.flat_map"
  - {"$call": ["list", "a", "b"]}
  - "$call":
    - "fn"
    - - "key"
    - "$call":
      - "map"
      - {"$call": ["fn", ["value"], {"$call": ["dict", {"$ref": "key"}, {"$ref": "value"}]}]}
      - {"$ref": "choices"}
"pairs":
  "$call":
  - "l.flat_map"
  - {"$ref": "choices"}
  - "$call":
    - "fn"
    - - "a"
    - "$call":
      - "l.flat_map"
      - {"$ref": "choices"}
      - "$call":
        - "fn"
        - - "b"
        - "$call":
          - "list"
          - {"$call": ["dict", "a", {"$ref": "a"}, "b", {"$ref": "b"}]}
          - {"$call": ["dict", "b", {"$ref": "b"}, "a", {"$ref": "a"}]}
"samples": {"$call": ["concat", {"$call": ["list", {}]}, {"$ref": "singles"}, {"$ref": "pairs"}]}
"merges": {"$call": ["t.product", {"$call": ["list", {"$ref": "samples"}, {"$ref": "samples"}]}]}
"merge_law":
  "$call":
  - "t.property"
  - "merge_law"
  - {"$ref": "merges"}
  - "$call":
    - "fn"
    - - "row"
    - "$call":
      - "let"
      - "left": {"$call": ["get", {"$ref": "row"}, 0]}
        "right": {"$call": ["get", {"$ref": "row"}, 1]}
        "result": {"$call": ["m.merge", {"$ref": "left"}, {"$ref": "right"}]}
        "expected_keys":
          "$call":
          - "l.sort"
          - "$call":
            - "concat"
            - {"$call": ["keys", {"$ref": "left"}]}
            - "$call":
              - "filter"
              - {"$call": ["fn", ["key"], {"$call": ["not", {"$call": ["has", {"$ref": "left"}, {"$ref": "key"}]}]}]}
              - {"$call": ["keys", {"$ref": "right"}]}
      - "$call":
        - "and"
        - {"$call": ["eq", {"$call": ["keys", {"$ref": "result"}]}, {"$ref": "expected_keys"}]}
        - "$call":
          - "l.all"
          - {"$ref": "expected_keys"}
          - "$call":
            - "fn"
            - - "key"
            - "$call":
              - "eq"
              - {"$call": ["get", {"$ref": "result"}, {"$ref": "key"}]}
              - "$call":
                - "if"
                - {"$call": ["has", {"$ref": "right"}, {"$ref": "key"}]}
                - {"$call": ["get", {"$ref": "right"}, {"$ref": "key"}]}
                - {"$call": ["get", {"$ref": "left"}, {"$ref": "key"}]}
"removals":
  "$call":
  - "l.flat_map"
  - {"$ref": "samples"}
  - "$call":
    - "fn"
    - - "source"
    - "$call":
      - "map"
      - {"$call": ["fn", ["key"], {"$call": ["list", {"$ref": "source"}, {"$ref": "key"}]}]}
      - {"$call": ["list", "a", "b", "missing"]}
"remove_law":
  "$call":
  - "t.property"
  - "remove_law"
  - {"$ref": "removals"}
  - "$call":
    - "fn"
    - - "row"
    - "$call":
      - "let"
      - "source": {"$call": ["get", {"$ref": "row"}, 0]}
        "key": {"$call": ["get", {"$ref": "row"}, 1]}
        "result": {"$call": ["m.remove", {"$ref": "source"}, {"$ref": "key"}]}
        "survivors":
          "$call":
          - "filter"
          - {"$call": ["fn", ["name"], {"$call": ["ne", {"$ref": "name"}, {"$ref": "key"}]}]}
          - {"$call": ["keys", {"$ref": "source"}]}
      - "$call":
        - "and"
        - {"$call": ["eq", {"$call": ["keys", {"$ref": "result"}]}, {"$ref": "survivors"}]}
        - "$call":
          - "l.all"
          - {"$ref": "survivors"}
          - "$call":
            - "fn"
            - - "name"
            - "$call":
              - "eq"
              - {"$call": ["get", {"$ref": "result"}, {"$ref": "name"}]}
              - {"$call": ["get", {"$ref": "source"}, {"$ref": "name"}]}
"examples":
  "$call":
  - "t.suite"
  - - "name": "shallow_replacement"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["m.merge", {"a": {"old": 1, "keep": 2}}, {"a": {"new": 3}}]}
          - "a":
              "new": 3
    - "name": "canonical_merge_order"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "t.equal"
          - {"$call": ["keys", {"$call": ["m.merge", {"b": 1}, {"c": 2, "b": 3, "a": 4}]}]}
          - - "a"
            - "b"
            - "c"
    - "name": "remove_middle"
      "run":
        "$call":
        - "fn"
        - []
        - "$call":
          - "let"
          - "actual": {"$call": ["m.remove", {"c": [1, 2], "b": false, "a": {"x": null}}, "b"]}
          - "$call":
            - "t.equal"
            - {"$call": ["list", {"$call": ["keys", {"$ref": "actual"}]}, {"$ref": "actual"}]}
            - {"$call": ["list", ["a", "c"], {"c": [1, 2], "a": {"x": null}}]}
"coverage":
  "$call":
  - "t.suite"
  - - "name": "map_count"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["len", {"$ref": "samples"}]}, 13]}]}
    - "name": "merge_count"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["len", {"$ref": "merges"}]}, 169]}]}
    - "name": "removal_count"
      "run": {"$call": ["fn", [], {"$call": ["t.equal", {"$call": ["len", {"$ref": "removals"}]}, 39]}]}
"report":
  "$call":
  - "t.combine"
  - {"$call": ["list", {"$ref": "examples"}, {"$ref": "coverage"}, {"$ref": "merge_law"}, {"$ref": "remove_law"}]}
