# Helix explicit syntax; migrated from legacy source.
# All maps over two keys with absent/null/false values, in both key orders.
choices: !call [list, ~, false]
coverage: !call
  - t.suite
  -
    - name: map_count
      run: !call
        - fn
        - []
        - !call [t.equal, !call [len, !ref samples], 13]
    - name: merge_count
      run: !call
        - fn
        - []
        - !call [t.equal, !call [len, !ref merges], 169]
    - name: removal_count
      run: !call
        - fn
        - []
        - !call [t.equal, !call [len, !ref removals], 39]
examples: !call
  - t.suite
  -
    - name: shallow_replacement
      run: !call
        - fn
        - []
        - !call [t.equal, !call [m.merge, {a: {keep: 2, old: 1}}, {a: {new: 3}}], {a: {new: 3}}]
    - name: canonical_merge_order
      run: !call
        - fn
        - []
        - !call [t.equal, !call [keys, !call [m.merge, {b: 1}, {a: 4, b: 3, c: 2}]], [a, b, c]]
    - name: remove_middle
      run: !call
        - fn
        - []
        - !call
            - let
            - {actual: !call [m.remove, {a: {x: ~}, b: false, c: [1, 2]}, b]}
            - !call
                - t.equal
                - !call [list, !call [keys, !ref actual], !ref actual]
                - !call [list, [a, c], {a: {x: ~}, c: [1, 2]}]
l: !call [import, "std:list"]
m: !call [import, "std:map"]
merge_law: !call
  - t.property
  - merge_law
  - !ref merges
  - !call
      - fn
      - [row]
      - !call
          - let
          - expected_keys: !call
              - l.sort
              - !call
                  - concat
                  - !call [keys, !ref left]
                  - !call
                      - filter
                      - !call
                          - fn
                          - [key]
                          - !call [not, !call [has, !ref left, !ref key]]
                      - !call [keys, !ref right]
            left: !call [get, !ref row, 0]
            result: !call [m.merge, !ref left, !ref right]
            right: !call [get, !ref row, 1]
          - !call
              - and
              - !call [eq, !call [keys, !ref result], !ref expected_keys]
              - !call
                  - l.all
                  - !ref expected_keys
                  - !call
                      - fn
                      - [key]
                      - !call
                          - eq
                          - !call [get, !ref result, !ref key]
                          - !call
                              - if
                              - !call [has, !ref right, !ref key]
                              - !call [get, !ref right, !ref key]
                              - !call [get, !ref left, !ref key]
merges: !call [t.product, !call [list, !ref samples, !ref samples]]
pairs: !call
  - l.flat_map
  - !ref choices
  - !call
      - fn
      - [a]
      - !call
          - l.flat_map
          - !ref choices
          - !call
              - fn
              - [b]
              - !call [list, !call [dict, a, !ref a, b, !ref b], !call [dict, b, !ref b, a, !ref a]]
removals: !call
  - l.flat_map
  - !ref samples
  - !call
      - fn
      - [source]
      - !call
          - map
          - !call
              - fn
              - [key]
              - !call [list, !ref source, !ref key]
          - !call [list, a, b, missing]
remove_law: !call
  - t.property
  - remove_law
  - !ref removals
  - !call
      - fn
      - [row]
      - !call
          - let
          - key: !call [get, !ref row, 1]
            result: !call [m.remove, !ref source, !ref key]
            source: !call [get, !ref row, 0]
            survivors: !call
              - filter
              - !call
                  - fn
                  - [name]
                  - !call [ne, !ref name, !ref key]
              - !call [keys, !ref source]
          - !call
              - and
              - !call [eq, !call [keys, !ref result], !ref survivors]
              - !call
                  - l.all
                  - !ref survivors
                  - !call
                      - fn
                      - [name]
                      - !call
                          - eq
                          - !call [get, !ref result, !ref name]
                          - !call [get, !ref source, !ref name]
report: !call
  - t.combine
  - !call [list, !ref examples, !ref coverage, !ref merge_law, !ref remove_law]
samples: !call [concat, !call [list, {}], !ref singles, !ref pairs]
singles: !call
  - l.flat_map
  - !call [list, a, b]
  - !call
      - fn
      - [key]
      - !call
          - map
          - !call
              - fn
              - [value]
              - !call [dict, !ref key, !ref value]
          - !ref choices
t: !call [import, "std:test"]
