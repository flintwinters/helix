# Helix explicit syntax; migrated from legacy source.
# Character boundaries include empty, ASCII, multibyte and combining characters.
"t": {"$call": ["import", "std:test"]}
"l": {"$call": ["import", "std:list"]}
"report":
  "$call":
  - "t.property"
  - "every string split rejoins at character boundaries"
  - {"$call": ["list", "", "abcdef", "\xE9\u96EA\U0001F642", "e\u0301\u96EA\U0001F642"]}
  - "$call":
    - "fn"
    - - "text"
    - "$call":
      - "l.all"
      - {"$call": ["l.range", {"$call": ["add", {"$call": ["len", {"$ref": "text"}]}, 1]}]}
      - "$call":
        - "fn"
        - - "at"
        - "$call":
          - "and"
          - "$call":
            - "eq"
            - "$call":
              - "concat"
              - {"$call": ["slice", {"$ref": "text"}, 0, {"$ref": "at"}]}
              - {"$call": ["slice", {"$ref": "text"}, {"$ref": "at"}, {"$call": ["len", {"$ref": "text"}]}]}
            - {"$ref": "text"}
          - "$call":
            - "eq"
            - {"$call": ["len", {"$call": ["slice", {"$ref": "text"}, 0, {"$ref": "at"}]}]}
            - {"$ref": "at"}
          - {"$call": ["eq", {"$call": ["slice", {"$ref": "text"}, {"$ref": "at"}, {"$ref": "at"}]}, ""]}
