# Helix explicit syntax; migrated from legacy source.
# Self-test the testing API with literal witnesses and deliberately rejected inputs.
cases:
  - name: same
    run: !call
      - fn
      - []
      - 42
    tags: [fast]
  - name: bad
    run: !call
      - fn
      - []
      - !call [raise, probe, broken, {x: false}]
    tags: [slow, fast]
  - name: same
    run: !call
      - fn
      - []
      - ~
  - name: last
    run: !call
      - fn
      - []
      - false
    tags: []
first: !call [t.suite, !ref cases]
report: !call
  - t.suite
  -
    - name: fields_subset
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.fields_equal, {extra: false, x: ~}, {x: ~}], ~]
    - name: fields_empty
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.fields_equal, {x: 1}, {}], ~]
    - name: fields_missing_is_not_null
      run: !call
        - fn
        - []
        - !call
            - t.throws_matching
            - !call
                - fn
                - []
                - !call [t.fields_equal, {}, {x: ~}]
            - {data: {actual: {}, expected: {x: ~}}, kind: assertion}
    - name: fields_nested_are_exact
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call [t.fields_equal, {x: {a: 1, b: 2}}, {x: {a: 1}}]
            - assertion
    - name: matching_error_retains_details
      run: !call
        - fn
        - []
        - !call
            - let
            - e: !call
                - t.throws_matching
                - !call
                    - fn
                    - []
                    - !call [raise, probe, broken, {x: false}]
                - {data: {x: false}, kind: probe, message: broken}
            - !call
                - assert
                - !call
                    - and
                    - !call [has, !ref e, line]
                    - !call [has, !ref e, column]
                    - !call [has, !ref e, path]
    - name: matching_error_wrong_field
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call
                    - t.throws_matching
                    - !call
                        - fn
                        - []
                        - !call [raise, probe, actual]
                    - {kind: probe, message: expected}
            - assertion
    - name: matching_error_wrong_kind
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call
                    - t.throws_matching
                    - !call
                        - fn
                        - []
                        - !call [raise, other, actual]
                    - {kind: probe}
            - assertion
    - name: matching_error_missing
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call
                    - t.throws_matching
                    - !call
                        - fn
                        - []
                        - false
                    - {kind: probe}
            - assertion
    - name: matching_requires_kind
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call
                    - t.throws_matching
                    - !call
                        - fn
                        - []
                        - ~
                    - {}
            - missing
    - name: failure_records_preserved
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [t.failures, !ref first]
            - !call [list, !call [get, !call [get, !ref first, results], 1]]
    - name: tagged_source_order
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call
                - map
                - !call
                    - fn
                    - [spec]
                    - !call [get, !ref spec, name]
                - !call [t.tagged, !ref cases, fast]
            - !call [list, same, bad]
    - name: tagged_empty
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.tagged, !ref cases, absent], []]
    - name: rerun_only_failures
      run: !call
        - fn
        - []
        - !call
            - let
            - {r: !call [t.rerun, !ref cases, !ref first]}
            - !call
                - t.equal
                - !call
                    - list
                    - !call [get, !ref r, total]
                    - !call [get, !ref r, failed]
                    - !call
                        - map
                        - !call
                            - fn
                            - [result]
                            - !call [get, !ref result, name]
                        - !call [get, !ref r, results]
                - !call [list, 1, 1, !call [list, bad]]
    - name: rerun_empty
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [t.rerun, !ref cases, !call [t.suite, []]]
            - {failed: 0, passed: 0, results: [], total: 0}
    - name: rerun_duplicate_names
      run: !call
        - fn
        - []
        - !call
            - let
            - {r: !call [t.rerun, !ref cases, {results: [{name: same, outcome: failed}]}]}
            - !call
                - t.equal
                - !call [list, !call [get, !ref r, total], !call [get, !ref r, passed]]
                - !call [list, 2, 2]
    - name: product_order_and_duplicates
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [t.product, !call [list, !call [list, false, ~, false], !call [list, x, "y"]]]
            - !call
                - list
                - !call [list, false, x]
                - !call [list, false, "y"]
                - !call [list, ~, x]
                - !call [list, ~, "y"]
                - !call [list, false, x]
                - !call [list, false, "y"]
    - name: product_no_axes
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.product, []], !call [list, []]]
    - name: product_empty_axis
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.product, !call [list, !call [list, 1], [], !call [list, 2]]], []]
    - name: product_contract
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call [t.product, !call [list, 1]]
            - type
    - name: lists_literal_order
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [t.lists, !call [list, -1, 1], 2]
            - !call
                - list
                - []
                - !call [list, -1]
                - !call [list, 1]
                - !call [list, -1, -1]
                - !call [list, -1, 1]
                - !call [list, 1, -1]
                - !call [list, 1, 1]
    - name: lists_zero_bound
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.lists, !call [list, 1, 2], 0], !call [list, []]]
    - name: lists_empty_alphabet
      run: !call
        - fn
        - []
        - !call [t.equal, !call [t.lists, [], 3], !call [list, []]]
    - name: lists_negative_bound
      run: !call
        - fn
        - []
        - !call
            - t.throws
            - !call
                - fn
                - []
                - !call [t.lists, !call [list, 1], -1]
            - range
t: !call [import, "std:test"]
