# Export a std:test report. The host discovers modules; all test policy stays here.
t: [import, std:test]
l: [import, std:list]
edges:
  - t.suite
  - - {name: negative_take, run: [fn, [], [t.throws, [fn, [], [l.take, [], -1]], "range"]]}
    - {name: negative_drop, run: [fn, [], [t.throws, [fn, [], [l.drop, [], -1]], "range"]]}
    - {name: find_stops, run: [fn, [], [t.equal, [l.find, [list, 1, 0], [fn, [n], [eq, [div, 1, n], 1]], null], 1]]}
    - {name: stable_sort, run: [fn, [], [t.equal, [l.sort_by, [list, {key: 1, id: first}, {key: 0, id: middle}, {key: 1, id: last}], [fn, [a, b], [lt, [get, a, "key"], [get, b, "key"]]]], [list, {key: 0, id: middle}, {key: 1, id: first}, {key: 1, id: last}]]]}
# Literal oracles avoid comparing flat_map with its own flatten dependency.
flattening:
  - t.suite
  - - {name: flatten_ragged, run: [fn, [], [t.equal, [l.flatten, [list, [], [list, 1, 2], [], [list, [list, 3]], [list, 4]]], [list, 1, 2, [list, 3], 4]]]}
    - {name: flat_map_transform, run: [fn, [], [t.equal, [l.flat_map, [list, 0, 2, 1], [fn, [n], [map, [fn, [i], n], [l.range, n]]]], [list, 2, 2, 1]]]}
report: [t.combine, [list, edges, flattening]]
