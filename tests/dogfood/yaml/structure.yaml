# Helix explicit syntax; migrated from legacy source.
report: !call
  - t.table
  - !ref rows
  - !call
      - fn
      - [row]
      - !call
          - t.equal
          - !call [y.parse, !call [get, !ref row, source]]
          - !call [get, !ref row, expected]
rows:
  - input:
      expected: {services: [{name: web, ports: [80, 443]}, {name: worker, ports: []}]}
      source: "services:\n  - name: web\n    ports: [80, 443]\n  - name: worker\n    ports: []\n"
    name: block_map_and_sequence
  - input: {expected: {a: [1, 2], b: {}}, source: "{a: [1, 2,], b: {},}"}
    name: flow_trailing_commas
  - {input: {expected: [{}, [], {a: []}], source: "[{}, [], {a: []}]"}, name: empty_containers}
  - {input: {expected: {a: ~, b: ~, c: ~}, source: "a:\nb: null\nc: ~\n"}, name: omitted_map_values}
  - {input: {expected: [~, 1], source: "-\n- 1\n"}, name: omitted_sequence_item}
  - input:
      expected: {"": d, "1": a, "null": c, "true": b}
      source: "{\"1\": a, \"true\": b, \"null\": c, \"\": d}"
    name: string_key_spelling
  - input:
      expected: {a/b: 2, "a:b": 1, "a~b": 3, "雪": 4}
      source: "{\"a:b\": 1, \"a/b\": 2, \"a~b\": 3, \"雪\": 4}"
    name: punctuation_keys
  - {input: {expected: {name: value}, source: "? name\n: value\n"}, name: explicit_scalar_key}
  - {input: {expected: {a: 1}, source: "# before\na: 1 # after\n# end\n"}, name: comment_only_lines}
  - {input: {expected: {a: 1, b: 2}, source: "a: 1\r\nb: 2\r\n"}, name: crlf}
  - {input: {expected: {a: 1}, source: "﻿a: 1\n"}, name: utf8_bom}
  - {input: {expected: {a: 1}, source: "﻿---\na: 1\n"}, name: bom_before_document_marker}
  - {input: {expected: "a﻿b", source: "\"a\\uFEFFb\""}, name: interior_bom_is_content}
  - {input: {expected: {a: 1}, source: "---\na: 1\n...\n# end\n"}, name: explicit_document}
  - {input: {expected: 1, source: "1\n...\n...\n"}, name: repeated_end_markers}
  - {input: {expected: {a: 1}, source: "%YAML 1.2\n---\na: 1\n"}, name: yaml_directive}
  - {input: {expected: ~, source: "---\n...\n"}, name: explicit_empty_document}
  - {input: {expected: {a: [1, 2]}, source: "a: &label [1, 2]"}, name: anchor_without_alias}
  - input: {expected: {"<<": {a: 1}, b: 2}, source: "{<<: {a: 1}, b: 2}"}
    name: merge_key_is_ordinary_text
  - {input: {expected: "first\nsecond\n", source: "|\n  first\n  second\n"}, name: literal_clip}
  - {input: {expected: "first\nsecond", source: "|-\n  first\n  second\n\n"}, name: literal_strip}
  - {input: {expected: "first\n\n", source: "|+\n  first\n\n"}, name: literal_keep}
  - {input: {expected: first second, source: ">-\n  first\n  second\n"}, name: folded_strip}
  - {input: {expected: "", source: ">\n"}, name: empty_folded}
  - {input: {expected: "", source: "|+\n"}, name: empty_keep_at_eof}
  - input: {expected: {kept: "\n", next: 1}, source: "kept: |+\n\nnext: 1\n"}
    name: keep_before_next_field
  - input: {expected: {next: 1, x: "\n"}, source: "x: |+ # |- >-\n\nnext: 1\n"}
    name: keep_with_misleading_comment
  - input: {expected: {next: 1, x: ""}, source: "x: | # |+\n\nnext: 1\n"}
    name: clip_with_misleading_comment
  - input: {expected: {"a|+ #": "", next: 1}, source: "\"a|+ #\": |-\n\nnext: 1\n"}
    name: header_after_quoted_key
  - input:
      expected: !call [dict, "it's |+#", "\n", next, 1]
      source: "'it''s |+#': |+\n\nnext: 1\n"
    name: single_quoted_header_key
  - input: {expected: !call [dict, "a\"|#", "\n", next, 1], source: "\"a\\\"|#\": |+\n\nnext: 1\n"}
    name: escaped_quote_header_key
  - input: {expected: {"it's": "\n", next: 1}, source: "it's: |+\n\nnext: 1\n"}
    name: header_after_plain_apostrophe
  - input: {expected: {next: 1, "this \"key\"": "\n"}, source: "this \"key\": |+\n\nnext: 1\n"}
    name: header_after_plain_quotes
  - input: {expected: {next: 1, x: "\n"}, source: "x: &value |+\n\nnext: 1\n"}
    name: header_after_anchor
  - {input: {expected: !call [list, "\n", 1], source: "- |+\n\n- 1\n"}, name: empty_sequence_block}
  - input: {expected: {multi line: "\n", next: 1}, source: "? \"multi\n  line\"\n: |+\n\nnext: 1\n"}
    name: explicit_multiline_key
  - {input: {expected: !call [dict, "\n", 1], source: "? |+\n\n: 1\n"}, name: block_scalar_key}
  - input: {expected: {"a #b": "\n", next: 1}, source: "a #b: |+\n\nnext: 1\n"}
    name: nbsp_in_plain_key
  - {input: {expected: "", source: "|+\n "}, name: keep_unterminated_blank}
  - {input: {expected: "\n", source: "|+\n\n"}, name: keep_blank_content}
  - {input: {expected: "", source: "|\n\n"}, name: clip_blank_content}
  - {input: {expected: "", source: "|-\n\n"}, name: strip_blank_content}
  - {input: {expected: {"雪": "\n"}, source: "雪: |+\n\n"}, name: keep_after_unicode_key}
  - {input: {expected: "", source: "|\r\n"}, name: empty_block_crlf}
  - {input: {expected: "", source: "|\r"}, name: empty_block_cr}
  - {input: {expected: "\n", source: "|+\r\n\r\n"}, name: keep_block_crlf}
  - {input: {expected: "\n", source: "|+\r\r"}, name: keep_block_cr}
  - {input: {expected: "", source: "| # + comment\n\n"}, name: comment_plus_is_not_chomping}
  - {input: {expected: "\n", source: "|2+\n\n"}, name: keep_indent_header}
  - {input: {expected: "", source: "|\n"}, name: empty_literal}
  - {input: {expected: text, source: "|-2\n  text\n"}, name: alternate_header_order}
  - input: {expected: "first\n  indented\nlast", source: ">-\n  first\n    indented\n  last\n"}
    name: folded_more_indented
  - input: {expected: "first\nsecond\n", source: ">\n  first\n\n  second\n"}
    name: folded_blank_line
  - {input: {expected: "  indented", source: "|2-\n    indented\n"}, name: block_indent_indicator}
  - input:
      expected: "# comment\n[add, x, 1]\n---"
      source: "|-\n  # comment\n  [add, x, 1]\n  ---\n"
    name: block_content_is_literal
  - input: {expected: {message: first second}, source: "message: first\n  second\n"}
    name: multiline_plain
  - {input: {expected: first second, source: "'first\n  second'"}, name: multiline_single_quote}
  - {input: {expected: first second, source: "\"first\n  second\""}, name: multiline_double_quote}
  - {input: {expected: firstsecond, source: "\"first\\\n  second\""}, name: escaped_line_break}
  - input:
      expected: !call [list, fn, !call [list, x], !call [list, add, x, 1]]
      source: "[fn, [x], [add, x, 1]]"
    name: function_syntax_is_data
  - input:
      expected: !call [list, closure, {x: 1}, !call [list, fn, [], x]]
      source: "[closure, {x: 1}, [fn, [], x]]"
    name: closure_syntax_is_data
  - {input: {expected: {a: 1, b: 1}, source: "a: &a 1\nb: *a\n"}, name: scalar_alias}
  - input: {expected: {a: {x: 1}, b: {"<<": {x: 1}}}, source: "a: &a {x: 1}\nb: {<<: *a}\n"}
    name: merge_alias
  - {input: {expected: "true", source: "!!str true"}, name: explicit_string_tag}
  - {input: {expected: 42, source: "!!int \"42\""}, name: explicit_integer_tag}
  - {input: {expected: [1, 2], source: "!!seq [1, 2]"}, name: sequence_tag}
  - {input: {expected: {a: 1}, source: "!!map {a: 1}"}, name: map_tag}
  - {input: {expected: {name: value}, source: "{!!str name: value}"}, name: tagged_key}
t: !call [import, "std:test"]
"y": !call [import, "std:yaml"]
