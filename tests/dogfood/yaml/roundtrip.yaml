# Helix explicit syntax; migrated from legacy source.
# Deterministic Cartesian domains, generated in Helix. Keep inputs small enough for VM budgets.
atoms: !call [list, ~, false, true, 0, -1, 1.25, "", add, "true"]
container_report: !call
  - t.property
  - nested data round trip
  - !ref containers
  - !call
      - fn
      - [value]
      - !call [eq, !call [y.parse, !call [y.dump, !ref value]], !ref value]
containers: !call
  - map
  - !call
      - fn
      - [pair]
      - !call [dict, left, !ref pair, right, !call [list, !ref pair, [], {}]]
  - !ref pairs
key_report: !call
  - t.table
  -
    - {input: !call [list, z, "", "1", "true", a/b, "雪"], name: forward_keys}
    - {input: !call [list, "雪", a/b, "true", "1", "", z], name: reverse_keys}
  - !call
      - fn
      - [names]
      - !call
          - let
          - value: !call
              - fold
              - !call
                  - fn
                  - [acc, name]
                  - !call [set, !ref acc, !ref name, false]
              - {}
              - !ref names
          - !call
              - t.equal
              - !call [keys, !call [y.parse, !call [y.dump, !ref value]]]
              - !call [l.sort, !ref names]
l: !call [import, "std:list"]
pairs: !call
  - l.flat_map
  - !ref atoms
  - !call
      - fn
      - [a]
      - !call
          - map
          - !call
              - fn
              - [b]
              - !call [list, !ref a, !ref b]
          - !ref atoms
report: !call [t.combine, !call [list, !ref text_report, !ref container_report, !ref key_report]]
t: !call [import, "std:test"]
text_report: !call
  - t.table
  - !ref text_rows
  - !call
      - fn
      - [text]
      - !call
          - let
          - dumped: !call [y.dump, !ref value]
            parsed: !call [y.parse, !ref dumped]
            value: !call
              - dict
              - !ref text
              - !call [list, !ref text, !call [dict, !ref text, !ref text]]
              - nested
              - !call [list, [], {}]
          - !call
              - finally
              - !call [t.equal, !ref parsed, !ref value]
              - !call [t.equal, !call [y.dump, !ref parsed], !ref dumped]
text_rows: !call
  - map
  - !call
      - fn
      - [text]
      - !call [dict, name, text as scalar key and list element, input, !ref text]
  - !ref texts
texts: !call
  - list
  - ""
  - "null"
  - "NULL"
  - "~"
  - "true"
  - "FALSE"
  - "yes"
  - "ON"
  - "0"
  - "-0.0"
  - "+42"
  - "1e3"
  - "012"
  - ".inf"
  - ".nan"
  - "0xFF"
  - "a: b"
  - "a#b"
  - "# comment"
  - "[a]"
  - "{a: b}"
  - "---"
  - "..."
  - "&anchor"
  - "*alias"
  - "!tag"
  - "|"
  - ">"
  - "%YAML 1.2"
  - "@name"
  - "`name"
  - "-"
  - "?"
  - ":"
  - ","
  - " leading"
  - "trailing "
  - two  spaces
  - "quote\""
  - "apostrophe'"
  - "back\\slash"
  - "line\nbreak"
  - "\t\r"
  - "\u0000\u0007\u0008\u000b\u000c\u001b"
  - "雪🙂"
  - "\u0085"
  - "\u2028"
  - "\u2029"
"y": !call [import, "std:yaml"]
