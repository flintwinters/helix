# Exhaust the forbidden C0/C1 ranges and both forbidden BMP noncharacters.
# Escaped character values are legal; literal characters in YAML source are not.
t: [import, std:test]
y: [import, std:yaml]
l: [import, std:list]
forbidden: [list, "\u0000", "\u0001", "\u0002", "\u0003", "\u0004", "\u0005", "\u0006", "\u0007", "\b", "\u000b", "\f", "\u000e", "\u000f", "\u0010", "\u0011", "\u0012", "\u0013", "\u0014", "\u0015", "\u0016", "\u0017", "\u0018", "\u0019", "\u001a", "\u001b", "\u001c", "\u001d", "\u001e", "\u001f", "\u007f", "\u0080", "\u0081", "\u0082", "\u0083", "\u0084", "\u0086", "\u0087", "\u0088", "\u0089", "\u008a", "\u008b", "\u008c", "\u008d", "\u008e", "\u008f", "\u0090", "\u0091", "\u0092", "\u0093", "\u0094", "\u0095", "\u0096", "\u0097", "\u0098", "\u0099", "\u009a", "\u009b", "\u009c", "\u009d", "\u009e", "\u009f", "\ufffe", "\uffff"]
boundaries: [list, "\t", "\n", "\r", "\u0085", "\u00a0", "\ud7ff", "\ue000", "\ufffd", "\U00010000", "\U0010ffff"]
literal_sources: [l.flat_map, forbidden, [fn, [ch], [list, [concat, "a", ch, "b"], [concat, "\"a", ch, "b\""], [concat, "a: 1\n# ", ch]]]]
rejections: [t.table, [map, [fn, [source], [dict, "name", "forbidden literal character", "input", source]], literal_sources], [fn, [source], [finally, [t.throws, [fn, [], [y.parse, source]], "parse"], [t.equal, [y.valid, source], false]]]]
roundtrips: [t.property, "escaped characters survive serialization", [concat, forbidden, boundaries], [fn, [ch], [eq, [y.parse, [y.dump, ch]], ch]]]
report: [t.combine, [list, rejections, roundtrips]]
