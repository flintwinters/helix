# Helix explicit syntax; migrated from legacy source.
# Exhaust the forbidden C0/C1 ranges and both forbidden BMP noncharacters.
# Escaped character values are legal; literal characters in YAML source are not.
"t": {"$call": ["import", "std:test"]}
"y": {"$call": ["import", "std:yaml"]}
"l": {"$call": ["import", "std:list"]}
"forbidden":
  "$call":
  - "list"
  - "\0"
  - "\x01"
  - "\x02"
  - "\x03"
  - "\x04"
  - "\x05"
  - "\x06"
  - "\a"
  - "\b"
  - "\v"
  - "\f"
  - "\x0E"
  - "\x0F"
  - "\x10"
  - "\x11"
  - "\x12"
  - "\x13"
  - "\x14"
  - "\x15"
  - "\x16"
  - "\x17"
  - "\x18"
  - "\x19"
  - "\x1A"
  - "\e"
  - "\x1C"
  - "\x1D"
  - "\x1E"
  - "\x1F"
  - "\x7F"
  - "\x80"
  - "\x81"
  - "\x82"
  - "\x83"
  - "\x84"
  - "\x86"
  - "\x87"
  - "\x88"
  - "\x89"
  - "\x8A"
  - "\x8B"
  - "\x8C"
  - "\x8D"
  - "\x8E"
  - "\x8F"
  - "\x90"
  - "\x91"
  - "\x92"
  - "\x93"
  - "\x94"
  - "\x95"
  - "\x96"
  - "\x97"
  - "\x98"
  - "\x99"
  - "\x9A"
  - "\x9B"
  - "\x9C"
  - "\x9D"
  - "\x9E"
  - "\x9F"
  - "\uFFFE"
  - "\uFFFF"
"boundaries": {"$call": ["list", "\t", "\n", "\r", "\N", "\_", "\uD7FF", "\uE000", "\uFFFD", "\U00010000", "\U0010FFFF"]}
"literal_sources":
  "$call":
  - "l.flat_map"
  - {"$ref": "forbidden"}
  - "$call":
    - "fn"
    - - "ch"
    - "$call":
      - "list"
      - {"$call": ["concat", "a", {"$ref": "ch"}, "b"]}
      - {"$call": ["concat", "\"a", {"$ref": "ch"}, "b\""]}
      - {"$call": ["concat", "a: 1\n# ", {"$ref": "ch"}]}
"rejections":
  "$call":
  - "t.table"
  - "$call":
    - "map"
    - "$call":
      - "fn"
      - - "source"
      - {"$call": ["dict", "name", "forbidden literal character", "input", {"$ref": "source"}]}
    - {"$ref": "literal_sources"}
  - "$call":
    - "fn"
    - - "source"
    - "$call":
      - "finally"
      - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["y.parse", {"$ref": "source"}]}]}, "parse"]}
      - {"$call": ["t.equal", {"$call": ["y.valid", {"$ref": "source"}]}, false]}
"roundtrips":
  "$call":
  - "t.property"
  - "escaped characters survive serialization"
  - {"$call": ["concat", {"$ref": "forbidden"}, {"$ref": "boundaries"}]}
  - "$call":
    - "fn"
    - - "ch"
    - {"$call": ["eq", {"$call": ["y.parse", {"$call": ["y.dump", {"$ref": "ch"}]}]}, {"$ref": "ch"}]}
"report": {"$call": ["t.combine", {"$call": ["list", {"$ref": "rejections"}, {"$ref": "roundtrips"}]}]}
