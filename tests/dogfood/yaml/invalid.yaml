# Helix explicit syntax; migrated from legacy source.
# Rejected inputs must disagree with neither valid() nor parse(); parse errors are catchable.
report: !call
  - t.table
  - !ref rows
  - !call
      - fn
      - [source]
      - !call
          - finally
          - !call
              - t.throws
              - !call
                  - fn
                  - []
                  - !call [y.parse, !ref source]
              - parse
          - !call [t.equal, !call [y.valid, !ref source], false]
rows:
  - {input: "", name: empty}
  - {input: " \n\t\n", name: whitespace_only}
  - {input: "# one\n# two\n", name: comments_only}
  - {input: "[1, 2", name: unclosed_sequence}
  - {input: "{a: 1", name: unclosed_map}
  - {input: "[1, 2}", name: mismatched_delimiter}
  - {input: "]", name: unexpected_closer}
  - {input: "[{}, {} {}]", name: missing_flow_comma}
  - {input: "{a: 1 b: 2}", name: missing_map_comma}
  - {input: "\"unfinished", name: unclosed_double_quote}
  - {input: "'unfinished", name: unclosed_single_quote}
  - {input: "\"\\q\"", name: invalid_escape}
  - {input: "\"\\u123\"", name: short_unicode_escape}
  - {input: "\"\\xGG\"", name: invalid_hex_escape}
  - {input: "\"\\U00110000\"", name: invalid_unicode_codepoint}
  - {input: "\"\\uD800\"", name: surrogate_codepoint}
  - {input: "a\u0000b", name: literal_nul}
  - {input: "a\u0001b", name: literal_control}
  - {input: "a:\n\tb: 1\n", name: tab_indentation}
  - {input: "a:\n  b: 1\n c: 2\n", name: bad_indentation}
  - {input: "a: 1\na: 2\n", name: duplicate_block_key}
  - {input: "{a: 1, a: 2}", name: duplicate_flow_key}
  - {input: "{a: 1, \"a\": 2}", name: duplicate_quoted_key}
  - {input: "{1: a, \"1\": b}", name: duplicate_numeric_key}
  - {input: "{outer: {a: 1, a: 2}}", name: duplicate_nested_key}
  - {input: "? [a, b]\n: 1", name: sequence_key}
  - {input: "? {a: b}\n: 1", name: map_key}
  - {input: "*missing", name: undefined_alias}
  - {input: "&a [*a]", name: recursive_alias}
  - {input: "1\n---\n2\n", name: second_document}
  - {input: "1\n---\n", name: empty_second_document}
  - {input: "---\n---\n1\n", name: empty_first_document}
  - {input: "1\n---\n[\n", name: malformed_second_document}
  - {input: "1\n...\ntrailing\n", name: text_after_end}
  - {input: "%YAML 1.2\na: 1\n", name: directive_without_start}
  - {input: "|0\n  text\n", name: invalid_block_indent}
  - {input: "!application value", name: custom_tag}
  - {input: "!<tag:example.org,2026:thing> value", name: verbatim_tag}
  - {input: "%TAG !e! tag:example.org,2026:\n---\n!e!thing value", name: tag_directive}
  - {input: "\"multi\n  line\": value", name: implicit_multiline_key}
  - {input: "\"multi\n\": value", name: implicit_multiline_key_closing_line}
  - {input: "@invalid", name: reserved_indicator}
  - {input: "{1: a, true: b, null: c}", name: non_string_scalar_keys}
  - {input: ".inf", name: nonfinite_infinity}
  - {input: ".nan", name: nonfinite_nan}
  - {input: "1e999", name: overflowing_float}
t: !call [import, "std:test"]
"y": !call [import, "std:yaml"]
