t: [import, std:test]
y: [import, std:yaml]
wrong_sources: [list, null, false, 42, [], {}]
source_contracts:
  - t.table
  - [map, [fn, [value], [dict, "name", "parse and valid require text", "input", value]], wrong_sources]
  - [fn, [value], [finally, [t.throws, [fn, [], [y.parse, value]], "type"], [t.throws, [fn, [], [y.valid, value]], "type"]]]
examples:
  - t.suite
  - - name: duplicate_key_location_in_text
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, "a: 1\na: 2\n"]], "parse"]}, [t.equal, [get, error, "message"], "duplicate mapping key (YAML line 2, column 1)"]]]
    - name: unsupported_alias_location_in_text
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, "a: &a 1\nb: *a\n"]], "parse"]}, [t.equal, [get, error, "message"], "aliases are not supported (YAML line 2, column 4)"]]]
    - name: empty_document_location
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, ""]], "parse"]}, [t.equal, [get, error, "message"], "empty document (YAML line 1, column 1)"]]]
    - name: forbidden_character_after_crlf
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, "a: 1\r\nb: \u0001"]], "parse"]}, [t.equal, [get, error, "message"], "non-printable character U+0001 (YAML line 2, column 4)"]]]
    - name: forbidden_character_after_cr
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, "a: 1\rb: \u0001"]], "parse"]}, [t.equal, [get, error, "message"], "non-printable character U+0001 (YAML line 2, column 4)"]]]
    - name: forbidden_character_after_unicode
      run: [fn, [], [let, {error: [t.throws, [fn, [], [y.parse, "雪\u0001"]], "parse"]}, [t.equal, [get, error, "message"], "non-printable character U+0001 (YAML line 1, column 2)"]]]
    - name: parse_arity
      run: [fn, [], [t.throws, [fn, [], [y.parse]], "arity"]]
    - name: dump_arity
      run: [fn, [], [t.throws, [fn, [], [y.dump, 1, 2]], "arity"]]
    - name: raw_parse_type
      run: [fn, [], [t.throws, [fn, [], [yaml_parse, false]], "type"]]
    - name: nested_error_is_catchable
      run: [fn, [], [t.equal, [try, [y.parse, '[' ], [fn, [error], [y.parse, '{ok: true}']]], {ok: true}]]
report: [t.combine, [list, source_contracts, examples]]
