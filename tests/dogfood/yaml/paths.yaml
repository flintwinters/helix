# Helix explicit syntax; migrated from legacy source.
atoms: !call [list, ~, false, 0, "", [1, 2], {nested: true}]
error_report: !call
  - t.table
  - !ref errors
  - !call
      - fn
      - [row]
      - !call
          - t.throws
          - !call
              - fn
              - []
              - !call
                  - if
                  - !call [eq, !call [get, !ref row, operation], get]
                  - !call [y.get_in, !call [get, !ref row, value], !call [get, !ref row, path]]
                  - !call [y.set_in, !call [get, !ref row, value], !call [get, !ref row, path], 42]
          - !call [get, !ref row, kind]
errors:
  - input: {kind: missing, operation: get, path: !call [list, absent], value: {}}
    name: missing_map_key
  - {input: {kind: missing, operation: get, path: [0], value: []}, name: missing_list_index}
  - {input: {kind: range, operation: get, path: [-1], value: [1]}, name: negative_index}
  - input: {kind: type, operation: get, path: !call [list, "0"], value: [1]}
    name: string_list_index
  - {input: {kind: type, operation: get, path: [0], value: {"0": 1}}, name: numeric_map_key}
  - input: {kind: type, operation: get, path: !call [list, a, b], value: {a: ~}}
    name: null_intermediate
  - {input: {kind: type, operation: get, path: !call [list, a], value: false}, name: scalar_root}
  - {input: {kind: type, operation: get, path: a, value: {}}, name: nonlist_get_path}
  - input: {kind: missing, operation: set, path: !call [list, a, b], value: {}}
    name: missing_intermediate
  - {input: {kind: range, operation: set, path: [1], value: [1]}, name: out_of_bounds_set}
  - {input: {kind: range, operation: set, path: [-1], value: [1]}, name: negative_set}
  - {input: {kind: type, operation: set, path: [0], value: {}}, name: numeric_map_set}
  - input: {kind: type, operation: set, path: !call [list, a, b], value: {a: false}}
    name: scalar_intermediate_set
  - {input: {kind: type, operation: set, path: ~, value: {}}, name: nonlist_set_path}
examples: !call
  - t.suite
  -
    - name: empty_get_path
      run: !call
        - fn
        - []
        - !call [t.equal, !call [y.get_in, false, []], false]
    - name: empty_set_path
      run: !call
        - fn
        - []
        - !call [t.equal, !call [y.set_in, false, [], {a: 1}], {a: 1}]
    - name: empty_and_punctuation_keys
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [y.get_in, {"": {a/b: {"a~b": 7}}}, !call [list, "", a/b, "a~b"]]
            - 7
    - name: replacement_keeps_key_order
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [keys, !call [y.set_in, {a: 2, z: 1}, !call [list, z], ~]]
            - !call [list, a, z]
    - name: insertion_has_canonical_order
      run: !call
        - fn
        - []
        - !call
            - t.equal
            - !call [keys, !call [y.set_in, {a: 2, z: 1}, !call [list, new], false]]
            - !call [list, a, new, z]
    - name: missing_null_remains_distinct
      run: !call
        - fn
        - []
        - !call [t.equal, !call [has, !call [y.set_in, {}, !call [list, new], ~], new], true]
l: !call [import, "std:list"]
laws: !call
  - t.property
  - "read after write, sibling preservation, original immutability, and replacement idempotence"
  - !ref pairs
  - !call
      - fn
      - [pair]
      - !call
          - let
          - old: !call [get, !ref pair, 0]
            original: !call
              - dict
              - root
              - !call [list, !ref old, !call [dict, leaf, !ref old, sibling, false]]
              - untouched
              - ~
            path: !call [list, root, 1, leaf]
            replacement: !call [get, !ref pair, 1]
            updated: !call [y.set_in, !ref original, !ref path, !ref replacement]
          - !call
              - and
              - !call [eq, !call [y.get_in, !ref updated, !ref path], !ref replacement]
              - !call [eq, !call [y.get_in, !ref original, !ref path], !ref old]
              - !call [eq, !call [y.get_in, !ref updated, !call [list, root, 0]], !ref old]
              - !call [eq, !call [y.get_in, !ref updated, !call [list, root, 1, sibling]], false]
              - !call [eq, !call [get, !ref updated, untouched], ~]
              - !call
                  - eq
                  - !call [y.set_in, !ref updated, !ref path, !ref replacement]
                  - !ref updated
pairs: !call
  - l.flat_map
  - !ref atoms
  - !call
      - fn
      - [old]
      - !call
          - map
          - !call
              - fn
              - [replacement]
              - !call [list, !ref old, !ref replacement]
          - !ref atoms
report: !call [t.combine, !call [list, !ref laws, !ref error_report, !ref examples]]
t: !call [import, "std:test"]
"y": !call [import, "std:yaml"]
