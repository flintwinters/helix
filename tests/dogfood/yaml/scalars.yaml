# Value AND type assertions prevent numeric equality from hiding inference regressions.
t: [import, std:test]
y: [import, std:yaml]
rows:
  - {name: null_lower, input: {source: 'null', value: null, type: 'null'}}
  - {name: null_title, input: {source: 'Null', value: null, type: 'null'}}
  - {name: null_upper, input: {source: 'NULL', value: null, type: 'null'}}
  - {name: null_tilde, input: {source: '~', value: null, type: 'null'}}
  - {name: true_title, input: {source: 'True', value: true, type: boolean}}
  - {name: false_upper, input: {source: 'FALSE', value: false, type: boolean}}
  - {name: yaml11_yes_is_string, input: {source: 'yes', value: 'yes', type: string}}
  - {name: yaml11_on_is_string, input: {source: 'ON', value: 'ON', type: string}}
  - {name: zero, input: {source: '0', value: 0, type: integer}}
  - {name: signed_integer, input: {source: '+42', value: 42, type: integer}}
  - {name: leading_zero_decimal, input: {source: '012', value: 12, type: integer}}
  - {name: integer_min, input: {source: '-9223372036854775808', value: -9223372036854775808, type: integer}}
  - {name: integer_max, input: {source: '9223372036854775807', value: 9223372036854775807, type: integer}}
  - {name: decimal_float, input: {source: '1.0', value: 1.0, type: float}}
  - {name: leading_dot, input: {source: '.5', value: 0.5, type: float}}
  - {name: trailing_dot, input: {source: '2.', value: 2.0, type: float}}
  - {name: exponent, input: {source: '1e3', value: 1000.0, type: float}}
  - {name: negative_zero_float, input: {source: '-0.0', value: -0.0, type: float}}
  # Helix's scalar vocabulary is deliberately smaller than full YAML core schema.
  - {name: hex_is_text, input: {source: '0xFF', value: '0xFF', type: string}}
  - {name: octal_is_text, input: {source: '0o12', value: '0o12', type: string}}
  - {name: infinity_is_text, input: {source: '.inf', value: '.inf', type: string}}
  - {name: nan_is_text, input: {source: '.nan', value: '.nan', type: string}}
  - {name: overflowing_float_is_text, input: {source: '1e999', value: '1e999', type: string}}
  - {name: date_is_text, input: {source: '2026-11-11', value: '2026-11-11', type: string}}
  - {name: quoted_null, input: {source: '"null"', value: 'null', type: string}}
  - {name: quoted_boolean, input: {source: "'true'", value: 'true', type: string}}
  - {name: quoted_integer, input: {source: '"42"', value: '42', type: string}}
  - {name: empty_double_quote, input: {source: '""', value: '', type: string}}
  - {name: empty_single_quote, input: {source: "''", value: '', type: string}}
  - {name: apostrophe_escape, input: {source: "'it''s YAML'", value: "it's YAML", type: string}}
  - {name: single_quote_keeps_backslash, input: {source: "'a\\nb'", value: 'a\nb', type: string}}
  - {name: escaped_whitespace, input: {source: '"a\nb\tc\rd"', value: "a\nb\tc\rd", type: string}}
  - {name: escaped_quotes, input: {source: '"\"quote\" \\ slash"', value: '"quote" \ slash', type: string}}
  - {name: unicode_escapes, input: {source: '"\x41\u96EA\U0001F642"', value: 'A雪🙂', type: string}}
  - {name: yaml_named_unicode_escapes, input: {source: '"\N\_\L\P\/"', value: "\u0085\u00A0\u2028\u2029/", type: string}}
  - {name: control_escapes, input: {source: '"\0\a\b\v\f\e"', value: "\0\a\b\v\f\e", type: string}}
  - {name: comment_after_scalar, input: {source: 'hello # ignored', value: hello, type: string}}
  - {name: hash_without_space, input: {source: 'hello#world', value: 'hello#world', type: string}}
  - {name: quoted_indicators, input: {source: '"# : [] {} & * ! | > % @ `"', value: '# : [] {} & * ! | > % @ `', type: string}}
report: [t.table, rows, [fn, [row], [let, {actual: [y.parse, [get, row, "source"]]}, [t.equal, [list, [type, actual], actual], [list, [get, row, "type"], [get, row, "value"]]]]]]
