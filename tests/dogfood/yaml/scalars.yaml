# Helix explicit syntax; migrated from legacy source.
# Value AND type assertions prevent numeric equality from hiding inference regressions.
report: !call
  - t.table
  - !ref rows
  - !call
      - fn
      - [row]
      - !call
          - let
          - {actual: !call [y.parse, !call [get, !ref row, source]]}
          - !call
              - t.equal
              - !call [list, !call [type, !ref actual], !ref actual]
              - !call [list, !call [get, !ref row, type], !call [get, !ref row, value]]
rows:
  - {input: {source: "null", type: "null", value: ~}, name: null_lower}
  - {input: {source: "Null", type: "null", value: ~}, name: null_title}
  - {input: {source: "NULL", type: "null", value: ~}, name: null_upper}
  - {input: {source: "~", type: "null", value: ~}, name: null_tilde}
  - {input: {source: "True", type: boolean, value: true}, name: true_title}
  - {input: {source: "FALSE", type: boolean, value: false}, name: false_upper}
  - {input: {source: "yes", type: string, value: "yes"}, name: yaml11_yes_is_string}
  - {input: {source: "ON", type: string, value: "ON"}, name: yaml11_on_is_string}
  - {input: {source: "0", type: integer, value: 0}, name: zero}
  - {input: {source: "+42", type: integer, value: 42}, name: signed_integer}
  - {input: {source: "012", type: integer, value: 12}, name: leading_zero_decimal}
  - input: {source: "-9223372036854775808", type: integer, value: -9223372036854775808}
    name: integer_min
  - input: {source: "9223372036854775807", type: integer, value: 9223372036854775807}
    name: integer_max
  - {input: {source: "1.0", type: float, value: 1.0}, name: decimal_float}
  - {input: {source: ".5", type: float, value: 0.5}, name: leading_dot}
  - {input: {source: "2.", type: float, value: 2.0}, name: trailing_dot}
  - {input: {source: "1e3", type: float, value: 1000.0}, name: exponent}
  - {input: {source: "-0.0", type: float, value: -0.0}, name: negative_zero_float}
  - {input: {source: "0xFF", type: integer, value: 255}, name: hex_integer}
  - {input: {source: "0o12", type: integer, value: 10}, name: octal_integer}
  - {input: {source: "2026-11-11", type: string, value: "2026-11-11"}, name: date_is_text}
  - {input: {source: "\"null\"", type: string, value: "null"}, name: quoted_null}
  - {input: {source: "'true'", type: string, value: "true"}, name: quoted_boolean}
  - {input: {source: "\"42\"", type: string, value: "42"}, name: quoted_integer}
  - {input: {source: "\"\"", type: string, value: ""}, name: empty_double_quote}
  - {input: {source: "''", type: string, value: ""}, name: empty_single_quote}
  - {input: {source: "'it''s YAML'", type: string, value: "it's YAML"}, name: apostrophe_escape}
  - {input: {source: "'a\\nb'", type: string, value: "a\\nb"}, name: single_quote_keeps_backslash}
  - input: {source: "\"a\\nb\\tc\\rd\"", type: string, value: "a\nb\tc\rd"}
    name: escaped_whitespace
  - input: {source: "\"\\\"quote\\\" \\\\ slash\"", type: string, value: "\"quote\" \\ slash"}
    name: escaped_quotes
  - input: {source: "\"\\x41\\u96EA\\U0001F642\"", type: string, value: "A雪🙂"}
    name: unicode_escapes
  - input: {source: "\"\\N\\_\\L\\P\\/\"", type: string, value: "\u0085 \u2028\u2029/"}
    name: yaml_named_unicode_escapes
  - input:
      source: "\"\\0\\a\\b\\v\\f\\e\""
      type: string
      value: "\u0000\u0007\u0008\u000b\u000c\u001b"
    name: control_escapes
  - {input: {source: "hello # ignored", type: string, value: hello}, name: comment_after_scalar}
  - {input: {source: "hello#world", type: string, value: "hello#world"}, name: hash_without_space}
  - input:
      source: "\"# : [] {} & * ! | > % @ `\""
      type: string
      value: "# : [] {} & * ! | > % @ `"
    name: quoted_indicators
t: !call [import, "std:test"]
"y": !call [import, "std:yaml"]
