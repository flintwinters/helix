# Helix explicit syntax; migrated from legacy source.
# Exercise toolkit entrypoints at the shared graph parser's nesting and node limits.
"t": {"$call": ["import", "std:test"]}
"y": {"$call": ["import", "std:yaml"]}
"l": {"$call": ["import", "std:list"]}
"nested":
  "$call":
  - "fn"
  - - "depth"
  - "$call":
    - "fold"
    - {"$call": ["fn", ["source", "ignored"], {"$call": ["concat", "[", {"$ref": "source"}, "]"]}]}
    - "0"
    - {"$call": ["l.range", {"$ref": "depth"}]}
"wide":
  "$call":
  - "fn"
  - - "doublings"
  - "$call":
    - "concat"
    - "["
    - "$call":
      - "fold"
      - {"$call": ["fn", ["source", "ignored"], {"$call": ["concat", {"$ref": "source"}, {"$ref": "source"}]}]}
      - "0,"
      - {"$call": ["l.range", {"$ref": "doublings"}]}
    - "0]"
"report":
  "$call":
  - "t.suite"
  - - "name": "depth_at_limit"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["len", {"$call": ["y.parse", {"$call": ["nested", 64]}]}]}, 1]}
    - "name": "depth_above_limit"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["y.parse", {"$call": ["nested", 65]}]}]}, "parse"]}
    - "name": "width_below_node_limit"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.equal", {"$call": ["len", {"$call": ["y.parse", {"$call": ["wide", 16]}]}]}, 65537]}
    - "name": "width_above_node_limit"
      "run":
        "$call":
        - "fn"
        - []
        - {"$call": ["t.throws", {"$call": ["fn", [], {"$call": ["y.parse", {"$call": ["wide", 17]}]}]}, "parse"]}
