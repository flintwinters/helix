# Small exact integers plus exactly representable fractions avoid rounding oracles.
t: [import, std:test]
l: [import, std:list]
m: [import, std:math]
values: [-4, -1, -0.5, 0, 0.5, 1, 4]
pairs: [t.product, [list, values, values]]
# Literal expected columns decouple abs/sign/square; correlated bugs cannot agree.
unary_rows:
  - {name: negative_integer, input: [-4, 4, -1, 16]}
  - {name: negative_unit, input: [-1, 1, -1, 1]}
  - {name: negative_fraction, input: [-0.5, 0.5, -1, 0.25]}
  - {name: zero, input: [0, 0, 0, 0]}
  - {name: positive_fraction, input: [0.5, 0.5, 1, 0.25]}
  - {name: positive_unit, input: [1, 1, 1, 1]}
  - {name: positive_integer, input: [4, 4, 1, 16]}
unary: [t.table, unary_rows, [fn, [row], [t.equal, [list, [m.abs, [get, row, 0]], [m.sign, [get, row, 0]], [m.square, [get, row, 0]]], [slice, row, 1, 4]]]]
ordering:
  - t.property
  - "min/max select the correctly ordered input endpoints"
  - pairs
  - [fn, [row], [let, {a: [get, row, 0], b: [get, row, 1], lo: [m.min, a, b], hi: [m.max, a, b]}, [and, [le, lo, a], [le, lo, b], [ge, hi, a], [ge, hi, b], [or, [eq, lo, a], [eq, lo, b]], [or, [eq, hi, a], [eq, hi, b]]]]]
intervals: [filter, [fn, [row], [le, [get, row, 0], [get, row, 1]]], pairs]
clamps: [l.flat_map, intervals, [fn, [bounds], [map, [fn, [x], [list, x, [get, bounds, 0], [get, bounds, 1]]], values]]]
clamping:
  - t.property
  - "clamp selects the nearest endpoint or preserves the interior"
  - clamps
  - [fn, [row], [let, {x: [get, row, 0], lo: [get, row, 1], hi: [get, row, 2], actual: [m.clamp, x, lo, hi]}, [eq, actual, [cond, [lt, x, lo], lo, [gt, x, hi], hi, x]]]]
coverage: [t.suite, [{name: pair_count, run: [fn, [], [t.equal, [len, pairs], 49]]}, {name: clamp_count, run: [fn, [], [t.equal, [len, clamps], 196]]}]]
report: [t.combine, [list, coverage, unary, ordering, clamping]]
