t: [import, std:types]
original: [record, "name", string, "count", integer, "note", [optional, string], "enabled", [default, boolean, true]]
rebuilt: [t.from_fields, [fields, original]]
round_trip: [eq, original, rebuilt]
dropped: [t.without_field, original, "count"]
drop_missing: [eq, original, [t.without_field, original, "absent"]]
retyped: [with_field, original, "count", string]
added: [with_field, original, "extra", boolean]
all_optional: [t.optional_fields, original]
idempotent: [eq, all_optional, [t.optional_fields, all_optional]]
default_preserved: [eq, [get, [fields, original], "enabled"], [get, [fields, all_optional], "enabled"]]
checks: [list, [is, {}, all_optional], [is, {count: 4}, all_optional], [is, {count: "bad"}, all_optional], [is, {name: "x"}, dropped], [is, {name: "x", count: "four"}, retyped]]
empty: [t.from_fields, {}]
empty_optional: [eq, empty, [t.optional_fields, empty]]
# Build a type by iteration and pass the transformer itself through a function value.
constructed: [fold, [fn, [record_type, field], [with_field, record_type, field, integer]], [record], ["x", "y"]]
via_function: [call, t.optional_fields, constructed]
invalid_spec: [try, [t.from_fields, {broken: 42}], [fn, [e], [get, e, "kind"]]]
invalid_type: [try, [t.optional_fields, integer], [fn, [e], [get, e, "kind"]]]
