# Helix explicit syntax; migrated from legacy source.
kinds:
  - !call [type, 1]
  - !call [type, 1.5]
  - !call [type, s]
  - !call [type, true]
  - !call [type, ~]
  - !call [type, [1, 2]]
  - !call [type, !call [set, {}, k, 1]]
nothing: ~
null_is_not_zero: !call [eq, !ref nothing, 0]
null_is_null: !call [eq, !ref nothing, ~]
quoted_head_is_data: [add, 1, 2]
