# Helix explicit syntax; migrated from legacy source.
# Ordinary lexical constructors and embedded modules work in an explicit pure region.
"types": {"$call": ["import", "std:types"]}
"shape": {"$call": ["record", "name", {"$ref": "string"}, "count", {"$call": ["default", {"$ref": "integer"}, 0]}]}
"derived": {"$call": ["type_time", {"$call": ["types.optional_fields", {"$ref": "shape"}]}]}
"iteration":
  "$call":
  - "type_time"
  - "$call":
    - "fold"
    - "$call":
      - "fn"
      - - "t"
        - "name"
      - {"$call": ["with_field", {"$ref": "t"}, {"$ref": "name"}, {"$ref": "boolean"}]}
    - {"$call": ["record"]}
    - - "a"
      - "b"
"nested": {"$call": ["type_time", {"$call": ["type_time", {"$call": ["list_of", {"$ref": "integer"}]}]}]}
"caught_inside":
  "$call":
  - "type_time"
  - {"$call": ["try", {"$call": ["list_of", 42]}, {"$call": ["fn", ["e"], {"$ref": "e"}]}]}
"caught_outside":
  "$call":
  - "try"
  - {"$call": ["type_time", {"$call": ["div", 1, 0]}]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
"runtime_after": {"$call": ["try", {"$call": ["div", 1, 0]}, {"$call": ["fn", ["e"], {"$ref": "e"}]}]}
"captured_error": {"$call": ["try", {"$call": ["div", 1, 0]}, {"$call": ["fn", ["e"], {"$ref": "e"}]}]}
"rechecked": {"$call": ["type_time", {"$ref": "captured_error"}]}
