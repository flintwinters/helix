# One declared type owns field requirements and nested value validation.
project: [record, "name", string, "owner", string, "dependencies", [list_of, string]]
projects:
  - {name: core, owner: runtime, dependencies: []}
  - {name: cli, owner: tools, dependencies: ["core"]}
  - {name: cli, dependencies: ["ghost"]}
  - {owner: docs, dependencies: []}
# Invalid rows remain in the report; only string names participate in references.
name_of: [fn, [row], [if, [is, row, map], [let, {name: [get, row, "name", null]}, [if, [is, name, string], name, null]], null]]
validate:
  [fn, [[records, list]],
    [let,
      {names: [map, name_of, records],
       counts: [fold, [fn, [acc, name], [if, [eq, name, null], acc, [set, acc, name, [add, [get, acc, name, 0], 1]]]], {}, names]},
      [map,
        [fn, [row],
          [let,
            {value: [if, [is, row, map], row, {}],
             missing: [filter, [fn, [field], [not, [has, value, field]]], [keys, [fields, project]]],
             name: [name_of, row],
             deps: [get, value, "dependencies", []],
             broken: [if, [is, deps, list], [filter, [fn, [dep], [and, [is, dep, string], [not, [has, names, dep]]]], deps], []],
             duplicate: [and, [ne, name, null], [gt, [get, counts, name, 0], 1]]},
            [set, [set, [set, [set, [set, {}, "name", name], "missing", missing], "duplicate", duplicate], "broken", broken], "violations", [violations, row, project]]]],
        records]]]
report: [validate, projects]
valid: [validate, [{name: core, owner: runtime, dependencies: []}, {name: cli, owner: tools, dependencies: ["core"]}]]
empty: [validate, []]
malformed: [validate, [{name: 9, owner: false, dependencies: ["ghost", 7, null]}, {name: "ok", owner: "tools", dependencies: null}, null]]
# A type report adds wrong-type and nested paths without losing domain findings.
nested_errors: [assert, [eq, [get, [get, malformed, 0], "violations"], [{at: "/name", message: "expected string, got integer"}, {at: "/owner", message: "expected string, got boolean"}, {at: "/dependencies/1", message: "expected string, got integer"}, {at: "/dependencies/2", message: "expected string, got null"}]]]
broken_survives: [assert, [eq, [get, [get, malformed, 0], "broken"], ["ghost"]]]
duplicate_survives: [assert, [get, [get, report, 2], "duplicate"]]
required_survives: [assert, [eq, [get, [get, report, 2], "missing"], ["owner"]]]
valid_clean: [assert, [eq, [map, [fn, [row], [get, row, "violations"]], valid], [[], []]]]
