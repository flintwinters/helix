in_port: [fn, [n], [and, [ge, n, 1], [le, n, 65535]]]
port: [refine, integer, in_port]
level: [enum, "debug", "info", "warn"]
endpoint: [record, "host", string, "port", port, "tls", [default, boolean, true], "note", [optional, string]]
ports: [list_of, port]
tags: [map_of, string]
id: [union, integer, string]
fits:
  scalar: [is, 3, integer]
  float_is_not_integer: [is, 3.0, integer]
  enum_member: [is, "info", level]
  enum_other: [is, "trace", level]
  literal: [is, 80, [literal, 80]]
  union_string: [is, "abc", id]
  union_null: [is, null, id]
  top: [is, [1, "x"], any]
  port_ok: [is, 8080, port]
  port_bad: [is, 70000, port]
  endpoint_minimal: [is, {host: "a", port: 22}, endpoint]
  endpoint_full: [is, {host: "a", port: 22, tls: false, note: "x"}, endpoint]
  endpoint_open_field: [is, {host: "a", port: 22, extra: 1}, endpoint]
  list_ok: [is, [1, 2, 3], ports]
  list_bad: [is, [1, 0, "x"], ports]
  map_ok: [is, {env: "prod"}, tags]
  map_bad: [is, {env: 1}, tags]
all_at_once: [violations, {host: 5, port: 0, extra: 1}, endpoint]
nested: [violations, [[1, "a"], ["b", 2]], [list_of, [list_of, integer]]]
no_type: [try, [is, 1, "nonsense"], [fn, [e], [get, e, "message"]]]
