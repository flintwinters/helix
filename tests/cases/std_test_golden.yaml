# Golden orchestration decisions over opaque host observations.
$call:
- let
- t:
    $call:
    - import
    - std:test
- pending:
    $call:
    - t.golden_plan
    - $literal:
        run: &id001
          returncode: 0
          stdout: 'status: finished

            root: 42

            '
          stderr: ''
        repeated: *id001
        expected: 'status: finished

          root: 42

          '
        bless: false
        root: '42

          '
        replay: null
  replayed:
    $call:
    - t.golden_plan
    - $literal:
        run: *id001
        repeated: *id001
        expected: 'status: finished

          root: 42

          '
        bless: false
        root: '42

          '
        replay:
          returncode: 0
          root: '42

            '
  no_replay:
