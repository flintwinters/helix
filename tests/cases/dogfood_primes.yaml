# Dogfood: primes below 50 by trial division up to the square root.
range: [fn, [lo, hi], [until, [fn, [xs], [eq, [len, xs], [sub, hi, lo]]], [fn, [xs], [append, xs, [add, lo, [len, xs]]]], []]]
divisible:
  [fn, [n, d],
    [cond,
      [gt, [mul, d, d], n], false,
      [eq, [mod, n, d], 0], true,
      [divisible, n, [add, d, 1]]]]
prime: [fn, [n], [not, [divisible, n, 2]]]
primes: [filter, prime, [range, 2, 50]]
count: [len, primes]
