# Deterministic charter contract; host acceptance lives in the corresponding suite.
!call
  - let
  - {orchestration: !call [import, "std:orchestration"]}
  - coalesced: !call
      - orchestration.run
      - !literal
          handlers: {reload: {requires: [package]}}
          resources:
            file_a: {notify: [reload], requires: [package]}
            file_b: {notify: [reload], requires: [package]}
            package: {notify: [], requires: []}
          version: 1
      - !call
          - fn
          - [kind, id]
          - {status: changed}
    cycle: !call
      - orchestration.plan
      - !literal
          handlers: {}
          resources: {a: {notify: [], requires: [b]}, b: {notify: [], requires: [a]}}
          version: 1
    failed_prerequisite: !call
      - orchestration.run
      - !literal
          handlers: {reload: {requires: [package]}}
          resources:
            file_a: {notify: [reload], requires: [package]}
            file_b: {notify: [reload], requires: [package]}
            package: {notify: [], requires: []}
          version: 1
      - !call
          - fn
          - [kind, id]
          - !call
              - if
              - !call [eq, !ref id, package]
              - !call [raise, package_failed, Package failed]
              - {status: changed}
    missing: !call
      - orchestration.run
      - !literal
          handlers: {reload: {requires: [package]}}
          resources: {file: {notify: [], requires: [missing]}}
          version: 1
      - !call
          - fn
          - [kind, id]
          - !call [raise, unexpected_callback, Validation must precede callbacks]
    plan: !call
      - orchestration.plan
      - !literal
          handlers: {reload: {requires: [package]}}
          resources:
            file_a: {notify: [reload], requires: [package]}
            file_b: {notify: [reload], requires: [package]}
            package: {notify: [], requires: []}
          version: 1
    unchanged: !call
      - orchestration.run
      - !literal
          handlers: {reload: {requires: [package]}}
          resources:
            file_a: {notify: [reload], requires: [package]}
            file_b: {notify: [reload], requires: [package]}
            package: {notify: [], requires: []}
          version: 1
      - !call
          - fn
          - [kind, id]
          - {status: unchanged}
