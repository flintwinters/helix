# Deterministic charter contract; host acceptance lives in the corresponding suite.
$call:
- let
- command:
    $call:
    - import
    - std:command
  config:
    id: golden.command
    revision: '1'
    platforms:
    - test-linux
    capabilities:
    - command
    observation:
      $ref: string
    observe:
      $call:
      - fn
      - - args
      - done
    guard:
      $call:
      - fn
      - - args
        - before
      - $call:
        - ne
        - $ref: before
        - done
    failed:
      $call:
      - fn
      - - args
        - reply
      - $call:
        - ne
        - $call:
          - get
          - $ref: reply
          - code
        - 0
    changed:
      $call:
      - fn
      - - args
        - reply
      - $call:
        - eq
        - $call:
          - get
          - $ref: reply
          - stdout
        - 'changed

          '
  spec:
    $call:
    - command.make
    - $ref: config
- preview:
    $call:
    - command.plan
    - &id001
      $ref: spec
    - $literal: &id002
        program: /bin/echo
        args:
        - spaces ; $literal
        - "Unicode: \u03BB"
    - pending
    - $literal: &id003
        platform: test-linux
        capabilities:
        - command
        managed: true
        allow_remove: false
  guard_satisfied:
    $call:
    - command.plan
    - *id001
    - $literal: *id002
    - done
    - $literal: *id003
  noop_apply:
    $call:
    - command.apply
    - $ref: spec
    - $literal: *id002
    - $literal: *id003
    - $call:
      - command.plan
      - *id001
      - $literal: *id002
      - done
      - $literal: *id003
  changed:
    $call:
    - try
    - $call:
      - command.classify
      - $ref: config
      - $literal: *id002
      - code: 0
        stdout: 'changed

          '
        stderr: ''
    - $call:
      - fn
      - - e
      - $ref: e
  unchanged:
    $call:
    - try
    - $call:
      - command.classify
      - $ref: config
      - $literal: *id002
      - code: 0
        stdout: ''
        stderr: ''
    - $call:
      - fn
      - - e
      - $ref: e
  failed:
    $call:
    - try
    - $call:
      - command.classify
      - $ref: config
      - $literal: *id002
      - code: 7
        stdout: 'changed

          '
        stderr: ''
    - $call:
      - fn
      - - e
      - $ref: e
  invalid_guard:
    $call:
    - command.plan
    - $call:
      - command.make
      - $call:
        - set
        - $ref: config
        - guard
        - $call:
          - fn
          - - args
            - before
          - not boolean
    - $literal: *id002
    - pending
    - $literal: *id003
  effectful_guard:
    $call:
    - command.plan
    - $call:
      - command.make
      - $call:
        - set
        - $ref: config
        - guard
        - $call:
          - fn
          - - args
            - before
          - $call:
            - effect
            - time
            - null
    - $literal: *id002
    - pending
    - $literal: *id003
