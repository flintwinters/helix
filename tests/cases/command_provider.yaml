# Deterministic charter contract; host acceptance lives in the corresponding suite.
!call
  - let
  - command: !call [import, "std:command"]
    config:
      capabilities: [command]
      changed: !call
        - fn
        - [args, reply]
        - !call [eq, !call [get, !ref reply, stdout], "changed\n"]
      failed: !call
        - fn
        - [args, reply]
        - !call [ne, !call [get, !ref reply, code], 0]
      guard: !call
        - fn
        - [args, before]
        - !call [ne, !ref before, done]
      id: golden.command
      observation: !ref string
      observe: !call
        - fn
        - [args]
        - done
      platforms: [test-linux]
      revision: "1"
    spec: !call [command.make, !ref config]
  - changed: !call
      - try
      - !call
          - command.classify
          - !ref config
          - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
          - {code: 0, stderr: "", stdout: "changed\n"}
      - !call
          - fn
          - [e]
          - !ref e
    effectful_guard: !call
      - command.plan
      - !call
          - command.make
          - !call
              - set
              - !ref config
              - guard
              - !call
                  - fn
                  - [args, before]
                  - !call [effect, time, ~]
      - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
      - pending
      - !literal {allow_remove: false, capabilities: [command], managed: true, platform: test-linux}
    failed: !call
      - try
      - !call
          - command.classify
          - !ref config
          - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
          - {code: 7, stderr: "", stdout: "changed\n"}
      - !call
          - fn
          - [e]
          - !ref e
    guard_satisfied: !call
      - command.plan
      - !ref spec
      - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
      - done
      - !literal {allow_remove: false, capabilities: [command], managed: true, platform: test-linux}
    invalid_guard: !call
      - command.plan
      - !call
          - command.make
          - !call
              - set
              - !ref config
              - guard
              - !call
                  - fn
                  - [args, before]
                  - not boolean
      - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
      - pending
      - !literal {allow_remove: false, capabilities: [command], managed: true, platform: test-linux}
    noop_apply: !call
      - command.apply
      - !ref spec
      - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
      - !literal {allow_remove: false, capabilities: [command], managed: true, platform: test-linux}
      - !call
          - command.plan
          - !ref spec
          - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
          - done
          - !literal
              allow_remove: false
              capabilities: [command]
              managed: true
              platform: test-linux
    preview: !call
      - command.plan
      - !ref spec
      - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
      - pending
      - !literal {allow_remove: false, capabilities: [command], managed: true, platform: test-linux}
    unchanged: !call
      - try
      - !call
          - command.classify
          - !ref config
          - !literal {args: ["spaces ; $literal", "Unicode: λ"], program: /bin/echo}
          - {code: 0, stderr: "", stdout: ""}
      - !call
          - fn
          - [e]
          - !ref e
