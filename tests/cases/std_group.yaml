g: [import, std:group]
items: [{team: "b", n: 1}, {team: "a", n: 2}, {team: "b", n: 3}]
groups: [g.by, items, [fn, [item], [get, item, "team"]]]
order_ok: [assert, [eq, [keys, groups], ["b", "a"]]]
items_ok: [assert, [eq, [get, groups, "b"], [{team: "b", n: 1}, {team: "b", n: 3}]]]
empty: [g.by, [], [fn, [item], [raise, "unused", "must not run"]]]
keys: [g.by, ["", "é", "", "🙂", "é"], [fn, [item], item]]
constant: [g.by, [null, false, [1, 2], {x: 1}], [fn, [item], "all"]]
closure: [let, {prefix: "team:"}, [g.by, items, [fn, [item], [concat, prefix, [get, item, "team"]]]]]
wrong_list: [try, [g.by, 1, [fn, [x], "x"]], [fn, [e], [get, e, "kind"]]]
wrong_callback: [try, [g.by, [], 1], [fn, [e], [get, e, "kind"]]]
wrong_key: [try, [g.by, [1], [fn, [x], x]], [fn, [e], [get, e, "kind"]]]
callback_error: [try, [g.by, [1], [fn, [x], [raise, "group_key", "failed"]]], [fn, [e], [get, e, "kind"]]]
wrong_arity: [try, [g.by, []], [fn, [e], [get, e, "kind"]]]
