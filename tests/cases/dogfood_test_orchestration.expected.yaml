root:
  bad_catalog:
    kind: type
    violations:
      - argument: catalog
        at: /1
        message: "expected string, got integer"
  bad_observation:
    kind: type
    violations:
      - argument: observation
        at: /stdout
        message: "expected string, got integer"
  bad_report:
    kind: type
    violations:
      - argument: observations
        at: /0/failures/0
        message: "expected string, got null"
  bad_selection:
    kind: type
    violations:
      - argument: previous
        at: /results/0/status
        message: "expected one of [passed, failed, skipped], got string"
  blessing:
    - action: run
      suite: standard_library
    - action: run
      suite: golden
    - action: skip
      reason: disabled while blessing expectations
      suite: robustness
  default:
    - action: run
      suite: first
    - action: run
      suite: second
    - action: run
      suite: standard_library
    - action: run
      suite: golden
    - action: run
      suite: robustness
  empty: []
  failed:
    command: test
    exit_code: 1
    failure_count: 2
    results:
      - failures:
          - one
          - two
        status: failed
        suite: first
      - failures: []
        status: passed
        suite: second
    status: failed
  metadata:
    blessed: true
    cases: 3
    failures: []
    jobs: 2
    status: passed
    stderr: "warning\n"
    stdout: "saved output\n"
    suite: golden
  ordinary:
    - action: run
      suite: first
    - action: run
      suite: second
  passed:
    command: test
    exit_code: 0
    failure_count: 0
    results:
      - failures: []
        status: passed
        suite: first
    status: passed
  rerun_empty: []
  rerun_mixed:
    - first
    - second
  rerun_prerequisite:
    - golden
  skipped:
    command: test
    exit_code: 0
    failure_count: 0
    results:
      - failures: []
        reason: disabled while blessing expectations
        status: skipped
        suite: robustness
    status: passed
status: finished
