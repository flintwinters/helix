l: [import, std:list]
empty_unique: [l.unique, []]
unique: [l.unique, [3, 1, 3, 2, 1]]
numeric: [l.unique, [1, 1.0, 2.0, 2]]
nested: [l.unique, [[1, 2], [1, 2], {a: 1}, {a: 1}, null, null, false, false]]
text: [l.unique, ["é", "é", "x"]]
empty_sort: [l.sort_by, [], [fn, [a, b], [lt, a, b]]]
singleton: [l.sort_by, [7], [fn, [a, b], [lt, a, b]]]
ascending: [l.sort_by, [3, -1, 2, 2, 0], [fn, [a, b], [lt, a, b]]]
descending: [l.sort_by, [1, 3, 2], [fn, [a, b], [gt, a, b]]]
words: [l.sort_by, ["z", "a", "b"], [fn, [a, b], [lt, a, b]]]
again: [l.sort_by, ascending, [fn, [a, b], [lt, a, b]]]
bad_list: [try, [l.unique, 1], [fn, [e], [get, e, "kind"]]]
bad_predicate: [try, [l.sort_by, [2, 1], [fn, [a, b], 0]], [fn, [e], [get, e, "kind"]]]
# Exercise both scan extremes on a modest, explicitly supported input size.
small_range: [l.range, 32]
reverse_sorted: [l.sort_by, [l.reverse, small_range], [fn, [a, b], [lt, a, b]]]
size_sort_ok: [assert, [eq, reverse_sorted, small_range]]
size_unique_ok: [assert, [eq, [l.unique, [concat, small_range, small_range]], small_range]]
