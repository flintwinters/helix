# Helix explicit syntax; migrated from legacy source.
# Dogfood: reshape a list of records into a summary report.
report:
  big_orders: !call
    - map
    - !call
        - fn
        - [s]
        - !call [get, !ref s, item]
    - !call
        - filter
        - !call
            - fn
            - [s]
            - !call [ge, !call [get, !ref s, qty], 5]
        - !ref sales
  orders: !call [len, !ref sales]
  revenue: !call
    - fold
    - !call
        - fn
        - [t, s]
        - !call [add, !ref t, !call [mul, !call [get, !ref s, qty], !call [get, !ref s, price]]]
    - 0
    - !ref sales
  units: !call
    - fold
    - !call
        - fn
        - [t, s]
        - !call [add, !ref t, !call [get, !ref s, qty]]
    - 0
    - !ref sales
  units_by_region: !call
    - fold
    - !call
        - fn
        - [acc, s]
        - !call
            - let
            - {r: !call [get, !ref s, region]}
            - !call
                - set
                - !ref acc
                - !ref r
                - !call [add, !call [get, !ref acc, !ref r, 0], !call [get, !ref s, qty]]
    - {}
    - !ref sales
sales:
  - {item: apples, price: 1.5, qty: 3, region: north}
  - {item: pears, price: 2.0, qty: 8, region: south}
  - {item: plums, price: 0.5, qty: 5, region: north}
  - {item: apples, price: 1.5, qty: 2, region: east}
  - {item: apples, price: 1.5, qty: 6, region: south}
