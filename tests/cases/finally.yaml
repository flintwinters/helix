# Helix explicit syntax; migrated from legacy source.
# Cleanup runs on both outcomes, and its failure takes precedence.
"success": {"$call": ["finally", {"$call": ["add", 2, 3]}, {"$call": ["assert", true]}]}
"original_error":
  "$call":
  - "try"
  - {"$call": ["finally", {"$call": ["raise", "original", "body failed", {"step": 2}]}, null]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
"cleanup_after_success":
  "$call":
  - "try"
  - {"$call": ["finally", 42, {"$call": ["raise", "cleanup", "cleanup ran"]}]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
"cleanup_after_failure":
  "$call":
  - "try"
  - "$call":
    - "finally"
    - {"$call": ["raise", "original", "body failed"]}
    - {"$call": ["raise", "cleanup", "cleanup ran"]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
"cleanup_value_ignored": {"$call": ["finally", null, 99]}
"function":
  "$call":
  - "fn"
  - - "n"
  - "$call":
    - "finally"
    - {"$call": ["div", 12, {"$ref": "n"}]}
    - {"$call": ["assert", {"$call": ["ne", {"$ref": "n"}, -1]}, "cleanup rejected argument"]}
"calls":
  "$call":
  - "map"
  - "$call":
    - "fn"
    - - "n"
    - "$call":
      - "try"
      - {"$call": ["function", {"$ref": "n"}]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
  - [2, 0, -1, 3]
"nested":
  "$call":
  - "try"
  - "$call":
    - "finally"
    - {"$call": ["finally", 1, {"$call": ["raise", "inner", "inner cleanup"]}]}
    - {"$call": ["raise", "outer", "outer cleanup"]}
  - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
