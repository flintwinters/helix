# Helix explicit syntax; migrated from legacy source.
inherited_twice: !call
  - get
  - !call
      - inherit
      - d
      - !call [list, !ref sane, !call [extend, x, !call [list, !ref sane], !call [record], {}]]
      - {max: 2, min: 1}
  - constraints
machine: !call [class, machine, !call [record, min, !ref integer, max, !ref integer]]
ok: !call [get, !call [inherit, ok, !call [list, !ref sane], {max: 5, min: 1}], values]
open_after_partial: !call
  - open_fields
  - !call [extend, p, !call [list, !ref sane], !call [record], {min: 1}]
open_before: !call [open_fields, !ref sane]
ordered: !call
  - fn
  - [v]
  - !call [le, !call [get, !ref v, min], !call [get, !ref v, max]]
sane: !call [constrain, !ref machine, !ref ordered]
violated: !call
  - try
  - !call [inherit, bad, !call [list, !ref sane], {max: 5, min: 9}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
