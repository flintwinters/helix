m: [import, std:machine]
web1: [inherit, "web1", [list, m.machine], {hostname: "w1", packages: ["nginx"], services: {nginx: "running"}, users: ["deploy"]}]
web2: [inherit, "web2", [list, m.machine], {hostname: "w2"}]
dup: [inherit, "dup", [list, m.machine], {hostname: "w1"}]
fleet: [list, web1, web2]
unique: [m.unique_hostnames, fleet]
clashing: [m.unique_hostnames, [list, web1, dup]]
# Only the classes a machine needs are mixed in.
partial: [inherit, "partial", [list, m.host, m.packages], {hostname: "p", packages: []}]
partial_fields: [keys, [fields, partial]]
abstract: [get, m.machine, "concrete"]
missing_hostname: [try, [inherit, "bare", [list, m.machine], {}], [fn, [e], [get, e, "kind"]]]
bad_service: [try, [inherit, "bad", [list, m.machine], {hostname: "x", services: {nginx: "flapping"}}], [fn, [e], [get, e, "kind"]]]
bad_file: [try, [inherit, "bad", [list, m.machine], {hostname: "x", files: {"/etc/motd": 5}}], [fn, [e], [get, e, "kind"]]]
ports: [list, [is, 22, m.port], [is, 0, m.port], [is, 65536, m.port]]
