# Helix explicit syntax; migrated from legacy source.
!call
  - let
  - {f: !call [import, "std:fuzz"]}
  - boundaries: !call [f.plan, "a\u000bb\u000cc\u001cd\u001de\u001ef\u0085g\u2028h\u2029"]
    crlf: !call [f.plan, "a\r\nb\rc\n"]
    empty: !call [f.plan, ""]
    lines: !call [f.plan, "a: 1\nb: 2\n"]
    single: !call [f.plan, abcdef]
    unicode: !call [f.plan, "🙂é世界éx"]
    unterminated: !call [f.plan, "a\nb"]
    wrong_arity: !call
      - try
      - !call [f.plan]
      - !call
          - fn
          - [e]
          - !call [get, !ref e, kind]
    wrong_source: !call
      - try
      - !call [f.plan, 42]
      - !call
          - fn
          - [e]
          - !call [get, !ref e, kind]
