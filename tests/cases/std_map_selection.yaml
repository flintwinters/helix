m: [import, std:map]
source: {z: null, a: false, "": {nested: [1, 2]}, "é": 3, "🙂": 4}
selected: [m.select, source, ["🙂", "z", "a", "z", "missing"]]
selected_order: [assert, [eq, [keys, selected], ["z", "a", "🙂"]]]
omitted: [m.omit, source, ["a", "é", "a", "missing"]]
omitted_order: [assert, [eq, [keys, omitted], ["z", "", "🙂"]]]
nested: [m.select, source, [""]]
empty_select: [m.select, source, []]
empty_omit: [assert, [eq, [m.omit, source, []], source]]
empty_sources: [list, [m.select, {}, ["x"]], [m.omit, {}, ["x"]]]
wrong_select_source: [try, [m.select, [], []], [fn, [e], [get, e, "kind"]]]
wrong_omit_source: [try, [m.omit, null, []], [fn, [e], [get, e, "kind"]]]
wrong_select_keys: [try, [m.select, source, {}], [fn, [e], [get, e, "kind"]]]
wrong_omit_keys: [try, [m.omit, source, "z"], [fn, [e], [get, e, "kind"]]]
wrong_select_member: [try, [m.select, source, [list, "z", 1]], [fn, [e], [get, e, "kind"]]]
wrong_omit_member: [try, [m.omit, source, [list, null]], [fn, [e], [get, e, "kind"]]]
wrong_select_arity: [try, [m.select, source], [fn, [e], [get, e, "kind"]]]
wrong_omit_arity: [try, [m.omit, source, [], []], [fn, [e], [get, e, "kind"]]]
