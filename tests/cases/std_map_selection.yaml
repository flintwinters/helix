# Helix explicit syntax; migrated from legacy source.
empty_omit: !call [assert, !call [eq, !call [m.omit, !ref source, []], !ref source]]
empty_select: !call [m.select, !ref source, []]
empty_sources: !call [list, !call [m.select, {}, [x]], !call [m.omit, {}, [x]]]
m: !call [import, "std:map"]
nested: !call [m.select, !ref source, [""]]
omitted: !call [m.omit, !ref source, [a, "é", a, missing]]
omitted_order: !call [assert, !call [eq, !call [keys, !ref omitted], ["", z, "🙂"]]]
selected: !call [m.select, !ref source, ["🙂", z, a, z, missing]]
selected_order: !call [assert, !call [eq, !call [keys, !ref selected], [a, z, "🙂"]]]
source: {"": {nested: [1, 2]}, a: false, z: ~, "é": 3, "🙂": 4}
wrong_omit_arity: !call
  - try
  - !call [m.omit, !ref source, [], []]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_omit_keys: !call
  - try
  - !call [m.omit, !ref source, z]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_omit_member: !call
  - try
  - !call [m.omit, !ref source, !call [list, ~]]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_omit_source: !call
  - try
  - !call [m.omit, ~, []]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_select_arity: !call
  - try
  - !call [m.select, !ref source]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_select_keys: !call
  - try
  - !call [m.select, !ref source, {}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_select_member: !call
  - try
  - !call [m.select, !ref source, !call [list, z, 1]]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_select_source: !call
  - try
  - !call [m.select, [], []]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
indexed: !call
  - m.index_by
  - [{id: a, value: 1}, {id: "🙂", value: 2}, {id: a, value: 3}]
  - !call [fn, [item], !ref item.id]
index_policy: !call [assert, !call [eq, !ref indexed, {a: {id: a, value: 3}, "🙂": {id: "🙂", value: 2}}]]
