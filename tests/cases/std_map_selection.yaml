# Helix explicit syntax; migrated from legacy source.
"m": {"$call": ["import", "std:map"]}
"source":
  "z": null
  "a": false
  ? ""
  : "nested": [1, 2]
  "\xE9": 3
  "\U0001F642": 4
"selected": {"$call": ["m.select", {"$ref": "source"}, ["\U0001F642", "z", "a", "z", "missing"]]}
"selected_order": {"$call": ["assert", {"$call": ["eq", {"$call": ["keys", {"$ref": "selected"}]}, ["a", "z", "\U0001F642"]]}]}
"omitted": {"$call": ["m.omit", {"$ref": "source"}, ["a", "\xE9", "a", "missing"]]}
"omitted_order": {"$call": ["assert", {"$call": ["eq", {"$call": ["keys", {"$ref": "omitted"}]}, ["", "z", "\U0001F642"]]}]}
"nested": {"$call": ["m.select", {"$ref": "source"}, [""]]}
"empty_select": {"$call": ["m.select", {"$ref": "source"}, []]}
"empty_omit": {"$call": ["assert", {"$call": ["eq", {"$call": ["m.omit", {"$ref": "source"}, []]}, {"$ref": "source"}]}]}
"empty_sources": {"$call": ["list", {"$call": ["m.select", {}, ["x"]]}, {"$call": ["m.omit", {}, ["x"]]}]}
"wrong_select_source":
