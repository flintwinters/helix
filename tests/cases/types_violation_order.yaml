# Records visit declared fields before extras, recursively; maps use key order
# and lists use index order. Source presentation order is intentionally reversed.
$call:
  - let
  - schema: {$call: [record, z, {$call: [map_of, {$ref: integer}]}, b, {$call: [list_of, {$call: [record, y, {$ref: boolean}, x, {$ref: integer}]}]}, a, {$ref: string}]}
  - nested:
      $call:
        - violations
        - z: {z: false, a: false}
          b: [{y: 1, x: false, a_extra: 0}, {y: 1}]
          z_extra: null
          a_extra: null
        - {$ref: schema}
    union: {$call: [violations, null, {$call: [union, {$ref: string}, {$ref: integer}]}]}
    root: {$call: [violations, [], {$ref: schema}]}
