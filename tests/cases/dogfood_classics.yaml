# Classic pure-core examples, including empty inputs and boundary values.
l: [import, std:list]
fizzbuzz: [fn, [n], [cond,
  [eq, [mod, n, 15], 0], "FizzBuzz",
  [eq, [mod, n, 3], 0], "Fizz",
  [eq, [mod, n, 5], 0], "Buzz",
  [str, n]]]
fizzbuzz_1_to_20: [map, fizzbuzz, [map, [fn, [n], [add, n, 1]], [l.range, 20]]]
fizzbuzz_empty: [map, fizzbuzz, []]
# Trial division through n-1 is deliberately simple, for small inline inputs.
prime: [fn, [n], [and, [ge, n, 2], [eq,
  [len, [filter, [fn, [d], [eq, [mod, n, d], 0]],
    [filter, [fn, [d], [ge, d, 2]], [l.range, [if, [ge, n, 0], n, 0]]]]], 0]]]
primes_under_30: [filter, prime, [l.range, 30]]
prime_boundaries: [map, prime, [-3, 0, 1, 2, 3, 4]]
primes_empty: [filter, prime, []]
# Tokenize inline text on ASCII spaces; repeated spaces never create empty words.
words: [fn, [text], [get,
  [fold, [fn, [state, i], [let,
    {token: [get, state, "token"], found: [get, state, "words"], char: [slice, text, i, [add, i, 1]]},
    [if, [eq, char, " "],
      [dict, "token", "", "words", [if, [eq, token, ""], found, [append, found, token]]],
      [dict, "token", [concat, token, char], "words", found]]]],
    [dict, "token", "", "words", [list]], [l.range, [len, text]]], "words"]]
# Appending a delimiter flushes the final word without a second tokenization path.
frequency: [fn, [text], [fold, [fn, [counts, word],
  [set, counts, word, [add, [get, counts, word, 0], 1]]],
  [dict], [words, [concat, text, " "]]]]
word_frequency: [frequency, "  red blue red  green blue red "]
word_frequency_empty: [frequency, ""]
word_frequency_spaces: [frequency, "   "]
word_frequency_unicode: [frequency, "猫 café 猫"]
