# The normal evaluator yields a request; no transport runs without caller grants.
!call
  - let
  - config:
      content: "Hello over SSH\n"
      package_version: pinned-test-version
      port: 8080
      server_name: helix.remote
      ssh_target: fixture
      state: present
    nginx: !call [import, "std:nginx"]
  - !call [nginx.observe, !ref config]
