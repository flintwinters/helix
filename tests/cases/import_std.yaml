# Helix explicit syntax; migrated from legacy source.
absolute: !call [math.abs, -4]
biggest: !call [math.max, 3, 9]
clipped: !call [math.clamp, 15, 0, 10]
first_five: !call [lists.range, 5]
lists: !call [import, "std:list"]
math: !call [import, "std:math"]
minimum: !call [math.min, 7, 2]
negative_sign: !call [math.sign, -8]
product: !call [lists.product, [1, 2, 3, 4]]
reversed: !call [lists.reverse, [1, 2, 3]]
squares: !call [map, !ref math.square, [1, 2, 3]]
total: !call [lists.sum, [1, 2, 3, 4]]
