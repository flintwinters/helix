# Helix explicit syntax; migrated from legacy source.
"math": {"$call": ["import", "std:math"]}
"lists": {"$call": ["import", "std:list"]}
"biggest": {"$call": ["math.max", 3, 9]}
"clipped": {"$call": ["math.clamp", 15, 0, 10]}
"absolute": {"$call": ["math.abs", -4]}
"total": {"$call": ["lists.sum", [1, 2, 3, 4]]}
