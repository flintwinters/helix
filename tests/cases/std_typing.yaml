m: [import, std:math]
l: [import, std:list]
# Shared type values are usable by callers as well as library annotations.
numeric: [list, [is, 1, m.number], [is, 1.5, m.number], [is, "1", m.number]]
absolute: [list, [m.abs, -3], [m.abs, -2.5]]
signs: [list, [m.sign, -0.5], [m.sign, 0], [m.sign, 4.5]]
bounds: [list, [m.min, 3, 2.5], [m.max, 3, 2.5], [m.clamp, 10, 0.5, 4.5]]
square: [m.square, 1.5]
aggregates: [list, [l.sum, []], [l.product, []], [l.sum, [1, 2.5]], [l.product, [2, 1.5]]]
ranges: [list, [l.range, -1], [l.range, 0], [l.range, 3]]
heterogeneous: [l.reverse, [1, "two", null]]
# Contracts reject at entry, including callbacks that would never be called.
bad_abs: [try, [m.abs, "x"], [fn, [e], e]]
bad_min: [try, [m.min, "a", "b"], [fn, [e], [get, e, "data"]]]
bad_sum: [try, [l.sum, [1, "x", false]], [fn, [e], [get, e, "data"]]]
bad_product: [try, [l.product, {}], [fn, [e], [get, e, "data"]]]
bad_reverse: [try, [l.reverse, "abc"], [fn, [e], [get, e, "data"]]]
bad_range: [try, [l.range, 2.5], [fn, [e], [get, e, "data"]]]
bad_unique: [try, [l.unique, {}], [fn, [e], [get, e, "data"]]]
bad_sort: [try, [l.sort_by, [], 0], [fn, [e], [get, e, "data"]]]
