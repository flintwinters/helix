# Helix explicit syntax; migrated from legacy source.
absolute: !call [list, !call [m.abs, -3], !call [m.abs, -2.5]]
aggregates: !call
  - list
  - !call [l.sum, []]
  - !call [l.product, []]
  - !call [l.sum, [1, 2.5]]
  - !call [l.product, [2, 1.5]]
bad_abs: !call
  - try
  - !call [m.abs, x]
  - !call
      - fn
      - [e]
      - !ref e
bad_min: !call
  - try
  - !call [m.min, a, b]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_product: !call
  - try
  - !call [l.product, {}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_range: !call
  - try
  - !call [l.range, 2.5]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_reverse: !call
  - try
  - !call [l.reverse, abc]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_sort: !call
  - try
  - !call [l.sort_by, [], 0]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_sum: !call
  - try
  - !call [l.sum, [1, x, false]]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bad_unique: !call
  - try
  - !call [l.unique, {}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
bounds: !call [list, !call [m.min, 3, 2.5], !call [m.max, 3, 2.5], !call [m.clamp, 10, 0.5, 4.5]]
heterogeneous: !call [l.reverse, [1, two, ~]]
l: !call [import, "std:list"]
m: !call [import, "std:math"]
numeric: !call
  - list
  - !call [is, 1, !ref m.number]
  - !call [is, 1.5, !ref m.number]
  - !call [is, "1", !ref m.number]
ranges: !call [list, !call [l.range, -1], !call [l.range, 0], !call [l.range, 3]]
signs: !call [list, !call [m.sign, -0.5], !call [m.sign, 0], !call [m.sign, 4.5]]
square: !call [m.square, 1.5]
