# Helix explicit syntax; migrated from legacy source.
"m": {"$call": ["import", "std:math"]}
"l": {"$call": ["import", "std:list"]}
"numeric":
  "$call":
  - "list"
  - {"$call": ["is", 1, {"$ref": "m.number"}]}
  - {"$call": ["is", 1.5, {"$ref": "m.number"}]}
  - {"$call": ["is", "1", {"$ref": "m.number"}]}
"absolute": {"$call": ["list", {"$call": ["m.abs", -3]}, {"$call": ["m.abs", -2.5]}]}
