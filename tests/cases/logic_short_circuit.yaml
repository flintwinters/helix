# Helix explicit syntax; migrated from legacy source.
all: !call [and, !ref t, !ref t, !ref t]
both: !call [and, !ref t, !ref f]
either: !call [or, !ref f, !ref t]
f: false
none: !call [or, !ref f, !ref f]
skips_error_and: !call [and, !ref f, !call [div, 1, 0]]
skips_error_or: !call [or, !ref t, !call [div, 1, 0]]
skips_type_error: !call [and, !ref f, 1]
t: true
