# New constraints invalidate realization; values and the original class are retained.
!call
  - let
  - accepted: !call
      - constrain
      - !ref base
      - !call
          - fn
          - [values]
          - !call [gt, !ref values.port, 0]
    base: !call
      - realize
      - !call
          - class
          - service
          - !call [record, port, !call [default, !ref integer, 8080], enabled, !ref boolean]
          - {enabled: true}
    catch_error: !call
      - fn
      - [error]
      - !ref error
    rejected: !call
      - constrain
      - !ref base
      - !call
          - fn
          - [values]
          - false
  - accepted_concrete: !ref accepted.concrete
    accepted_pending_converge: !call
      - try
      - !call [converge, !ref accepted, {}]
      - !ref catch_error
    open_fields: !call [open_fields, !ref rejected]
    original_concrete: !ref base.concrete
    original_plan: !call [converge, !ref base, {enabled: true, port: 8080, unmanaged: keep}]
    pending_converge: !call
      - try
      - !call [converge, !ref rejected, {enabled: true, port: 80}]
      - !ref catch_error
    pending_drift: !call
      - try
      - !call [drift, !ref rejected, {enabled: true, port: 8080}]
      - !ref catch_error
    provenance_retained: !call [eq, !ref rejected.provenance, !ref base.provenance]
    rejected_concrete: !ref rejected.concrete
    rejected_membership: !call [is, {enabled: true, port: 8080}, !ref rejected]
    rejected_realization: !call
      - try
      - !call [realize, !ref rejected]
      - !ref catch_error
    revalidated_concrete: !call [get, !call [realize, !ref accepted], concrete]
    revalidated_plan: !call
      - converge
      - !call [realize, !ref accepted]
      - {enabled: true, port: 80, unmanaged: keep}
    values_retained: !call [eq, !ref rejected.values, !ref base.values]
