in_port: [fn, [n], [and, [ge, n, 1], [le, n, 65535]]]
port: [refine, integer, in_port]
endpoint: [record, "host", string, "port", port]
url: [fn, [[host, string], [p, port]], [concat, host, ":", [str, p]], string]
good: [url, "a", 80]
bad_args: [try, [url, 1, 0], [fn, [e], e]]
ident: [fn, [x], x, string]
wrong_result: [try, [ident, 5], [fn, [e], [get, e, "message"]]]
describe: [fn, [[e, endpoint]], [get, e, "host"]]
good_record: [describe, {host: "h", port: 1}]
bad_record: [try, [describe, {host: 1}], [fn, [e], [get, e, "data"]]]
checked_value: [expect, {host: "h", port: 22}, endpoint]
unchecked_value: [try, [expect, {host: "h", port: 0}, endpoint], [fn, [e], [get, e, "data"]]]
typed_map: [map, [fn, [[n, port]], n], [1, 2, 3]]
typed_map_bad: [try, [map, [fn, [[n, port]], n], [1, 0, 70000]], [fn, [e], [get, e, "message"]]]
