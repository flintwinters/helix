# Helix explicit syntax; migrated from legacy source.
# Keep the module local so the golden state focuses on the public results.
"results":
  "$call":
  - "let"
  - "s": {"$call": ["import", "std:set"]}
  - "empty_disjoint": {"$call": ["s.is_disjoint", [], []]}
    "empty_equal": {"$call": ["s.equals", [], []]}
    "empty_difference": {"$call": ["s.symmetric_difference", [], []]}
    "disjoint": {"$call": ["s.is_disjoint", [1, 1, 2], [3, 4, 3]]}
    "overlap": {"$call": ["s.is_disjoint", [1, 2], [2.0, 3]]}
    "reordered_duplicates": {"$call": ["s.equals", [2, 1, 2], [1.0, 2.0, 1]]}
    "proper_subset": {"$call": ["s.equals", [1], [1, 2]]}
    "proper_superset": {"$call": ["s.equals", [1, 2], [1]]}
    "structural": {"$call": ["s.equals", [{"a": [1, 2]}, null, false], [false, {"a": [1.0, 2]}, null, null]]}
    "stable": {"$call": ["s.symmetric_difference", [3, 1, 3, 2, 5, 5], [4, 2.0, 4, 6, 1]]}
    "structural_difference": {"$call": ["s.symmetric_difference", [{"a": 1}, [2], {"a": 1}, null], [[2.0], false,
          false]]}
    "left_empty": {"$call": ["s.symmetric_difference", [], [2, 1, 2]]}
    "right_empty": {"$call": ["s.symmetric_difference", [2, 1, 2], []]}
    "invalid_arguments":
    - "$call":
      - "try"
      - {"$call": ["s.is_disjoint", 1, []]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
    - "$call":
      - "try"
      - {"$call": ["s.is_disjoint", [], null]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
    - "$call":
      - "try"
      - {"$call": ["s.equals", {}, []]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
    - "$call":
      - "try"
      - {"$call": ["s.equals", [], false]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
    - "$call":
      - "try"
      - {"$call": ["s.symmetric_difference", "bad", []]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
    - "$call":
      - "try"
      - {"$call": ["s.symmetric_difference", [], 0]}
      - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
