# Helix explicit syntax; migrated from legacy source.
# Keep successful reports ordinary data; caught errors retain exact source blame.
!call
  - let
  - mixed: !call
      - v.batch
      - [0, -1, 2]
      - !call
          - fn
          - ["n"]
          - !call
              - if
              - !call [lt, !ref "n", 0]
              - !call [raise, negative, negative input, !ref "n"]
              - !call [mul, !ref "n", 10]
    results: !call [get, !ref mixed, results]
    t: !call [import, "std:test"]
    v: !call [import, "std:validation"]
  - counts: !call [t.fields_equal, !ref mixed, {failed: 1, passed: 2, total: 3}]
    duplicates: !call
      - v.batch
      - ["é", "é"]
      - !call
          - fn
          - [x]
          - !ref x
    empty: !call
      - v.batch
      - []
      - !call
          - fn
          - [x]
          - !call [raise, unexpected, empty batch called validator]
    failed_error: !call
      - t.fields_equal
      - !call [get, !call [get, !ref results, 1], error]
      - {data: -1, kind: negative, message: negative input}
    failed_input: !call
      - t.equal
      - !call [get, !call [get, !ref results, 1], input]
      - {index: 1, value: -1}
    false_and_null: !call
      - v.batch
      - [false, ~]
      - !call
          - fn
          - [x]
          - !ref x
    first: !call
      - t.equal
      - !call [get, !ref results, 0]
      - {input: {index: 0, value: 0}, name: validation, outcome: passed, value: 0}
    last: !call
      - t.equal
      - !call [get, !ref results, 2]
      - {input: {index: 2, value: 2}, name: validation, outcome: passed, value: 20}
    report: !call
      - if
      - true
      - !ref mixed
      - ~
    wrong_arity: !call
      - get
      - !call
          - t.throws
          - !call
              - fn
              - []
              - !call [v.batch, []]
          - arity
      - kind
    wrong_callback: !call
      - get
      - !call
          - t.throws
          - !call
              - fn
              - []
              - !call [v.batch, [], ~]
          - type
      - kind
    wrong_values: !call
      - get
      - !call
          - t.throws
          - !call
              - fn
              - []
              - !call
                  - v.batch
                  - {}
                  - !call
                      - fn
                      - [x]
                      - !ref x
          - type
      - kind
