# Helix explicit syntax; migrated from legacy source.
# Same deployment, resolved explicitly using the diagnostic's restart field.
base: !call [record, restart, !ref string, enabled, !ref boolean]
explicit_choice: !call [assert, !call [eq, !ref values, {enabled: true, restart: on-failure}]]
interactive: !call [class, interactive, !ref base, {enabled: true, restart: on-failure}]
resolved: !call
  - type_time
  - !call
      - extend
      - worker
      - !call [list, !ref interactive, !ref unattended]
      - !call [record]
      - {restart: on-failure}
unattended: !call [class, unattended, !ref base, {enabled: true, restart: always}]
values: !call [get, !ref resolved, values]
