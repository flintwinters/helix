# Defaults are declarations, not parent-order precedence. Explicit child values
# replace defaults; different inherited defaults require a child declaration.
$call:
  - let
  - first: {$call: [class, first, {$call: [record, port, {$call: [default, {$ref: integer}, 80]}]}, {}]}
    second: {$call: [class, second, {$call: [record, port, {$call: [default, {$ref: integer}, 8080]}]}, {}]}
  - membership_absent: {$call: [is, {}, {$ref: first}]}
    membership_different: {$call: [is, {port: 443}, {$ref: first}]}
    membership_wrong_type: {$call: [is, {port: wrong}, {$ref: first}]}
    inherited: {$call: [realize, {$call: [inherit, child, {$call: [list, {$ref: first}]}, {}]}]}
    overridden: {$call: [realize, {$call: [inherit, child, {$call: [list, {$ref: first}]}, {port: 443}]}]}
    conflict:
      $call:
        - try
        - {$call: [inherit, child, {$call: [list, {$ref: first}, {$ref: second}]}, {}]}
        - {$call: [fn, [error], {$ref: error}]}
    resolved:
      $call:
        - realize
        - {$call: [extend, child, {$call: [list, {$ref: first}, {$ref: second}]}, {$call: [record, port, {$ref: integer}]}, {port: 443}]}
