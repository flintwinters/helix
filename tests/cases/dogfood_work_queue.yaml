# Helix explicit syntax; migrated from legacy source.
# Stable priority ordering using the shared Helix standard-library sort.
# Lower numbers run first; equal priorities retain arrival order.
# Insertion uses until rather than recursion, so queue length does not consume
# the function-call depth budget. This is intentionally a small-queue algorithm.
# Insertion scans and copies each prefix: quadratic work, unsuitable for large queues.
# The lazy or guard prevents an out-of-range read when appending at the end.
"queue":
- "id": "docs"
  "priority": 3
  "owner": "writer"
- "id": "parser-fix"
  "priority": 1
  "owner": "runtime"
- "id": "release"
  "priority": 2
  "owner": "tools"
- "id": "evaluator-fix"
  "priority": 1
  "owner": "runtime"
- "id": "security"
  "priority": -1
  "owner": "runtime"
- "id": "cleanup"
  "priority": 3
  "owner": "tools"
"lists": {"$call": ["import", "std:list"]}
"sort_queue":
  "$call":
  - "fn"
  - - "items"
  - "$call":
    - "lists.sort_by"
    - {"$ref": "items"}
    - "$call":
      - "fn"
      - - "a"
        - "b"
      - "$call":
        - "lt"
        - {"$call": ["get", {"$ref": "a"}, "priority"]}
        - {"$call": ["get", {"$ref": "b"}, "priority"]}
"sorted": {"$call": ["sort_queue", {"$ref": "queue"}]}
"dispatch":
  "$call":
  - "map"
  - {"$call": ["fn", ["item"], {"$call": ["get", {"$ref": "item"}, "id"]}]}
  - {"$ref": "sorted"}
"idempotent": {"$call": ["eq", {"$call": ["sort_queue", {"$ref": "sorted"}]}, {"$ref": "sorted"}]}
"empty": {"$call": ["sort_queue", []]}
"singleton": {"$call": ["sort_queue", [{"id": "only", "priority": 0, "owner": "tools"}]]}
"already_sorted":
  "$call":
  - "sort_queue"
  - - "id": "first"
      "priority": -2
    - "id": "second"
      "priority": 0
    - "id": "third"
      "priority": 4
"reverse_sorted":
  "$call":
  - "sort_queue"
  - - "id": "third"
      "priority": 4
    - "id": "second"
      "priority": 0
    - "id": "first"
      "priority": -2
"equal_priority":
  "$call":
  - "sort_queue"
  - - "id": "arrived-first"
      "priority": 2
      "payload":
        "attempts": 0
    - "id": "arrived-second"
      "priority": 2
      "payload":
        "attempts": 1
    - "id": "arrived-third"
      "priority": 2
      "payload":
        "attempts": 2
"second_queue": {"$call": ["sort_queue", [{"id": "later", "priority": 10}, {"id": "earlier", "priority": -10}]]}
"original_order": {"$call": ["map", {"$call": ["fn", ["item"], {"$call": ["get", {"$ref": "item"}, "id"]}]}, {"$ref": "queue"}]}
