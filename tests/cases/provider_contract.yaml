# Deterministic charter contract; host acceptance lives in the corresponding suite.
!call
  - let
  - provider: !call [import, "std:provider"]
    spec:
      apply: !call
        - fn
        - [args, steps]
        - ~
      arguments: !ref string
      capabilities: [file_read, file_write]
      check: true
      diff: true
      failure: stop
      id: test.content
      observation: !ref string
      observe: !call
        - fn
        - [args]
        - old
      plan: !call
        - fn
        - [args, before]
        - !call
            - if
            - !call [eq, !ref args, !ref before]
            - []
            - !call [list, !call [dict, field, /content, op, set, to, !ref args]]
      platforms: [test-linux]
      result: !call [literal, ~]
      revision: "1.0.0"
      version: 1
  - changed: !call
      - provider.plan
      - !ref spec
      - new
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
    invalid_arguments: !call
      - provider.plan
      - !ref spec
      - 42
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
    missing_capabilities: !call
      - provider.plan
      - !ref spec
      - new
      - old
      - !literal {allow_remove: false, capabilities: [], managed: true, platform: test-linux}
    noop_apply: !call
      - provider.apply
      - !ref spec
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
      - !call
          - provider.plan
          - !ref spec
          - old
          - old
          - !literal
              allow_remove: false
              capabilities: [file_read, file_write]
              managed: true
              platform: test-linux
    removal_allowed: !call
      - provider.plan
      - !call
          - set
          - !ref spec
          - plan
          - !call
              - fn
              - [args, before]
              - !literal [{field: /content, op: remove, to: ~}]
      - new
      - old
      - !literal
          allow_remove: true
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
    removal_denied: !call
      - provider.plan
      - !call
          - set
          - !ref spec
          - plan
          - !call
              - fn
              - [args, before]
              - !literal [{field: /content, op: remove, to: ~}]
      - new
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
    stale_review: !call
      - provider.apply
      - !ref spec
      - new
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
      - !call
          - provider.plan
          - !ref spec
          - new
          - stale
          - !literal
              allow_remove: false
              capabilities: [file_read, file_write]
              managed: true
              platform: test-linux
    unchanged: !call
      - provider.plan
      - !ref spec
      - old
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
    unmanaged: !call
      - provider.plan
      - !ref spec
      - new
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: false
          platform: test-linux
    unmet_postcondition: !call
      - provider.apply
      - !ref spec
      - new
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
      - !call
          - provider.plan
          - !ref spec
          - new
          - old
          - !literal
              allow_remove: false
              capabilities: [file_read, file_write]
              managed: true
              platform: test-linux
    unsupported_platform: !call
      - provider.plan
      - !ref spec
      - new
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: other
    unsupported_preview: !call
      - provider.plan
      - !call [set, !ref spec, check, false]
      - new
      - old
      - !literal
          allow_remove: false
          capabilities: [file_read, file_write]
          managed: true
          platform: test-linux
