# Keep helpers local; this fixture tests results, not module inspection.
!call
  - let
  # Helix explicit syntax; migrated from legacy source.
  - add_null: !call
      - t.equal
      - !call [d.compare, {}, {"n": ~}]
      - {added: ["n"], changed: [], removed: []}
    d: !call [import, "std:diff"]
    empty: !call [t.equal, !call [d.compare, {}, {}], {added: [], changed: [], removed: []}]
    identity: !call
      - t.equal
      - !call [d.compare, !ref old, !ref old]
      - {added: [], changed: [], removed: []}
    new: {"": 0, a: false, nested: {x: 2}, same: [~, false, 0], z: ~, "🙂": ~}
    numeric_equality: !call
      - t.equal
      - !call [d.compare, {"n": 1}, {"n": 1.0}]
      - {added: [], changed: [], removed: []}
    old: {"": false, gone: ~, nested: {x: 1}, same: [~, false, 0], z: ~}
    ordered: !call
      - t.equal
      - !ref report
      - added: [a, "🙂"]
        changed: [{after: 0, before: false, key: ""}, {after: {x: 2}, before: {x: 1}, key: nested}]
        removed: [gone]
    remove_null: !call
      - t.equal
      - !call [d.compare, {"n": ~}, {}]
      - {added: [], changed: [], removed: ["n"]}
    reordered: !call
      - t.equal
      - !call [d.compare, {a: 1, b: 2}, {a: 1, b: 2}]
      - {added: [], changed: [], removed: []}
    report: !call [d.compare, !ref old, !ref new]
    t: !call [import, "std:test"]
    wrong_arity: !call
      - try
      - !call [d.compare, {}]
      - !call
          - fn
          - [e]
          - !call [get, !ref e, kind]
    wrong_new: !call
      - try
      - !call [d.compare, {}, ~]
      - !call
          - fn
          - [e]
          - !call [get, !ref e, kind]
    wrong_old: !call
      - try
      - !call [d.compare, [], {}]
      - !call
          - fn
          - [e]
          - !call [get, !ref e, kind]
  - !call
      - dict
      - add_null
      - !ref add_null
      - empty
      - !ref empty
      - identity
      - !ref identity
      - numeric_equality
      - !ref numeric_equality
      - ordered
      - !ref ordered
      - remove_null
      - !ref remove_null
      - reordered
      - !ref reordered
      - report
      - !ref report
      - wrong_arity
      - !ref wrong_arity
      - wrong_new
      - !ref wrong_new
      - wrong_old
      - !ref wrong_old
