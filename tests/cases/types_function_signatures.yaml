# Function types describe parameters and result, higher-order ones included. A function inhabits one
# when its declared annotations prove it: parameters contravariant, result covariant. An
# unannotated parameter accepts anything; an unannotated result promises nothing (`any`).
applied: !call [twice, !ref inc, 3]
caught:
  not_a_type: !call
    - try
    - !call [function_of, integer, integer]
    - !call
        - fn
        - [e]
        - !call [get, !ref e, message]
  unannotated_callback: !call
    - try
    - !call [twice, !ref plain, 3]
    - !call
        - fn
        - [e]
        - !call [get, !ref e, message]
  wrong_callback: !call
    - try
    - !call [twice, !ref show, 3]
    - !call
        - fn
        - [e]
        - !call [get, !ref e, message]
explained: !call [violations, !ref plain, !ref int_to_int]
inc: !call
  - fn
  - [["n", integer]]
  - !call [add, !ref "n", 1]
  - integer
int_to_int: !call [function_of, [integer], integer]
members:
  arity_mismatch: !call [is, !ref inc, !call [function_of, [integer, integer], integer]]
  bare_function: !call [is, !ref inc, function]
  exact: !call [is, !ref inc, !ref int_to_int]
  higher_order: !call [is, !ref twice, !call [function_of, [!ref int_to_int, integer], integer]]
  not_a_function: !call [is, 3, !ref int_to_int]
  param_mismatch: !call [is, !ref inc, !call [function_of, [string], integer]]
  unannotated_result: !call [is, !ref plain, !ref int_to_int]
  wider_param_narrower_use: !call [is, !ref show, !call [function_of, [integer], string]]
order:
  callback_param_flips: !call
    - subtype
    - !call [function_of, [!ref int_to_int], integer]
    - !call [function_of, [!call [function_of, [any], integer]], integer]
  function_not_below_narrower: !call [subtype, function, !ref int_to_int]
  narrower_below_function: !call [subtype, !ref int_to_int, function]
  param_contravariant: !call [subtype, !call [function_of, [any], integer], !ref int_to_int]
  param_not_covariant: !call [subtype, !ref int_to_int, !call [function_of, [any], integer]]
  result_covariant: !call
    - subtype
    - !call [function_of, [integer], integer]
    - !call [function_of, [integer], !call [union, integer, string]]
plain: !call
  - fn
  - ["n"]
  - !ref "n"
show: !call
  - fn
  - [["n", any]]
  - !call [str, !ref "n"]
  - string
twice: !call
  - fn
  - [[f, !ref int_to_int], [x, integer]]
  - !call [f, !call [f, !ref x]]
  - integer
