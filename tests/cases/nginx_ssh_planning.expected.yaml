root:
  applied: false
  args:
    content: "Hello over SSH\n"
    package_version: pinned-test-version
    port: 8080
    server_name: helix.remote
    ssh_target: fixture
    state: present
  before:
    files:
      /etc/helix-nginx/nginx.conf: ~
      /etc/helix-nginx/server.conf: ~
      /var/lib/helix-nginx/index.html: ~
    package_version: ~
    response: ~
    service:
      activation: ~
      running: false
    target: remote-fixture-one
  context:
    allow_remove: false
    capabilities:
      - ssh_command
    managed: true
    platform: debian-container
  dependencies:
    handlers: {}
    resources:
      configuration:
        notify: []
        requires:
          - package
      content:
        notify: []
        requires:
          - package
          - configuration
      package:
        notify: []
        requires: []
      service:
        notify: []
        requires:
          - package
          - configuration
          - content
    version: 1
  phase: plan
  provider: ssh.debian.nginx
  revision: "1"
  status: changed
  steps:
    - field: package
      from: ~
      op: set
      to: pinned-test-version
    - field: configuration
      from:
        /etc/helix-nginx/nginx.conf: ~
        /etc/helix-nginx/server.conf: ~
      op: set
      to:
        /etc/helix-nginx/nginx.conf:
          content: "# helix.remote\nworker_processes 1;\npid /run/helix-nginx/nginx.pid;\nerror_log stderr;\nevents { worker_connections 64; }\nhttp { include /etc/helix-nginx/server.conf; }\n"
          gid: 0
          mode: 420
          uid: 0
        /etc/helix-nginx/server.conf:
          content: "server { listen 8080; server_name helix.remote; add_header X-Helix-Activation \"1:helix.remote:8080\" always; root /var/lib/helix-nginx; location / { try_files /index.html =404; } }\n"
          gid: 0
          mode: 420
          uid: 0
    - field: content
      from: ~
      op: set
      to:
        content: "Hello over SSH\n"
        gid: 0
        mode: 420
        uid: 0
    - field: service
      from:
        activation: ~
        configuration_pending: false
        response: ~
        running: false
      op: set
      to:
        activation: "1:helix.remote:8080"
        configuration_pending: false
        response:
          body: "Hello over SSH\n"
          status: 200
        running: true
