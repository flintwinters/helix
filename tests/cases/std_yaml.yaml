- let
- y: [import, std:yaml]
- parsed: [y.parse, 'a: [add, missing, 1]']
  updated: [y.set_in, {a: [1, 2]}, [list, "a", 1], false]
  selected: [y.get_in, {a: [null, false]}, [list, "a", 0]]
  dumped: [y.dump, {a: [1, false]}]
  invalid: [y.valid, "1\n---\n2"]
  wrong_type: [try, [y.parse, 1], [fn, [error], [get, error, "kind"]]]
  malformed: [try, [y.parse, "["], [fn, [error], [get, error, "kind"]]]
