# Helix explicit syntax; migrated from legacy source.
"a": 3
"b": 5
"lt": {"$call": ["lt", {"$ref": "a"}, {"$ref": "b"}]}
"le": {"$call": ["le", {"$ref": "a"}, 3]}
"gt": {"$call": ["gt", {"$ref": "a"}, {"$ref": "b"}]}
"ge": {"$call": ["ge", {"$ref": "a"}, 4]}
"eq_int": {"$call": ["eq", {"$ref": "a"}, 3]}
"ne_int": {"$call": ["ne", {"$ref": "a"}, {"$ref": "b"}]}
"eq_str": {"$call": ["eq", "x", "x"]}
"eq_mixed": {"$call": ["eq", {"$ref": "a"}, "3"]}
"eq_list": {"$call": ["eq", {"$call": ["add", 1, 1]}, 2]}
