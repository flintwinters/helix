# Helix explicit syntax; migrated from legacy source.
empty: !call [shim.report, []]
files:
  - {directory: src, path: src/vm.rs}
  - {directory: std, path: std/group.yaml}
  - {directory: src, path: "src/雪.rs"}
  - {directory: ".", path: README.md}
order: !call
  - assert
  - !call
      - eq
      - !call
          - map
          - !call
              - fn
              - [row]
              - !call [get, !ref row, directory]
          - !ref report
      - [".", src, std]
report: !call [shim.report, !ref files]
shim: !call [import, "../../tooling/inventory.yaml"]
