# Handle only the kinds you expect; re-raise anything else so it is not swallowed.
handle: [fn, [e], [cond, [eq, [get, e, "kind"], "transient"], "retry", [eq, [get, e, "kind"], "divide_by_zero"], "zero", [raise, e]]]
transient: [try, [raise, "transient", "try again"], handle]
builtin: [try, [div, 1, 0], handle]
reraised: [try, [try, [raise, "fatal", "disk gone"], handle], [fn, [e], [get, e, "kind"]]]
