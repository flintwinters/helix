# Dogfood: word frequency over inline text. There is no `split`, so words are cut out one
# character at a time with a fold carrying `{words, word}`.
text: "the cat and the hat and the bat sat on the mat"
range: [fn, [lo, hi], [until, [fn, [xs], [eq, [len, xs], [sub, hi, lo]]], [fn, [xs], [append, xs, [add, lo, [len, xs]]]], []]]
chars: [fn, [s], [map, [fn, [i], [slice, s, i, [add, i, 1]]], [range, 0, [len, s]]]]
# Keys are quoted: an unquoted `words` here would resolve to the map entry being built.
flush:
  [fn, [acc],
    [if, [eq, [get, acc, "word"], ""],
      acc,
      {words: [append, [get, acc, "words"], [get, acc, "word"]], word: ""}]]
step:
  [fn, [acc, c],
    [if, [eq, c, " "],
      [flush, acc],
      [set, acc, "word", [concat, [get, acc, "word"], c]]]]
split: [fn, [s], [get, [flush, [fold, step, {words: [], word: ""}, [chars, s]]], "words"]]
words: [split, text]
counts: [fold, [fn, [acc, w], [set, acc, w, [add, [get, acc, w, 0], 1]]], {}, words]
distinct: [len, [keys, counts]]
