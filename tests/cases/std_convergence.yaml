# Production builtin and direct module contracts without exporting helper functions.
!call
  - let
  - c: !call [import, "std:convergence"]
    configured: !call
      - realize
      - !call
          - class
          - managed
          - !call [record, a, !ref any, nested, !ref map, z, !ref boolean]
          - !ref wanted
    empty: !call [t.equal, !call [c.plan, {}, {extra: keep}], []]
    expected_report: !call
      - t.equal
      - !ref report
      - changed: {nested: {have: {x: 1}, want: {x: 2}}, z: {have: ~, want: false}}
        extra: {extra: keep}
        missing: {a: ~}
    expected_steps: !call
      - t.equal
      - !ref steps
      -
        - {field: a, op: set, to: ~}
        - {field: nested, from: {x: 1}, op: set, to: {x: 2}}
        - {field: z, from: ~, op: set, to: false}
    no_change: !call
      - t.equal
      - !call [converge, !ref configured, {a: ~, extra: keep, nested: {x: 2}, z: false}]
      - []
    observed: {extra: keep, nested: {x: 1}, z: ~}
    plan_agrees: !call [t.equal, !ref steps, !call [c.plan, !ref wanted, !ref observed]]
    policy_agrees: !call [t.equal, !ref report, !call [c.compare, !ref wanted, !ref observed]]
    pure: !call [type_time, !call [c.plan, {"n": 1}, {extra: true, "n": 1.0}]]
    report: !call [drift, !ref configured, !ref observed]
    steps: !call [converge, !ref configured, !ref observed]
    t: !call [import, "std:test"]
    wanted: {a: ~, nested: {x: 2}, z: false}
  - !call
      - dict
      - report
      - !ref report
      - steps
      - !ref steps
      - policy_agrees
      - !ref policy_agrees
      - plan_agrees
      - !ref plan_agrees
      - expected_report
      - !ref expected_report
      - expected_steps
      - !ref expected_steps
      - no_change
      - !ref no_change
      - pure
      - !ref pure
      - empty
      - !ref empty
