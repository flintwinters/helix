# Helix explicit syntax; migrated from legacy source.
basic: !call [t.split, "one::two::three", "::"]
combining: !call [t.split, "é/é", /]
empty_fields: !call [t.split, "::a::::", "::"]
empty_join: !call [t.join, [], "|"]
empty_separator: !call [t.join, ["🙂", "世界"], ""]
empty_source: !call [t.split, "", ","]
empty_split_separator: !call
  - try
  - !call [t.split, abc, ""]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
joined: !call [t.join, !ref basic, "::"]
leading_empty: !call [t.join, ["", a, ""], ":"]
no_match: !call [t.split, abc, abcd]
overlap: !call [t.split, aaaaa, aa]
roundtrip: !call [assert, !call [eq, !call [t.join, !ref empty_fields, "::"], "::a::::"]]
single: !call [t.join, [hello], "|"]
t: !call [import, "std:text"]
unicode: !call [t.split, "🙂é🙂世界🙂", "🙂"]
wrong_arity: !call
  - try
  - !call [t.split, abc]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_element: !call
  - try
  - !call [t.join, [a, 1], ","]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_empty_join_separator: !call
  - try
  - !call [t.join, [], ~]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_parts: !call
  - try
  - !call [t.join, abc, ","]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_separator: !call
  - try
  - !call [t.split, abc, 1]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_source: !call
  - try
  - !call [t.split, [], ","]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
