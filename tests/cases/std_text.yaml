t: [import, std:text]
basic: [t.split, "one::two::three", "::"]
empty_fields: [t.split, "::a::::", "::"]
empty_source: [t.split, "", ","]
no_match: [t.split, "abc", "abcd"]
overlap: [t.split, "aaaaa", "aa"]
unicode: [t.split, "🙂é🙂世界🙂", "🙂"]
combining: [t.split, "é/é", "/"]
joined: [t.join, basic, "::"]
empty_join: [t.join, [], "|"]
single: [t.join, ["hello"], "|"]
empty_separator: [t.join, ["🙂", "世界"], ""]
leading_empty: [t.join, ["", "a", ""], ":"]
roundtrip: [assert, [eq, [t.join, empty_fields, "::"], "::a::::"]]
empty_split_separator: [try, [t.split, "abc", ""], [fn, [e], [get, e, "kind"]]]
wrong_source: [try, [t.split, [], ","], [fn, [e], [get, e, "kind"]]]
wrong_separator: [try, [t.split, "abc", 1], [fn, [e], [get, e, "kind"]]]
wrong_parts: [try, [t.join, "abc", ","], [fn, [e], [get, e, "kind"]]]
wrong_element: [try, [t.join, ["a", 1], ","], [fn, [e], [get, e, "kind"]]]
wrong_empty_join_separator: [try, [t.join, [], null], [fn, [e], [get, e, "kind"]]]
wrong_arity: [try, [t.split, "abc"], [fn, [e], [get, e, "kind"]]]
