m: [import, std:map]
left: {z: 1, shared: {old: true}, absent: null}
right: {shared: {new: true}, a: false}
merged: [m.merge, left, right]
merge_order: [assert, [eq, [keys, merged], ["z", "shared", "absent", "a"]]]
shallow: [assert, [eq, [get, merged, "shared"], {new: true}]]
unchanged: [assert, [eq, [get, left, "shared"], {old: true}]]
empty_merge: [m.merge, {}, {}]
left_identity: [assert, [eq, [m.merge, {}, left], left]]
right_identity: [assert, [eq, [m.merge, left, {}], left]]
removed: [m.remove, merged, "shared"]
remove_order: [assert, [eq, [keys, removed], ["z", "absent", "a"]]]
missing: [assert, [eq, [m.remove, left, "missing"], left]]
empty_remove: [m.remove, {}, "x"]
only_key: [m.remove, {x: 1}, "x"]
unicode: [m.remove, [m.merge, {"": 1, "é": 2}, {"é": [null, false], "🙂": 3}], ""]
remove_null: [assert, [not, [has, [m.remove, left, "absent"], "absent"]]]
idempotent: [assert, [eq, [m.remove, removed, "shared"], removed]]
wrong_left: [try, [m.merge, [], {}], [fn, [e], [get, e, "kind"]]]
wrong_right: [try, [m.merge, {}, null], [fn, [e], [get, e, "kind"]]]
wrong_source: [try, [m.remove, [], "x"], [fn, [e], [get, e, "kind"]]]
wrong_key: [try, [m.remove, {}, 1], [fn, [e], [get, e, "kind"]]]
wrong_arity: [try, [m.merge, {}], [fn, [e], [get, e, "kind"]]]
