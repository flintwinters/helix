# Helix explicit syntax; migrated from legacy source.
empty_merge: !call [m.merge, {}, {}]
empty_remove: !call [m.remove, {}, x]
idempotent: !call [assert, !call [eq, !call [m.remove, !ref removed, shared], !ref removed]]
left: {absent: ~, shared: {old: true}, z: 1}
left_identity: !call [assert, !call [eq, !call [m.merge, {}, !ref left], !ref left]]
m: !call [import, "std:map"]
merge_order: !call [assert, !call [eq, !call [keys, !ref merged], [a, absent, shared, z]]]
merged: !call [m.merge, !ref left, !ref right]
missing: !call [assert, !call [eq, !call [m.remove, !ref left, missing], !ref left]]
only_key: !call [m.remove, {x: 1}, x]
remove_null: !call [assert, !call [not, !call [has, !call [m.remove, !ref left, absent], absent]]]
remove_order: !call [assert, !call [eq, !call [keys, !ref removed], [a, absent, z]]]
removed: !call [m.remove, !ref merged, shared]
right: {a: false, shared: {new: true}}
right_identity: !call [assert, !call [eq, !call [m.merge, !ref left, {}], !ref left]]
shallow: !call [assert, !call [eq, !call [get, !ref merged, shared], {new: true}]]
unchanged: !call [assert, !call [eq, !call [get, !ref left, shared], {old: true}]]
unicode: !call [m.remove, !call [m.merge, {"": 1, "é": 2}, {"é": [~, false], "🙂": 3}], ""]
wrong_arity: !call
  - try
  - !call [m.merge, {}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_key: !call
  - try
  - !call [m.remove, {}, 1]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_left: !call
  - try
  - !call [m.merge, [], {}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_right: !call
  - try
  - !call [m.merge, {}, ~]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
wrong_source: !call
  - try
  - !call [m.remove, [], x]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
