# Plan repository checks through the reusable dependency library.
deps: [import, std:dependency]
# Diamond dependencies are deliberately supplied out of execution order.
checks: [deps.plan, {test: ["build"], lint: ["build"], review: ["test", "lint"], build: []}]
missing: [deps.plan, {test: ["compile"], docs: []}]
cycle: [deps.plan, {a: ["b"], b: ["a"], downstream: ["a"], independent: []}]
self_cycle: [deps.plan, {self: ["self"]}]
empty: [deps.plan, {}]
