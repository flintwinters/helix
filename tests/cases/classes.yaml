in_port: [fn, [n], [and, [ge, n, 1], [le, n, 65535]]]
port: [refine, integer, in_port]
machine: [class, "machine", [record, "hostname", string]]
has_ssh: [class, "has_ssh", [record, "ssh_port", [default, port, 22]]]
server: [extend, "server", [list, machine], [record, "packages", [list_of, string]], {}]
web01: [inherit, "web01", [list, server, has_ssh], {hostname: "web01", packages: ["nginx"]}]
web02: [inherit, "web02", [list, server, has_ssh], {hostname: "web02", packages: [], ssh_port: 2222}]
parents_of: [parents, web01]
server_fields: [fields, server]
not_yet: [try, [inherit, "bare", [list, server], {hostname: "bare"}], [fn, [e], e]]
wrong_value: [try, [inherit, "bad", [list, machine], {hostname: 5}], [fn, [e], e]]
undeclared: [try, [inherit, "typo", [list, machine], {hostnam: "x"}], [fn, [e], [get, e, "message"]]]
realized_twice: [eq, [realize, web01], web01]
abstract_stays: [get, server, "concrete"]
