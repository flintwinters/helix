# A refinement predicate has three distinct outcomes: false rejects the value,
# a non-boolean result or a raised error reports that the check failed to run,
# and the predicate is never invoked when the base type already rejects the value.
# Each outcome is reported as ordinary violation data at the offending path.
positive: {$call: [fn, [n], {$call: [gt, {$ref: n}, 0]}]}
returns_integer: {$call: [fn, [n], {$ref: n}]}
divides_by_zero: {$call: [fn, [n], {$call: [div, 1, 0]}]}
rejects: {$call: [refine, {$ref: integer}, {$ref: positive}]}
non_boolean: {$call: [refine, {$ref: integer}, {$ref: returns_integer}]}
raising: {$call: [refine, {$ref: integer}, {$ref: divides_by_zero}]}
accepted: {$call: [violations, 1, {$ref: rejects}]}
rejected: {$call: [violations, -1, {$ref: rejects}]}
base_gates_predicate: {$call: [violations, x, {$ref: raising}]}
non_boolean_result: {$call: [violations, 1, {$ref: non_boolean}]}
raised_error: {$call: [violations, 1, {$ref: raising}]}
element_paths: {$call: [violations, [1, -2, x, 3, 0], {$call: [list_of, {$ref: rejects}]}]}
field_paths:
  $call:
    - violations
    - {low: 0, high: 2}
    - $call: [record, high, {$ref: rejects}, low, {$ref: rejects}]
caught_rejection:
  $call:
    - try
    - $call: [expect, -1, {$ref: rejects}]
    - $call: [fn, [e], {$call: [get, {$ref: e}, data]}]
caught_non_boolean:
  $call:
    - try
    - $call: [expect, 1, {$ref: non_boolean}]
    - $call: [fn, [e], {$call: [get, {$ref: e}, data]}]
