!call
  - let
  - config:
      content: "Hello\n"
      package_version: pinned-test-version
      port: 8080
      server_name: helix.local
      state: present
    empty:
      files:
        /etc/helix-nginx/nginx.conf: ~
        /etc/helix-nginx/server.conf: ~
        /var/lib/helix-nginx/index.html: ~
      package_version: ~
      response: ~
      service: {activation: ~, running: false}
      target: fixture-one
    nginx: !call [import, "std:nginx"]
    settled:
      files:
        /etc/helix-nginx/nginx.conf:
          content: "# helix.local\nworker_processes 1;\npid /run/helix-nginx/nginx.pid;\nerror_log stderr;\nevents { worker_connections 64; }\nhttp { include /etc/helix-nginx/server.conf; }\n"
          gid: 0
          mode: 420
          uid: 0
        /etc/helix-nginx/server.conf:
          content: "server { listen 8080; server_name helix.local; add_header X-Helix-Activation \"1:helix.local:8080\" always; root /var/lib/helix-nginx; location / { try_files /index.html =404; } }\n"
          gid: 0
          mode: 420
          uid: 0
        /var/lib/helix-nginx/index.html: {content: "Hello\n", gid: 0, mode: 420, uid: 0}
      package_version: pinned-test-version
      response: {body: "Hello\n", status: 200}
      service: {activation: "1:helix.local:8080", running: true}
      target: fixture-one
    step_names: !call
      - fn
      - [report]
      - !call
          - if
          - !call [has, [changed, unchanged], !ref report.status]
          - !call
              - map
              - !call
                  - fn
                  - [step]
                  - !ref step.field
              - !ref report.steps
          - !ref report
  - absent_no_op: !call
      - step_names
      - !call [nginx.plan, !call [set, !ref config, state, absent], !ref empty]
    configuration: !call
      - step_names
      - !call [nginx.plan, !call [set, !ref config, server_name, other.local], !ref settled]
    content_only: !call
      - step_names
      - !call [nginx.plan, !call [set, !ref config, content, "Changed\n"], !ref settled]
    dependencies: !call [get, !call [nginx.plan, !ref config, !ref empty], dependencies]
    initial: !call [step_names, !call [nginx.plan, !ref config, !ref empty]]
    invalid_port: !call
      - try
      - !call [nginx.resolve, !call [set, !ref config, port, 0]]
      - !call
          - fn
          - [error]
          - !ref error.kind
    invalid_server_name: !call
      - try
      - !call [nginx.resolve, !call [set, !ref config, server_name, "bad; injected"]]
      - !call
          - fn
          - [error]
          - !ref error.kind
    missing_dependencies: !call
      - get
      - !call [get, !call [nginx.apply, !ref config, {}], error]
      - kind
    no_op: !call [step_names, !call [nginx.plan, !ref config, !ref settled]]
    public_exports: !call [keys, !ref nginx]
    removal: !call
      - step_names
      - !call [nginx.plan, !call [set, !ref config, state, absent], !ref settled]
    stopped: !call
      - step_names
      - !call
          - nginx.plan
          - !ref config
          - !call
              - set
              - !call [set, !ref settled, service, {activation: ~, running: false}]
              - response
              - ~
    tampered_dependencies: !call
      - get
      - !call
          - get
          - !call
              - nginx.apply
              - !ref config
              - !call [set, !call [nginx.plan, !ref config, !ref empty], dependencies, {}]
          - error
      - kind
