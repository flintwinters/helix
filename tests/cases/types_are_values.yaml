# Helix explicit syntax; migrated from legacy source.
anything: !call [is, ~, any]
bound: !call
  - let
  - {t: integer}
  - !call [is, 3, !ref t]
by_map: {name: string, port: integer}
check: !call
  - fn
  - [v, t]
  - !call [is, !ref v, !ref t]
from_type: !call [is, !call [type, [1]], !call [get, !ref by_map, name]]
kinds: [integer, string, list]
mismatch: !call [check, 1.5, integer]
stored: !call
  - map
  - !call
      - fn
      - [t]
      - !call [is, 1, !ref t]
  - !ref kinds
via_fn: !call [check, x, string]
