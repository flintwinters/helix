# Helix explicit syntax; migrated from legacy source.
# User-raised errors have the builtin error shape; `data` rides along.
"custom":
  "$call":
  - "try"
  - {"$call": ["raise", "out_of_stock", "no widgets left", {"item": "widget", "wanted": 3}]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
"kind":
  "$call":
  - "try"
  - {"$call": ["raise", "custom", "boom"]}
  - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "kind"]}]}
"payload":
  "$call":
  - "try"
  - {"$call": ["raise", "custom", "boom", [1, 2]]}
  - {"$call": ["fn", ["e"], {"$call": ["get", {"$ref": "e"}, "data"]}]}
