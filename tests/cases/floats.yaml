# Helix explicit syntax; migrated from legacy source.
equal_across_types: !call [eq, 1, 1.0]
exponent: !call [mul, 1000.0, 2]
int_division_stays_int: !call [div, 7, 2]
mixed_order: !call [lt, 3, !ref pi]
negated: !call [neg, !ref pi]
negated_int: !call [neg, 4]
parsed_float: !call [float, "2.50"]
parsed_int: !call [int, " 42 "]
pi: 3.5
product: !call [mul, 2, 0.25]
quotient: !call [div, 7.0, 2]
remainder: !call [mod, 7.5, 2]
sum: !call [add, !ref pi, 1]
truncated: !call [int, -2.9]
whole: 2.0
widened: !call [float, 3]
