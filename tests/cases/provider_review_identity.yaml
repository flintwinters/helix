# Review matching preserves representations; exact matches reach the callback.
!call
  - let
  - context: {allow_remove: false, capabilities: [], managed: true, platform: test}
    outcome: !call
      - fn
      - [reviewed_args, current_args]
      - !call
          - get
          - !call
              - get
              - !call
                  - provider.apply
                  - !ref spec
                  - !ref current_args
                  - !ref context
                  - !call [provider.plan, !ref spec, !ref reviewed_args, old, !ref context]
              - error
          - kind
    provider: !call [import, "std:provider"]
    spec:
      apply: !call
        - fn
        - [args, steps]
        - !call [raise, apply_reached, exact review reached application]
      arguments: map
      capabilities: []
      check: true
      diff: true
      failure: stop
      id: review.identity
      observation: string
      observe: !call
        - fn
        - [args]
        - old
      plan: !call
        - fn
        - [args, before]
        - [{field: value, op: set, to: {nested: [1]}}]
      platforms: [test]
      result: any
      revision: "1"
      version: 1
  - changed_step: !call
      - let
      - {review: !call [provider.plan, !ref spec, {}, old, !ref context]}
      - !call
          - get
          - !call
              - get
              - !call
                  - provider.apply
                  - !ref spec
                  - {}
                  - !ref context
                  - !call [set, !ref review, steps, [{field: value, op: set, to: {nested: [1.0]}}]]
              - error
          - kind
    exact: !call [outcome, {label: retained, nested: [1]}, {label: retained, nested: [1]}]
    numeric_kind: !call [outcome, {nested: [1]}, {nested: [1.0]}]
    signed_zero: !call [outcome, {nested: [0.0]}, {nested: [-0.0]}]
