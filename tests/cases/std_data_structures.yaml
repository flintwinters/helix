sets:
  - let
  - s: [import, std:set]
  - [list, [s.union, [list, 2, 1, 2], [list, 3, 1]], [s.intersection, [list, null, false, null], [list, null]], [s.difference, [list, 1, 2, 1], [list, 2]]]
stack:
  - let
  - s: [import, std:stack]
    xs: [s.push, [s.push, [], null], false]
  - [list, [s.peek, xs, "empty"], [s.pop, xs], [s.peek, [], "empty"]]
queue:
  - let
  - q: [import, std:queue]
    xs: [q.enqueue, [q.enqueue, [], null], false]
  - [list, [q.peek, xs, "empty"], [q.dequeue, xs], [q.peek, [], "empty"]]
