# Helix explicit syntax; migrated from legacy source.
"sets":
  "$call":
  - "let"
  - "s": {"$call": ["import", "std:set"]}
  - "$call":
    - "list"
    - {"$call": ["s.union", {"$call": ["list", 2, 1, 2]}, {"$call": ["list", 3, 1]}]}
    - {"$call": ["s.intersection", {"$call": ["list", null, false, null]}, {"$call": ["list", null]}]}
    - {"$call": ["s.difference", {"$call": ["list", 1, 2, 1]}, {"$call": ["list", 2]}]}
"stack":
  "$call":
  - "let"
  - "s": {"$call": ["import", "std:stack"]}
    "xs": {"$call": ["s.push", {"$call": ["s.push", [], null]}, false]}
  - "$call":
    - "list"
    - {"$call": ["s.peek", {"$ref": "xs"}, "empty"]}
    - {"$call": ["s.pop", {"$ref": "xs"}]}
    - {"$call": ["s.peek", [], "empty"]}
"queue":
  "$call":
  - "let"
  - "q": {"$call": ["import", "std:queue"]}
    "xs": {"$call": ["q.enqueue", {"$call": ["q.enqueue", [], null]}, false]}
  - "$call":
    - "list"
    - {"$call": ["q.peek", {"$ref": "xs"}, "empty"]}
    - {"$call": ["q.dequeue", {"$ref": "xs"}]}
    - {"$call": ["q.peek", [], "empty"]}
