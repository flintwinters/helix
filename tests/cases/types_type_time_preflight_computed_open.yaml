# The selector occurs only in a computed call head; it still makes the region open.
!call
  - let
  - choose: !call
      - fn
      - [forward]
      - !call
          - type_time
          - !call
              - !call
                  - if
                  - !ref forward
                  - !ref increment
                  - !ref decrement
              - 41
    decrement: !call
      - fn
      - ["n"]
      - !call [sub, !ref "n", 1]
    increment: !call
      - fn
      - ["n"]
      - !call [add, !ref "n", 1]
  - !call [list, !call [choose, true], !call [choose, false]]
