# A replacement discards its old field; malformed surviving fields are rejected.
!call
  - let
  - kind: !call
      - fn
      - [error]
      - !call [get, !ref error, kind]
    malformed: {fields: {bad: 3, kept: boolean}, type: record}
    raising: !call
      - fn
      - [value]
      - !call [raise, predicate_ran, declaration invoked its predicate]
  - nested: !call
      - try
      - !call
          - with_field
          - {fields: {bad: {of: {of: 3, type: list}, type: optional}}, type: record}
          - good
          - string
      - !ref kind
    predicate_not_run: !call
      - keys
      - !call
          - get
          - !call
              - with_field
              - !call [record, guarded, !call [refine, integer, !ref raising]]
              - added
              - string
          - fields
    repaired: !call [with_field, !ref malformed, bad, integer]
    retained: !call
      - try
      - !call [with_field, !ref malformed, good, string]
      - !ref kind
