machine: [class, "machine", [record, "hostname", string, "role", [enum, "web", "db"], "port", [default, integer, 22], "token", secret]]
web1: [inherit, "web1", [list, machine], {hostname: "w1", role: "web", token: [secret, "vault/web"]}]
web2: [inherit, "web2", [list, machine], {hostname: "w2", role: "web", port: 2200, token: [secret, "vault/web"]}]
db1: [inherit, "db1", [list, machine], {hostname: "db1", role: "db", token: [secret, "vault/db"]}]
inline_secret: [try, [inherit, "leak", [list, machine], {hostname: "x", role: "db", token: "hunter2"}], [fn, [e], [get, e, "data"]]]
fleet: [list, web1, web2, db1]
hostnames: [map, [fn, [m], [get, [get, m, "values"], "hostname"]], fleet]
hostnames_unique: [eq, [duplicates, hostnames], []]
ports: [map, [fn, [m], [get, [get, m, "values"], "port"]], fleet]
ports_clash: [duplicates, ports]
observed: {hostname: "w1", role: "web", port: 2222, uptime: 5}
drift_web1: [drift, web1, observed]
plan_web1: [converge, web1, observed]
plan_when_converged: [converge, web1, [get, web1, "values"]]
no_plan_for_abstract: [try, [drift, machine, observed], [fn, [e], [get, e, "kind"]]]
inhabits: [is, {hostname: "w1", role: "web", port: 22, token: [secret, "vault/web"]}, web1]
