# Helix explicit syntax; migrated from legacy source.
db1: !call
  - inherit
  - db1
  - !call [list, !ref machine]
  - {hostname: db1, role: db, token: !call [secret, vault/db]}
drift_web1: !call [drift, !ref web1, !ref observed]
fleet: !call [list, !ref web1, !ref web2, !ref db1]
hostnames: !call
  - map
  - !call
      - fn
      - [m]
      - !call [get, !call [get, !ref m, values], hostname]
  - !ref fleet
hostnames_unique: !call [eq, !call [duplicates, !ref hostnames], []]
inhabits: !call
  - is
  - {hostname: w1, port: 22, role: web, token: !call [secret, vault/web]}
  - !ref web1
inline_secret: !call
  - try
  - !call [inherit, leak, !call [list, !ref machine], {hostname: x, role: db, token: hunter2}]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, data]
machine: !call
  - class
  - machine
  - !call
      - record
      - hostname
      - !ref string
      - role
      - !call [enum, web, db]
      - port
      - !call [default, !ref integer, 22]
      - token
      - !ref secret
no_plan_for_abstract: !call
  - try
  - !call [drift, !ref machine, !ref observed]
  - !call
      - fn
      - [e]
      - !call [get, !ref e, kind]
observed: {hostname: w1, port: 2222, role: web, uptime: 5}
plan_web1: !call [converge, !ref web1, !ref observed]
plan_when_converged: !call [converge, !ref web1, !call [get, !ref web1, values]]
ports: !call
  - map
  - !call
      - fn
      - [m]
      - !call [get, !call [get, !ref m, values], port]
  - !ref fleet
ports_clash: !call [duplicates, !ref ports]
web1: !call
  - inherit
  - web1
  - !call [list, !ref machine]
  - {hostname: w1, role: web, token: !call [secret, vault/web]}
web2: !call
  - inherit
  - web2
  - !call [list, !ref machine]
  - {hostname: w2, port: 2200, role: web, token: !call [secret, vault/web]}
