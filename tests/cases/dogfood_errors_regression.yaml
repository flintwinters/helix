# Helix explicit syntax; migrated from legacy source.
# Minimized from wrong_call in dogfood_errors: keep failure and corrected caller.
"count": 0
"allocate":
  "$call":
  - "fn"
  - - "count"
  - "$call":
    - "if"
    - "$call":
      - "eq"
      - "$call":
        - "assert"
        - {"$call": ["gt", {"$ref": "count"}, 0]}
        - "allocate count must be positive; pass at least 1"
      - null
    - {"$call": ["mul", {"$ref": "count"}, 2]}
    - null
"result": {"$call": ["allocate", {"$ref": "count"}]}
