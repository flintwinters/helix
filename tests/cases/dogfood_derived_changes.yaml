# Helix explicit syntax; migrated from legacy source.
# File and service change requests share audit metadata and partial-update policy.
# Keep that policy in one function; their independently evolving resource fields
# stay separate. These are validated proposals, not effects or an apply engine.
"types": {"$call": ["import", "std:types"]}
"file_resource": {"$call": ["record", "path", {"$ref": "string"}, "content", {"$ref": "string"}, "mode", {"$ref": "integer"}]}
"service_resource":
  "$call":
  - "record"
  - "name"
  - {"$ref": "string"}
  - "enabled"
  - {"$ref": "boolean"}
  - "arguments"
  - {"$call": ["list_of", {"$ref": "string"}]}
"audited_change":
  "$call":
  - "fn"
  - - "resource_type"
  - "$call":
    - "record"
    - "ticket"
    - {"$ref": "string"}
    - "revision"
    - {"$ref": "integer"}
    - "changes"
    - {"$call": ["types.optional_fields", {"$ref": "resource_type"}]}
"file_change": {"$call": ["type_time", {"$call": ["audited_change", {"$ref": "file_resource"}]}]}
"service_change": {"$call": ["type_time", {"$call": ["audited_change", {"$ref": "service_resource"}]}]}
"file_proposal":
  "ticket": "OPS-42"
  "revision": 3
  "changes":
    "content": "listen: 8080\n"
    "mode": 420
"service_proposal":
  "ticket": "OPS-42"
  "revision": 8
  "changes":
    "enabled": true
    "arguments":
    - "--reload"
"file_valid": {"$call": ["expect", {"$ref": "file_proposal"}, {"$ref": "file_change"}]}
"service_valid": {"$call": ["expect", {"$ref": "service_proposal"}, {"$ref": "service_change"}]}
"empty_patch": {"$call": ["expect", {"ticket": "OPS-43", "revision": 0, "changes": {}}, {"$ref": "file_change"}]}
"source_unchanged": {"$call": ["assert", {"$call": ["not", {"$call": ["is", {}, {"$ref": "file_resource"}]}]}]}
"service_source_unchanged": {"$call": ["assert", {"$call": ["not", {"$call": ["is", {}, {"$ref": "service_resource"}]}]}]}
"missing_audit": {"$call": ["violations", {"revision": 3, "changes": {}}, {"$ref": "file_change"}]}
"wrong_nested":
  "$call":
  - "violations"
  - "ticket": "OPS-44"
    "revision": 4
    "changes":
      "mode": "0644"
      "content": false
  - {"$ref": "file_change"}
"foreign_field":
  "$call":
  - "violations"
  - "ticket": "OPS-45"
    "revision": 9
    "changes":
      "mode": 420
  - {"$ref": "service_change"}
"null_patch": {"$call": ["violations", {"ticket": "OPS-46", "revision": 10, "changes": null}, {"$ref": "service_change"}]}
"wrong_audit": {"$call": ["violations", {"ticket": 42, "revision": "next", "changes": {}}, {"$ref": "file_change"}]}
"invalid_type":
  "$call":
  - "try"
  - {"$call": ["type_time", {"$call": ["audited_change", {"$ref": "integer"}]}]}
  - {"$call": ["fn", ["e"], {"$ref": "e"}]}
