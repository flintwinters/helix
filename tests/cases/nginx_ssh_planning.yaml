# Remote selection is ordinary reviewed data; it supplies no SSH authority.
!call
  - let
  - config:
      content: "Hello over SSH\n"
      package_version: pinned-test-version
      port: 8080
      server_name: helix.remote
      ssh_target: fixture
      state: present
    nginx: !call [import, "std:nginx"]
    observed:
      files:
        /etc/helix-nginx/nginx.conf: ~
        /etc/helix-nginx/server.conf: ~
        /var/lib/helix-nginx/index.html: ~
      package_version: ~
      response: ~
      service: {activation: ~, running: false}
      target: remote-fixture-one
  - !call [nginx.plan, !ref config, !ref observed]
