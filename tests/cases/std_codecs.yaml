- let
- j: [import, std:json]
  c: [import, std:csv]
- json: [j.parse, '{"z":["add",true,null],"a":"雪🙂","n":-9223372036854775808,"float":1.25}']
  json_order: [keys, [j.parse, '{"z":1,"a":2}']]
  json_duplicate: [j.parse, '{"x":1,"x":2}']
  json_dump: [j.dump, {z: [1, false], a: "雪"}]
  json_roundtrip: [j.parse, [j.dump, {x: [1, null, "hello\nworld"]}]]
  csv: [c.parse, "name,note\r\n雪,\"a,b\"\r\n\"\",\"line1\nline2\"\r\n\"quote\"\"here\",last"]
  csv_empty: [c.parse, ""]
  csv_blank: [c.parse, "\n"]
  csv_trailing: [c.parse, "a,"]
  csv_dump: [c.dump, [list, [list, "name", "note"], [list, "雪", "a,b"], [list, "", "a\"b"]]]
  csv_roundtrip: [c.parse, [c.dump, [list, [list, "", "a\nb", "雪"], [list, "ragged"]]]]
  invalid_json: [try, [j.parse, '{bad}'], [fn, [e], [get, e, "kind"]]]
  trailing_json: [try, [j.parse, '1 2'], [fn, [e], [get, e, "kind"]]]
  large_integer: [try, [j.parse, '9223372036854775808'], [fn, [e], [get, e, "kind"]]]
  huge_integer: [try, [j.parse, '999999999999999999999999999999999999'], [fn, [e], [get, e, "kind"]]]
  huge_float: [try, [j.parse, '1e999'], [fn, [e], [get, e, "kind"]]]
  open_quote: [try, [c.parse, '"oops'], [fn, [e], [get, e, "kind"]]]
  bare_quote: [try, [c.parse, 'a"b'], [fn, [e], [get, e, "kind"]]]
  after_quote: [try, [c.parse, '"a"b'], [fn, [e], [get, e, "kind"]]]
  typed_csv: [try, [c.dump, [[1]]], [fn, [e], [get, e, "kind"]]]
  empty_row: [try, [c.dump, [[]]], [fn, [e], [get, e, "kind"]]]
  function_json: [try, [j.dump, [fn, [], 1]], [fn, [e], [get, e, "kind"]]]
  pure: [type_time, [j.parse, '[1,2,3]']]
