d: [import, std:dependency]
empty: [d.plan, {}]
empty_ok: [assert, [eq, empty, {order: [], pending: {}, missing: [], status: "finished"}]]
independent: [d.plan, {z: [], a: [], "": [], "🙂": []}]
stable: [assert, [eq, [get, independent, "order"], ["z", "a", "", "🙂"]]]
# Batch order differs from a queue that immediately schedules newly ready tasks.
batches: [d.plan, {last: ["first"], first: [], other: []}]
batches_ok: [assert, [eq, [get, batches, "order"], ["first", "other", "last"]]]
duplicates: [d.plan, {end: ["start", "start"], start: []}]
duplicates_ok: [assert, [eq, [get, duplicates, "order"], ["start", "end"]]]
missing: [d.plan, {b: ["no", "no"], a: ["absent"], independent: []}]
missing_ok: [assert, [eq, [get, missing, "missing"], [{task: "b", dependency: "no"}, {task: "b", dependency: "no"}, {task: "a", dependency: "absent"}]]]
pending_order: [assert, [eq, [keys, [get, missing, "pending"]], ["b", "a"]]]
cycle: [d.plan, {a: ["b"], b: ["a"], downstream: ["a"], free: []}]
cycle_ok: [assert, [eq, cycle, {order: ["free"], pending: {a: ["b"], b: ["a"], downstream: ["a"]}, missing: [], status: "blocked"}]]
self_cycle: [d.plan, {self: ["self"]}]
unicode: [d.plan, {"🙂": [""], "": []}]
unicode_ok: [assert, [eq, [get, unicode, "order"], ["", "🙂"]]]
wrong_map: [try, [d.plan, []], [fn, [e], [get, e, "kind"]]]
wrong_list: [try, [d.plan, {a: "b"}], [fn, [e], [get, e, "kind"]]]
wrong_dependency: [try, [d.plan, {a: [null]}], [fn, [e], [get, e, "kind"]]]
wrong_arity: [try, [d.plan], [fn, [e], [get, e, "kind"]]]
