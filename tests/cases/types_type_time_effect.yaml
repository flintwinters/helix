# Linked source is available in pure regions; executing imported effects is not.
area: !call [type_time, !call [module.area, 2]]
blocked: !call
  - try
  - !call [type_time, !call [effects.emit]]
  - !call
      - fn
      - [e]
      - !ref e
effects: !call [import, modules/phase_effect.yaml]
independent: !call [type_time, !call [record]]
module: !call [import, modules/geometry.yaml]
runtime_after: !call [add, 20, 22]
