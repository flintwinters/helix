# Helix explicit syntax; migrated from legacy source.
done: !call [each, !ref double, !ref xs]
double: !call
  - fn
  - ["n"]
  - !call [mul, !ref "n", 2]
doubled: !call [map, !ref double, !ref xs]
empty_fold: !call
  - fold
  - !call
      - fn
      - [acc, "n"]
      - !call [add, !ref acc, !ref "n"]
  - 7
  - []
evens: !call
  - filter
  - !call
      - fn
      - ["n"]
      - !call [eq, !call [mod, !ref "n", 2], 0]
  - !ref xs
shift: 100
shifted: !call
  - map
  - !call
      - fn
      - ["n"]
      - !call [add, !ref "n", !ref shift]
  - !ref xs
total: !call
  - fold
  - !call
      - fn
      - [acc, "n"]
      - !call [add, !ref acc, !ref "n"]
  - 0
  - !ref xs
xs: [1, 2, 3, 4, 5, 6]
