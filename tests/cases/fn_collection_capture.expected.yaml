status: finished
root:
  check:
    - fn
    - - actual
      - expected
    - - assert
      - - eq
        - actual
        - expected
      - "values differ"
  run:
    - fn
    - - spec
    - - call
      - - get
        - spec
        - "run"
  cases:
    - name: fails
      run:
        - fn
        - []
        - - check
          - 1
          - 2
    - name: passes
      run:
        - fn
        - []
        - - check
          - 2
          - 2
  results:
    - "assertion"
    - ~
  verify: ~
  m:
    number:
      type: union
      of:
        - "integer"
        - float
    abs:
      - fn
      - - - n
          - number
      - - if
        - - lt
          - n
          - 0
        - - neg
          - n
        - n
      - number
    sign:
      - fn
      - - - n
          - number
      - - cond
        - - lt
          - n
          - 0
        - -1
        - - gt
          - n
          - 0
        - 1
        - 0
      - integer
    min:
      - fn
      - - - a
          - number
        - - b
          - number
      - - if
        - - lt
          - a
          - b
        - a
        - b
      - number
    max:
      - fn
      - - - a
          - number
        - - b
          - number
      - - if
        - - gt
          - a
          - b
        - a
        - b
      - number
    clamp:
      - fn
      - - - n
          - number
        - - lo
          - number
        - - hi
          - number
      - - max
        - lo
        - - min
          - n
          - hi
      - number
    square:
      - fn
      - - - n
          - number
      - - mul
        - n
        - n
      - number
  nested:
    - callback:
        - closure
        - m.square:
            - closure
            - number:
                type: union
                of:
                  - "integer"
                  - float
            - - fn
              - - - n
                  - number
              - - mul
                - n
                - n
              - number
        - - fn
          - - n
          - - m.square
            - n
  value: 16
  verified_value: ~
