# let plus fn owns captures; closure is available as an ordinary lexical name.
!call
  - let
  - captured: !call
      - let
      - {unused: !call [raise, unused_binding, unused bindings stay lazy], value: 10}
      - !call
          - fn
          - [increment]
          - !call [add, !ref value, !ref increment]
    closure: !call
      - fn
      - [bindings, body]
      - !ref body
    value: 7
  - {capture: !call [captured, 2], ordinary_scope: !call [closure, {value: 99}, !ref value]}
