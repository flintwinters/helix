# Helix explicit syntax; migrated from legacy source.
# Review snapshots: distinguish missing keys from explicit null, false and zero.
after:
  added_null: ~
  empty: 0
  enabled: true
  nested: {timeout: 60}
  nullable: ~
  port: 8000
  workers: 4
before:
  empty: 0
  enabled: false
  legacy: true
  nested: {timeout: 30}
  nullable: ~
  port: 8000
  workers: 2
diff: !call [import, "std:diff"]
empty: !call [diff.compare, {}, {}]
report: !call [diff.compare, !ref before, !ref after]
unchanged: !call [diff.compare, !ref before, !ref before]
