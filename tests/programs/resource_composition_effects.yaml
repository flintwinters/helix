# Embedded-only continuation fixture: hosts decide how to satisfy stdout effects.
!call
  - let
  - {orchestration: !call [import, "std:orchestration"]}
  - !call
      - orchestration.run
      - handlers: {restart: {requires: [package]}}
        resources:
          config_a: {notify: [restart, restart], requires: [package]}
          config_b: {notify: [restart], requires: [package]}
          package: {notify: [], requires: []}
        version: 1
      - !call
          - fn
          - [kind, id]
          - !call
              - get
              - !call
                  - list
                  - !call [effect, stdout, !call [concat, !ref kind, ":", !ref id]]
                  - {status: changed}
              - 1
