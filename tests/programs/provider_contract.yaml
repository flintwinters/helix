# Review a single managed content field without contacting a machine.
# Real adapters implement observe/apply using caller-authorized effects; this
# example supplies an observation directly to the same pure planning boundary.
!call
  - let
  - content:
      apply: !call
        - fn
        - [args, steps]
        - !call [raise, example_requires_host, Supply a real mutation adapter]
      arguments: !ref string
      capabilities: [file_read, file_write]
      check: true
      diff: true
      failure: stop
      id: example.content
      observation: !ref string
      observe: !call
        - fn
        - [args]
        - !call [raise, example_requires_host, Supply a real observation adapter]
      plan: !call
        - fn
        - [args, before]
        - !call
            - if
            - !call [eq, !ref args, !ref before]
            - []
            - !call [list, !call [dict, field, content, op, set, from, !ref before, to, !ref args]]
      platforms: [example-linux]
      result: !call [literal, ~]
      revision: "1.0.0"
      version: 1
    provider: !call [import, "std:provider"]
  - !call
      - provider.plan
      - !ref content
      - desired text
      - observed text
      - allow_remove: false
        capabilities: [file_read, file_write]
        managed: true
        platform: example-linux
