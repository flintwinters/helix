# Pure review only: explicit host observations and caller command grants are
# required for check/apply. The guard is also the postcondition, not a claim
# that arbitrary commands are inherently idempotent or reversible.
!call
  - let
  - command: !call [import, "std:command"]
    migration: !call
      - command.make
      - capabilities: [command]
        changed: !call
          - fn
          - [args, reply]
          - !call [eq, !call [get, !ref reply, stdout], "migrated\n"]
        failed: !call
          - fn
          - [args, reply]
          - !call [ne, !call [get, !ref reply, code], 0]
        guard: !call
          - fn
          - [args, before]
          - !call [ne, !ref before, v2]
        id: example.schema-migration
        observation: !ref string
        observe: !call
          - fn
          - [args]
          - !call [raise, example_requires_host, Supply an authorized schema-version observer]
        platforms: [example-linux]
        revision: "1.0.0"
  - !call
      - command.plan
      - !ref migration
      - {args: ["--target", v2], program: /usr/local/bin/migrate-schema}
      - v1
      - {allow_remove: false, capabilities: [command], managed: true, platform: example-linux}
