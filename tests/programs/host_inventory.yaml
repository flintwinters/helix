# Review targets without contacting any host. Dynamic discovery has already run
# outside Helix; its ordinary-data result is supplied explicitly below.
!call
  - let
  - {inventory: !call [import, "std:inventory"]}
  - !call
      - type_time
      - !call
          - inventory.resolve
          - !literal
              groups: {production: [web, database]}
              hosts:
                - {connection: {transport: local}, id: controller}
                - {connection: {address: web.example, transport: ssh, user: deploy}, id: web}
              overrides:
                - connection: {port: 2222}
                  groups: [production]
                  hosts: []
                  source: production-port
              version: 1
          - !literal
              - hosts:
                  - {connection: {address: db.example, transport: ssh, user: deploy}, id: database}
                source: supplied-discovery
          - !literal {exclude_hosts: [database], groups: [production]}
