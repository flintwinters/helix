# SQLite access through the explicit `sqlite` host effect (one statement per request).
# Database paths follow the host's file grants: `query` needs --allow-read, `execute` --allow-write
# (which may create the file). Parameters are null, booleans (stored 0/1), numbers or strings;
# blob results are unsupported. Nothing here grants authority. `execute` and `query` are one
# statement, atomic only as SQLite makes one statement. `transaction` runs a list of
# `{sql, params}` statements in one SQLite transaction: any failure rolls every statement back,
# and statements cannot issue BEGIN/COMMIT/ROLLBACK/SAVEPOINT themselves. It does not coordinate
# with other writers beyond SQLite's ten-second busy timeout, and a transaction cannot span requests.
# Number of rows the statement changed.
execute: !call
  - fn
  - [path, sql, params]
  - !call [get, !call [request, !ref path, !ref sql, !ref params, true], changes]
l: !call [import, "std:list"]
# Rows as maps keyed by column name; duplicate column names keep the last value.
# `result` is a parameter of an applied function, not a `let`: a `let` binding is re-evaluated
# on every read, which would re-issue the statement once per row.
records: !call
  - fn
  - [result]
  - !call
      - map
      - !call
          - fn
          - [row]
          - !call
              - fold
              - !call
                  - fn
                  - [record, pair]
                  - !call
                      - set
                      - !ref record
                      - !call [get, !ref pair, 0]
                      - !call [get, !ref pair, 1]
              - !call [dict]
              - !call [l.zip, !call [get, !ref result, columns], !ref row]
      - !call [get, !ref result, rows]
query: !call
  - fn
  - [path, sql, params]
  - !call [records, !call [request, !ref path, !ref sql, !ref params, false]]
# One result per statement, in order: `{rows, changes}` with rows as in `query`.
transaction: !call
  - fn
  - [path, statements]
  - !call
      - map
      - !call
          - fn
          - [result]
          - !call [dict, rows, !call [records, !ref result], changes, !call [get, !ref result, changes]]
      - !call
          - get
          - !call
              - effect
              - sqlite
              - !call [dict, path, !ref path, statements, !ref statements, write, true]
          - results
request: !call
  - fn
  - [path, sql, params, write]
  - !call
      - effect
      - sqlite
      - !call [dict, path, !ref path, sql, !ref sql, params, !ref params, write, !ref write]
