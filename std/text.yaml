# Pure text helpers for small inputs. Indices count Unicode scalar values.
# Splitting is literal, left-to-right and non-overlapping; empty fields survive.
# An empty separator is rejected. join([], separator) returns the empty string.
# Scanning/slicing and immutable string/list copies can take quadratic time and
# total allocations. until/fold iteration limits and shared runtime budgets apply.
split:
  - fn
  - [[source, string], [separator, string]]
  - - if
    - [eq, [len, separator], 0]
    - [raise, "range", "split separator must not be empty"]
    - - let
      - width: [len, separator]
        size: [len, source]
        result:
          - until
          - [fn, [state], [gt, [get, state, "index"], [sub, size, width]]]
          - - fn
            - [state]
            - - if
              - [eq, [slice, source, [get, state, "index"], [add, [get, state, "index"], width]], separator]
              - [dict, "index", [add, [get, state, "index"], width], "start", [add, [get, state, "index"], width], "parts", [append, [get, state, "parts"], [slice, source, [get, state, "start"], [get, state, "index"]]]]
              - [set, state, "index", [add, [get, state, "index"], 1]]
          - {index: 0, start: 0, parts: []}
      - [append, [get, result, "parts"], [slice, source, [get, result, "start"], size]]
  - [list_of, string]
join:
  - fn
  - [[parts, [list_of, string]], [separator, string]]
  - - get
    - - fold
      - - fn
        - [state, part]
        - [dict, "text", [concat, [get, state, "text"], [if, [get, state, "first"], "", separator], part], "first", false]
      - {text: "", first: true}
      - parts
    - "text"
  - string
