# Pure text helpers. Indices count Unicode scalar values.
# Splitting is literal, left-to-right and non-overlapping; empty fields survive.
# An empty separator, or one over 1024 characters, is rejected.
# join([], separator) returns the empty string.
# Both are near-linear in input size: join concatenates recursively by halves (depth
# log2(parts)), and split reads fields from bounded windows of the source with
# regex_find, never per character; each window is one iteration, so the runtime
# iteration limit applies to source/4000.
join: !call
  - fn
  - [[parts, !call [list_of, !ref string]], [separator, !ref string]]
  - !call
      - if
      - !call [lt, !call [len, !ref parts], 2]
      - !call [get, !ref parts, 0, ""]
      - !call
          - let
          - {middle: !call [div, !call [len, !ref parts], 2]}
          - !call
              - concat
              - !call [join, !call [slice, !ref parts, 0, !ref middle], !ref separator]
              - !ref separator
              - !call
                  - join
                  - !call [slice, !ref parts, !ref middle, !call [len, !ref parts]]
                  - !ref separator
  - !ref string
lists: !call [import, "std:list"]
# Whether the regex matches anywhere in the text.
matches: !call
  - fn
  - [pattern, text]
  - !call [gt, !call [len, !call [regex_find, !ref pattern, !ref text]], 0]
# The separator as a regex literal: every regex metacharacter gets a backslash.
quote: !call
  - fn
  - [[text, !ref string]]
  - !call
      - join
      - !call
          - map
          - !call
              - fn
              - [piece]
              - !call
                  - let
                  - {meta: !call [get, !call [get, !ref piece, captures], 1]}
                  - !call
                      - if
                      - !call [eq, !ref meta, ~]
                      - !call [get, !call [get, !call [get, !ref piece, captures], 2], text]
                      - !call [concat, "\\", !call [get, !ref meta, text]]
          - !call
              - regex_find
              - "(?s)([\\\\.+*?()|\\[\\]{}^$#&~\\-])|([^\\\\.+*?()|\\[\\]{}^$#&~\\-]+)"
              - !ref text
      - ""
  - !ref string
regex: !call
  - fn
  - [pattern, text]
  - !call [regex_find, !ref pattern, !ref text]
# Literal, left-to-right, non-overlapping replacement of every `from` with `to`; an empty
# `from` is rejected. `$` in `to` is data here, unlike the `$1` expansion of regex_replace.
replace: !call
  - fn
  - [[source, !ref string], [from, !ref string], [to, !ref string]]
  - !call
      - if
      - !call [eq, !call [len, !ref from], 0]
      - !call [raise, range, replace pattern must not be empty]
      - !call
          - regex_replace
          - !call [quote, !ref from]
          - !ref source
          - !call [regex_replace, "[$]", !ref to, "$$$$"]
  - !ref string
# One regex window of split: the complete fields in source[pos:pos+width] and how many
# characters they consumed. A window with no complete field doubles; the last window
# also yields the remaining tail. Parameters, not `let`, carry the values reused below.
scan: !call
  - fn
  - [source, fields, prefix, state]
  - !call
      - call
      - !call
          - fn
          - [pos, width, chunks, size]
          - !call
              - call
              - !call
                  - fn
                  - [window]
                  - !call
                      - call
                      - !call
                          - fn
                          - [found, used]
                          - !call
                              - if
                              - !call [ge, !call [add, !ref pos, !ref width], !ref size]
                              - !call
                                  - dict
                                  - done
                                  - true
                                  - chunks
                                  - !call
                                      - append
                                      - !ref chunks
                                      - !call
                                          - concat
                                          - !ref found
                                          - !call
                                              - list
                                              - !call
                                                  - slice
                                                  - !ref source
                                                  - !call [add, !ref pos, !ref used]
                                                  - !ref size
                              - !call
                                  - dict
                                  - done
                                  - false
                                  - pos
                                  - !call [add, !ref pos, !ref used]
                                  - width
                                  - !call
                                      - if
                                      - !call [eq, !ref used, 0]
                                      - !call [mul, !ref width, 2]
                                      - 4000
                                  - chunks
                                  - !call [append, !ref chunks, !ref found]
                      - !call
                          - map
                          - !call
                              - fn
                              - [match]
                              - !call [get, !call [get, !call [get, !ref match, captures], 1], text]
                          - !call [regex_find, !ref fields, !ref window]
                      - !call
                          - len
                          - !call
                              - get
                              - !call
                                  - get
                                  - !call
                                      - get
                                      - !call [get, !call [regex_find, !ref prefix, !ref window], 0]
                                      - captures
                                  - 0
                              - text
              - !call
                  - slice
                  - !ref source
                  - !ref pos
                  - !call
                      - if
                      - !call [lt, !call [add, !ref pos, !ref width], !ref size]
                      - !call [add, !ref pos, !ref width]
                      - !ref size
      - !call [get, !ref state, pos]
      - !call [get, !ref state, width]
      - !call [get, !ref state, chunks]
      - !call [len, !ref source]
split: !call
  - fn
  - [[source, !ref string], [separator, !ref string]]
  - !call
      - if
      - !call [eq, !call [len, !ref separator], 0]
      - !call [raise, range, split separator must not be empty]
      - !call
          - if
          - !call [gt, !call [len, !ref separator], 1024]
          - !call [raise, range, split separator must be at most 1024 characters]
          - !call
              - call
              - !call
                  - fn
                  - [fields, prefix]
                  - !call
                      - lists.flatten
                      - !call
                          - get
                          - !call
                              - until
                              - !call
                                  - fn
                                  - [state]
                                  - !call [get, !ref state, done]
                              - !call
                                  - fn
                                  - [state]
                                  - !call [scan, !ref source, !ref fields, !ref prefix, !ref state]
                              - {chunks: [], done: false, pos: 0, width: 4000}
                          - chunks
              - !call [concat, "(?s)(.*?)", !call [quote, !ref separator]]
              - !call [concat, "(?s)\\A(?:.*?", !call [quote, !ref separator], ")*"]
  - !call [list_of, !ref string]
