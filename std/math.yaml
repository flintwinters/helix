# Small numeric helpers. Import with `m: [import, std:math]`, call as `[m.max, 3, 9]`.
abs: [fn, [n], [if, [lt, n, 0], [neg, n], n]]
sign: [fn, [n], [cond, [lt, n, 0], -1, [gt, n, 0], 1, 0]]
min: [fn, [a, b], [if, [lt, a, b], a, b]]
max: [fn, [a, b], [if, [gt, a, b], a, b]]
clamp: [fn, [n, lo, hi], [max, lo, [min, n, hi]]]
square: [fn, [n], [mul, n, n]]
