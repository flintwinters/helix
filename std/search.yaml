    {$call: [map,
        {$call: [fn, [reference],
            {$call: [dict, reference, {$ref: reference}, basis, syntax, match,
                {$call: [match, {$ref: source}, {$ref: reference}, {$ref: pattern}]}]}]},
        {$call: [result_expressions, {$ref: source}, {$ref: function.body}]}]}]}
