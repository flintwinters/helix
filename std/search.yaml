    {$call: [filter,
        {$call: [fn, [node],
            {$call: [and, {$call: [eq, {$ref: node.kind}, reference]},
                {$call: [eq, {$call: [get, {$ref: node}, name, ~]}, {$ref: name}]}]}]},
        {$ref: source.nodes}]}]}
regex: {$call: [fn, [pattern, text], {$call: [regex_find, {$ref: pattern}, {$ref: text}]}]}
relationship: {$call: [fn, [actual, wanted, basis],
    {$call: [dict, basis, {$ref: basis}, status,
        {$call: [if,
            {$call: [or, {$call: [eq, {$ref: actual}, ~]}, {$call: [eq, {$ref: actual}, any]}]},
            unresolved,
            {$call: [if, {$call: [source_subtype, {$ref: actual}, {$ref: wanted}]}, matches,
                unresolved]}]}]}]}
result_expressions: {$call: [fn, [source, reference],
    {$call: [let, {code: {$call: [sources.code_at, {$ref: source}, {$ref: reference}]}},
        {$call: [if,
            {$call: [and, {$call: [eq, {$call: [type, {$ref: code}]}, map]},
                {$call: [eq, {$call: [keys, {$ref: code}]}, ["$call"]]}]},
            {$call: [let,
                {head: {$call: [get, {$call: [get, {$ref: code}, "$call"]}, 0]},
                  parts: {$call: [get, {$ref: code}, "$call"]}},
                {$call: [cond, {$call: [eq, {$ref: head}, if]},
                    {$call: [concat,
                        {$call: [result_expressions, {$ref: source},
                            {$call: [dict, source, {$ref: reference.source}, path,
                                {$call: [concat, {$ref: reference.path}, ["$call", 2]]}]}]},
                        {$call: [result_expressions, {$ref: source},
                            {$call: [dict, source, {$ref: reference.source}, path,
                                {$call: [concat, {$ref: reference.path}, ["$call", 3]]}]}]}]},
                    {$call: [has, [let, type_time], {$ref: head}]},
                    {$call: [result_expressions, {$ref: source},
                        {$call: [dict, source, {$ref: reference.source}, path,
                            {$call: [concat, {$ref: reference.path},
                                ["$call", {$call: [if, {$call: [eq, {$ref: head}, let]}, 2, 1]}]]}]}]},
                    {$call: [eq, {$ref: head}, cond]},
                    {$call: [fold,
                        {$call: [fn, [found, index],
                            {$call: [if,
                                {$call: [and, {$call: [gt, {$ref: index}, 0]},
                                    {$call: [or, {$call: [eq, {$call: [mod, {$ref: index}, 2]}, 0]},
                                        {$call: [eq, {$ref: index},
                                            {$call: [sub, {$call: [len, {$ref: parts}]}, 1]}]}]}]},
                                {$call: [concat, {$ref: found},
                                    {$call: [result_expressions, {$ref: source},
                                        {$call: [dict, source, {$ref: reference.source}, path,
                                            {$call: [concat, {$ref: reference.path},
                                                ["$call", {$ref: index}]]}]}]}]}, {$ref: found}]}]},
                        [], {$call: [lists.range, {$call: [len, {$ref: parts}]}]}]},
                    [{$ref: reference}]]}]}, [{$ref: reference}]]}]}]}
