# Bounded evidence-preserving search policy. No candidate execution.
body_matches: {$call: [fn, [source, pattern],
    {$call: [map,
        {$call: [fn, [node],
            {$call: [dict, reference, {$ref: node.reference}, basis, syntax, match,
                {$call: [match, {$ref: source}, {$ref: node.body}, {$ref: pattern}]}]}]},
        {$call: [filter, {$call: [fn, [node], {$call: [eq, {$ref: node.kind}, function]}]},
            {$ref: source.nodes}]}]}]}
