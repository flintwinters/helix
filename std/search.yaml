        {$call: [fn, [node],
            {$call: [and, {$call: [eq, {$ref: node.kind}, call]},
                {$call: [eq, {$call: [get, {$ref: node}, actor, ~]}, {$ref: name}]}]}]},
        {$ref: source.nodes}]}]}
declared_result_type: {$call: [fn, [record, wanted],
    {$call: [relationship,
        {$call: [if, {$call: [eq, {$call: [get, {$ref: record}, result_annotation, ~]}, ~]}, ~,
            {$call: [get, {$call: [get, {$call: [get, {$ref: record}, types, {}]}, declared, {}]},
                result, ~]}]}, {$ref: wanted}, declaration]}]}
documentation: {$call: [fn, [record],
