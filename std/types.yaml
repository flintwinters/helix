# Helix explicit syntax; migrated from legacy source.
# Type derivation stays ordinary Helix: reflection, folds and the checked constructors.
# These helpers use canonical field order and leave the input declaration unchanged.
"from_fields":
  "$call":
  - "fn"
  - - - "specs"
      - {"$ref": "map"}
  - "$call":
    - "fold"
    - "$call":
      - "fn"
      - - "result"
        - "name"
      - "$call":
        - "with_field"
        - {"$ref": "result"}
        - {"$ref": "name"}
        - {"$call": ["get", {"$ref": "specs"}, {"$ref": "name"}]}
    - {"$call": ["record"]}
    - {"$call": ["keys", {"$ref": "specs"}]}
  - {"$ref": "map"}
"without_field":
  "$call":
  - "fn"
  - - "t"
    - - "name"
      - {"$ref": "string"}
  - "$call":
    - "let"
    - "specs": {"$call": ["fields", {"$ref": "t"}]}
    - "$call":
      - "fold"
      - "$call":
        - "fn"
        - - "result"
          - "field"
        - "$call":
          - "if"
          - {"$call": ["eq", {"$ref": "field"}, {"$ref": "name"}]}
          - {"$ref": "result"}
          - "$call":
            - "with_field"
            - {"$ref": "result"}
            - {"$ref": "field"}
            - {"$call": ["get", {"$ref": "specs"}, {"$ref": "field"}]}
      - {"$call": ["record"]}
      - {"$call": ["keys", {"$ref": "specs"}]}
  - {"$ref": "map"}
"optional_field":
  "$call":
  - "fn"
  - - "spec"
  - "$call":
    - "if"
    - "$call":
      - "and"
      - {"$call": ["eq", {"$call": ["type", {"$ref": "spec"}]}, "map"]}
      - {"$call": ["has", ["optional", "default"], {"$call": ["get", {"$ref": "spec"}, "type", ""]}]}
    - {"$ref": "spec"}
    - {"$call": ["optional", {"$ref": "spec"}]}
"optional_fields":
  "$call":
  - "fn"
  - - "t"
  - "$call":
    - "let"
    - "specs": {"$call": ["fields", {"$ref": "t"}]}
    - "$call":
      - "fold"
      - "$call":
        - "fn"
        - - "result"
          - "name"
        - "$call":
          - "with_field"
          - {"$ref": "result"}
          - {"$ref": "name"}
          - {"$call": ["optional_field", {"$call": ["get", {"$ref": "specs"}, {"$ref": "name"}]}]}
      - {"$call": ["record"]}
      - {"$call": ["keys", {"$ref": "specs"}]}
  - {"$ref": "map"}
