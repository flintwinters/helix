# Immutable LIFO stack: a plain list with its top at the end; [] is empty.
# peek requires an explicit fallback. pop on empty returns []; push/pop copy lists.
l: [import, std:list]
push: [fn, [[xs, list], value], [append, xs, value], list]
peek: [fn, [[xs, list], fallback], [l.last, xs, fallback]]
pop: [fn, [[xs, list]], [l.take, xs, [if, [eq, [len, xs], 0], 0, [sub, [len, xs], 1]]], list]
