# List helpers over plain data. Import with `l: [import, std:list]`, call as `[l.sum, xs]`.
math: [import, std:math]
numbers: [list_of, math.number]
sum: [fn, [[xs, numbers]], [fold, [fn, [acc, x], [add, acc, x]], 0, xs], math.number]
product: [fn, [[xs, numbers]], [fold, [fn, [acc, x], [mul, acc, x]], 1, xs], math.number]
reverse: [fn, [[xs, list]], [fold, [fn, [acc, x], [concat, [list, x], acc]], [list], xs], list]
range: [fn, [[n, integer]], [let, {done: [fn, [xs], [ge, [len, xs], n]], step: [fn, [xs], [append, xs, [len, xs]]]}, [until, done, step, [list]]], [list_of, integer]]
# Keep the first occurrence of each structurally equal value (including numeric equality).
# Repeated scans and immutable list copies make this suitable for small inputs.
unique:
  - fn
  - [[xs, list]]
  - - fold
    - - fn
      - [seen, item]
      - - if
        - [has, seen, item]
        - seen
        - [append, seen, item]
    - []
    - xs
  - list
# Stable insertion sort. `before(a, b)` must be a strict ordering predicate.
# Each insertion scans the ordered prefix; comparisons and copying are quadratic.
# until avoids recursion proportional to input length; runtime iteration limits apply.
sort_by:
  - fn
  - [[xs, list], [before, function]]
  - - fold
    - - fn
      - [ordered, item]
      - - let
        - position:
            - until
            - - fn
              - [index]
              - - or
                - [ge, index, [len, ordered]]
                - [before, item, [get, ordered, index]]
            - [fn, [index], [add, index, 1]]
            - 0
        - - concat
          - [slice, ordered, 0, position]
          - [list, item]
          - [slice, ordered, position, [len, ordered]]
    - []
    - xs
  - list

# Access and slicing. Empty first/last and unsuccessful find return the explicit fallback.
first: [fn, [[xs, list], fallback], [get, xs, 0, fallback]]
last: [fn, [[xs, list], fallback], [if, [eq, [len, xs], 0], fallback, [get, xs, [sub, [len, xs], 1]]]]
take:
  - fn
  - [[xs, list], [n, integer]]
  - [if, [lt, n, 0], [raise, "range", "take count must be non-negative"], [slice, xs, 0, [math.min, n, [len, xs]]]]
  - list
drop:
  - fn
  - [[xs, list], [n, integer]]
  - [if, [lt, n, 0], [raise, "range", "drop count must be non-negative"], [slice, xs, [math.min, n, [len, xs]], [len, xs]]]
  - list
# Pairs are [index, value] or [left, right]; zip stops at the shorter input.
enumerate: [fn, [[xs, list]], [map, [fn, [i], [list, i, [get, xs, i]]], [range, [len, xs]]], list]
zip: [fn, [[xs, list], [ys, list]], [map, [fn, [i], [list, [get, xs, i], [get, ys, i]]], [range, [math.min, [len, xs], [len, ys]]]], list]
# Flatten exactly one level. Inner values (or callback results) must be lists.
flatten: [fn, [[xss, [list_of, list]]], [fold, [fn, [acc, xs], [concat, acc, xs]], [], xss], list]
flat_map: [fn, [[xs, list], [transform, function]], [flatten, [map, transform, xs]], list]
# Search once, left to right, stopping before invoking the predicate again after a match.
# -1 distinguishes absence from a matching null, false, or zero value.
find_index:
  - fn
  - [[xs, list], [predicate, function]]
  - - let
    - position:
        - until
        - [fn, [i], [or, [ge, i, [len, xs]], [predicate, [get, xs, i]]]]
        - [fn, [i], [add, i, 1]]
        - 0
    - [if, [lt, position, [len, xs]], position, -1]
  - integer
find:
  - fn
  - [[xs, list], [predicate, function], fallback]
  - [let, {i: [find_index, xs, predicate]}, [if, [lt, i, 0], fallback, [get, xs, i]]]
any: [fn, [[xs, list], [predicate, function]], [ge, [find_index, xs, predicate], 0], boolean]
all: [fn, [[xs, list], [predicate, function]], [lt, [find_index, xs, [fn, [x], [not, [predicate, x]]]], 0], boolean]
count: [fn, [[xs, list], [predicate, function]], [len, [filter, predicate, xs]], integer]
# Stable split into [matching, nonmatching], invoking the predicate once per element.
partition:
  - fn
  - [[xs, list], [predicate, function]]
  - - fold
    - - fn
      - [parts, x]
      - [let, {side: [if, [predicate, x], 0, 1]}, [set, parts, side, [append, [get, parts, side], x]]]
    - [[], []]
    - xs
  - list
# Keys must be strings. Maps retain first-key encounter order; buckets retain input order.
grouping: [import, std:group]
group_by: [fn, [[xs, list], [key_for, function]], [grouping.by, xs, key_for], map]
frequencies:
  - fn
  - [[xs, [list_of, string]]]
  - [fold, [fn, [counts, x], [set, counts, x, [add, [get, counts, x, 0], 1]]], {}, xs]
  - map
# Ascending numeric or string order, using the existing stable implementation.
sort: [fn, [[xs, list]], [sort_by, xs, [fn, [a, b], [lt, a, b]]], list]
