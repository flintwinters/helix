# List helpers over plain data. Import with `l: !call [import, std:list]`, call as `!call [l.sum, !ref xs]`.
all: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function]]
  - !call
      - lt
      - !call
          - find_index
          - !ref xs
          - !call
              - fn
              - [x]
              - !call [not, !call [predicate, !ref x]]
      - 0
  - !ref boolean
any: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function]]
  - !call [ge, !call [find_index, !ref xs, !ref predicate], 0]
  - !ref boolean
count: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function]]
  - !call [len, !call [filter, !ref predicate, !ref xs]]
  - !ref integer
drop: !call
  - fn
  - [[xs, !ref list], ["n", !ref integer]]
  - !call
      - if
      - !call [lt, !ref "n", 0]
      - !call [raise, range, drop count must be non-negative]
      - !call
          - slice
          - !ref xs
          - !call [math.min, !ref "n", !call [len, !ref xs]]
          - !call [len, !ref xs]
  - !ref list
enumerate: !call
  - fn
  - [[xs, !ref list]]
  - !call
      - map
      - !call
          - fn
          - [i]
          - !call [list, !ref i, !call [get, !ref xs, !ref i]]
      - !call [range, !call [len, !ref xs]]
  - !ref list
find: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function], fallback]
  - !call
      - let
      - {i: !call [find_index, !ref xs, !ref predicate]}
      - !call
          - if
          - !call [lt, !ref i, 0]
          - !ref fallback
          - !call [get, !ref xs, !ref i]
find_index: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function]]
  - !call
      - let
      - position: !call
          - until
          - !call
              - fn
              - [i]
              - !call
                  - or
                  - !call [ge, !ref i, !call [len, !ref xs]]
                  - !call [predicate, !call [get, !ref xs, !ref i]]
          - !call
              - fn
              - [i]
              - !call [add, !ref i, 1]
          - 0
      - !call
          - if
          - !call [lt, !ref position, !call [len, !ref xs]]
          - !ref position
          - -1
  - !ref integer
first: !call
  - fn
  - [[xs, !ref list], fallback]
  - !call [get, !ref xs, 0, !ref fallback]
flat_map: !call
  - fn
  - [[xs, !ref list], [transform, !ref function]]
  - !call [flatten, !call [map, !ref transform, !ref xs]]
  - !ref list
flatten: !call
  - fn
  - [[xss, !call [list_of, !ref list]]]
  - !call
      - fold
      - !call
          - fn
          - [acc, xs]
          - !call [concat, !ref acc, !ref xs]
      - []
      - !ref xss
  - !ref list
frequencies: !call
  - fn
  - [[xs, !call [list_of, !ref string]]]
  - !call
      - fold
      - !call
          - fn
          - [counts, x]
          - !call [set, !ref counts, !ref x, !call [add, !call [get, !ref counts, !ref x, 0], 1]]
      - {}
      - !ref xs
  - !ref map
group_by: !call
  - fn
  - [[xs, !ref list], [key_for, !ref function]]
  - !call [grouping.by, !ref xs, !ref key_for]
  - !ref map
grouping: !call [import, "std:group"]
last: !call
  - fn
  - [[xs, !ref list], fallback]
  - !call
      - if
      - !call [eq, !call [len, !ref xs], 0]
      - !ref fallback
      - !call [get, !ref xs, !call [sub, !call [len, !ref xs], 1]]
math: !call [import, "std:math"]
numbers: !call [list_of, !ref math.number]
partition: !call
  - fn
  - [[xs, !ref list], [predicate, !ref function]]
  - !call
      - fold
      - !call
          - fn
          - [parts, x]
          - !call
              - let
              - side: !call
                  - if
                  - !call [predicate, !ref x]
                  - 0
                  - 1
              - !call
                  - set
                  - !ref parts
                  - !ref side
                  - !call [append, !call [get, !ref parts, !ref side], !ref x]
      - [[], []]
      - !ref xs
  - !ref list
product: !call
  - fn
  - [[xs, !ref numbers]]
  - !call
      - fold
      - !call
          - fn
          - [acc, x]
          - !call [mul, !ref acc, !ref x]
      - 1
      - !ref xs
  - !ref math.number
range: !call
  - fn
  - [["n", !ref integer]]
  - !call
      - let
      - done: !call
          - fn
          - [xs]
          - !call [ge, !call [len, !ref xs], !ref "n"]
        step: !call
          - fn
          - [xs]
          - !call [append, !ref xs, !call [len, !ref xs]]
      - !call
          - until
          - !ref done
          - !ref step
          - !call [list]
  - !call [list_of, !ref integer]
reverse: !call
  - fn
  - [[xs, !ref list]]
  - !call
      - fold
      - !call
          - fn
          - [acc, x]
          - !call [concat, !call [list, !ref x], !ref acc]
      - !call [list]
      - !ref xs
  - !ref list
sort: !call
  - fn
  - [[xs, !ref list]]
  - !call
      - sort_by
      - !ref xs
      - !call
          - fn
          - [a, b]
          - !call [lt, !ref a, !ref b]
  - !ref list
sort_by: !call
  - fn
  - [[xs, !ref list], [before, !ref function]]
  - !call
      - fold
      - !call
          - fn
          - [ordered, item]
          # Binary search for the first element that `item` sorts before, so equal
          # elements keep input order with O(log n) comparisons per insertion.
          - !call
              - !call
                  - fn
                  - [position]
                  - !call
                      - concat
                      - !call [slice, !ref ordered, 0, !ref position]
                      - !call [list, !ref item]
                      - !call [slice, !ref ordered, !ref position, !call [len, !ref ordered]]
              - !call
                  - get
                  - !call
                      - until
                      - !call
                          - fn
                          - [bounds]
                          - !call [ge, !call [get, !ref bounds, 0], !call [get, !ref bounds, 1]]
                      - !call
                          - fn
                          - [bounds]
                          - !call
                              - !call
                                  - fn
                                  - [low, high, middle]
                                  - !call
                                      - if
                                      - !call [before, !ref item, !call [get, !ref ordered, !ref middle]]
                                      - !call [list, !ref low, !ref middle]
                                      - !call [list, !call [add, !ref middle, 1], !ref high]
                              - !call [get, !ref bounds, 0]
                              - !call [get, !ref bounds, 1]
                              - !call [div, !call [add, !call [get, !ref bounds, 0], !call [get, !ref bounds, 1]], 2]
                      - !call [list, 0, !call [len, !ref ordered]]
                  - 0
      - []
      - !ref xs
  - !ref list
sum: !call
  - fn
  - [[xs, !ref numbers]]
  - !call
      - fold
      - !call
          - fn
          - [acc, x]
          - !call [add, !ref acc, !ref x]
      - 0
      - !ref xs
  - !ref math.number
take: !call
  - fn
  - [[xs, !ref list], ["n", !ref integer]]
  - !call
      - if
      - !call [lt, !ref "n", 0]
      - !call [raise, range, take count must be non-negative]
      - !call [slice, !ref xs, 0, !call [math.min, !ref "n", !call [len, !ref xs]]]
  - !ref list
unique: !call
  - fn
  - [[xs, !ref list]]
  - !call
      - fold
      - !call
          - fn
          - [seen, item]
          - !call
              - if
              - !call [has, !ref seen, !ref item]
              - !ref seen
              - !call [append, !ref seen, !ref item]
      - []
      - !ref xs
  - !ref list
zip: !call
  - fn
  - [[xs, !ref list], [ys, !ref list]]
  - !call
      - map
      - !call
          - fn
          - [i]
          - !call [list, !call [get, !ref xs, !ref i], !call [get, !ref ys, !ref i]]
      - !call [range, !call [math.min, !call [len, !ref xs], !call [len, !ref ys]]]
  - !ref list
