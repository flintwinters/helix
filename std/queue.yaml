# Immutable FIFO queue: a plain list with its front at index zero; [] is empty.
# peek requires an explicit fallback. dequeue on empty returns []; operations copy lists.
l: [import, std:list]
enqueue: [fn, [[xs, list], value], [append, xs, value], list]
peek: [fn, [[xs, list], fallback], [l.first, xs, fallback]]
dequeue: [fn, [[xs, list]], [l.drop, xs, 1], list]
