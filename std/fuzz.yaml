# Deterministic damaged-source generation for host-supervised parser/evaluator tests.
# Unicode scalar offsets; all Python splitlines boundaries, with CRLF kept together.
# Duplicates and order are intentional; each variant is a list of source slice spans.
# Scan 256-scalar chunks with one-scalar lookahead for CRLF at the seam.
chunk: !call
  - fn
  - [source, size, base]
  - !call
      - dict
      - text
      - !call
          - slice
          - !ref source
          - !ref base
          - !call
              - if
              - !call [lt, !call [add, !ref base, 257], !ref size]
              - !call [add, !ref base, 257]
              - !ref size
      - base
      - !ref base
      - limit
      - !call
          - if
          - !call [lt, !call [add, !ref base, 256], !ref size]
          - !call [add, !ref base, 256]
          - !ref size
finish: !call
  - fn
  - [size, scan]
  - !call
      - render
      - !ref size
      - !call
          - if
          - !call [lt, !call [get, !ref scan, start], !ref size]
          - !call
              - append
              - !call [get, !ref scan, bounds]
              - !call [list, !call [get, !ref scan, start], !ref size]
          - !call [get, !ref scan, bounds]
generate: !call
  - fn
  - [source, size]
  - !call
      - let
      - scan: !call
          - fold
          - !ref scan_part
          - {bounds: [], index: 0, start: 0}
          - !call
              - map
              - !call
                  - fn
                  - [index]
                  - !call [chunk, !ref source, !ref size, !call [mul, !ref index, 256]]
              - !call [l.range, !call [div, !call [add, !ref size, 255], 256]]
      - !call [finish, !ref size, !ref scan]
  - !ref list
l: !call [import, "std:list"]
merge_chunk: !call
  - fn
  - [previous, next]
  - !call
      - dict
      - index
      - !call [get, !ref next, index]
      - start
      - !call [get, !ref next, start]
      - bounds
      - !call [concat, !call [get, !ref previous, bounds], !call [get, !ref next, bounds]]
plan: !call
  - fn
  - [[source, !ref string]]
  - !call [generate, !ref source, !call [len, !ref source]]
  - !ref list
render: !call
  - fn
  - [size, bounds]
  - !call
      - let
      - lines: !call
          - map
          - !call
              - fn
              - [index]
              - !call
                  - let
                  - pair: !call [get, !ref bounds, !call [div, !ref index, 2]]
                    prefix: !call [list, 0, !call [get, !ref pair, 0]]
                  - !call
                      - if
                      - !call [eq, !call [mod, !ref index, 2], 0]
                      - !call [list, !ref prefix]
                      - !call
                          - list
                          - !ref prefix
                          - !call [list, !call [get, !ref pair, 1], !ref size]
          - !call [l.range, !call [mul, !call [len, !ref bounds], 2]]
        prefixes: !call
          - map
          - !call
              - fn
              - [index]
              - !call [list, !call [list, 0, !call [mul, !ref index, 5]]]
          - !call [l.range, !call [div, !call [add, !ref size, 4], 5]]
      - !call [concat, !ref lines, !ref prefixes]
scan_end: !call
  - fn
  - [state, end]
  - !call
      - dict
      - index
      - !ref end
      - start
      - !ref end
      - bounds
      - !call
          - append
          - !call [get, !ref state, bounds]
          - !call [list, !call [get, !ref state, start], !ref end]
scan_part: !call
  - fn
  - [state, chunk]
  - !call
      - let
      - base: !call [get, !ref chunk, base]
        text: !call [get, !ref chunk, text]
        limit: !call [get, !ref chunk, limit]
        width: !call [sub, !ref limit, !ref base]
        index: !call [get, !ref state, index]
        # Consume lookahead only when it completes a CRLF. The next chunk
        # starts after that LF. A final chunk has no lookahead.
        end: !call
          - if
          - !call [eq, !call [slice, !ref text, !call [sub, !ref width, 1], !call [len, !ref text]], "\r\n"]
          - !call [add, !ref limit, 1]
          - !ref limit
      - !call
          - merge_chunk
          - !ref state
          - !call
              - set
              - !call
                  - fold
                  - !ref scan_segment
                  - !call [dict, index, !ref index, start, !call [get, !ref state, start], bounds, []]
                  - !call
                      - regex_find
                      - '(?s:.*?)(?:\r\n|[\r\n\x0B\x0C\x1C-\x1E\x{85}\x{2028}\x{2029}])'
                      - !call [slice, !ref text, !call [sub, !ref index, !ref base], !call [sub, !ref end, !ref base]]
              - index
              - !ref end
# Match through the first line terminator. Counting the matched text keeps
# offsets in Unicode scalars even though regex_find reports byte spans.
scan_segment: !call
  - fn
  - [state, match]
  - !call
      - scan_end
      - !ref state
      - !call
          - add
          - !call [get, !ref state, index]
          - !call [len, !call [get, !call [get, !call [get, !ref match, captures], 0], text]]
