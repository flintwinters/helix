<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix workbook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  body{margin:0;display:flex;flex-direction:column;height:100vh;font:14px system-ui;background:#212121;color:#eee}
  header{display:flex;gap:8px;align-items:center;padding:8px}
  button{padding:6px 14px;border:0;border-radius:4px;background:#37474f;color:#eee;cursor:pointer}
  button.primary{background:#2e7d32}
  main{flex:1;display:flex;min-height:0}
  #browser{width:230px;overflow:auto;background:#1a1a1a;padding:6px 0;font-size:13px}
  #browser summary{padding:3px 10px;cursor:pointer;color:#ffcb6b;font-weight:600}
  #browser a{display:block;padding:2px 10px 2px 24px;color:#ccc;cursor:pointer;white-space:nowrap}
  #browser a:hover{background:#2a2a2a}#browser a.on{background:#37474f;color:#fff}
  #browser input{box-sizing:border-box;width:calc(100% - 12px);margin:0 6px 6px;padding:4px;background:#2a2a2a;border:0;color:#eee;border-radius:4px}
  .CodeMirror{flex:1;height:auto;font-size:14px}
  /* Helix token styles over material-darker; class names come from helix-mode.js */
  .cm-s-material-darker .cm-helix-tag{font-style:italic;font-weight:600}
  .cm-s-material-darker .cm-helix-tag-call{color:#c792ea}
  .cm-s-material-darker .cm-helix-tag-ref{color:#82aaff}
  .cm-s-material-darker .cm-helix-tag-literal{color:#ffcb6b}
  .cm-s-material-darker .cm-helix-form{color:#c792ea;font-weight:600}
  .cm-s-material-darker .cm-builtin{color:#89ddff}
  .cm-s-material-darker .cm-helix-actor{color:#82aaff;font-weight:600}
  .cm-s-material-darker .cm-helix-ref{color:#eeffff;text-decoration:underline dotted #82aaff80}
  .cm-s-material-darker .cm-def{color:#f78c6c}
  .cm-s-material-darker .cm-property{color:#ffcb6b}
  .cm-s-material-darker .cm-string{color:#c3e88d}
  .cm-s-material-darker .cm-number,.cm-s-material-darker .cm-atom{color:#f78c6c}
  .cm-s-material-darker .cm-helix-indicator,.cm-s-material-darker .cm-bracket{color:#89ddff}
  .cm-s-material-darker .cm-helix-anchor{color:#ff9cac}
  .cm-s-material-darker .cm-meta{color:#89ddff}
  .cm-s-material-darker .cm-comment{color:#616161;font-style:italic}
  .failed-line{background:#ff537030}
  .failed-at{background:#ff5370;color:#fff;border-radius:2px}
  .cm-s-material-darker .cm-error{color:#ff5370;background:none;text-decoration:underline wavy #ff5370}
  #lesson{width:430px;flex:none;overflow:auto;background:#1a1a1a;padding:10px 16px;line-height:1.5}
  #lesson h2{margin:.4em 0;color:#ffcb6b} #lesson p{margin:.6em 0} #lesson code{background:#2a2a2a;padding:1px 4px;border-radius:3px;color:#c3e88d}
  #lesson .crumb{color:#888;font-size:12px} #lesson ul{padding-left:20px}
  #lesson .toc summary{cursor:pointer;color:#89ddff} #lesson .toc a{display:block;padding:1px 10px;cursor:pointer;color:#ccc} #lesson .toc a.on{color:#fff;background:#37474f}
  #lesson .toc-chapter{margin-top:6px;color:#ffcb6b;font-weight:600}
  #lesson .fence{position:relative;margin:.6em 0} #lesson .fence .CodeMirror{height:auto;font-size:13px;border-radius:4px;background:#212121}
  #lesson .fence.helix-error .CodeMirror{box-shadow:inset 3px 0 #ff5370}
  #lesson .fence button.tiny{position:absolute;right:4px;top:4px;z-index:5;padding:2px 8px;font-size:11px;opacity:.7}
  #lesson .task{margin:12px 0;padding:8px 12px;background:#263238;border-left:3px solid #82aaff;border-radius:3px}
  #lesson .probe-note{margin-top:6px;color:#888;font-size:12px}
  #lesson .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0} #lesson button:disabled{opacity:.4;cursor:default}
  .verdict{min-height:1.4em;margin:6px 0} .verdict.pass{color:#c3e88d} .verdict.fail{color:#ff5370} .verdict.hint{color:#ffcb6b}
  #modes button.on{background:#82aaff;color:#111}
  #out{flex:1;min-width:0;display:flex}#out .CodeMirror{background:#1a1a1a;font-size:13px}
  @media(max-width:700px){main{flex-direction:column}#browser{width:auto;max-height:30vh}}
</style></head><body>
<header>
  <span id="modes"><button data-mode="workbook">Workbook</button> <button data-mode="sandbox">Sandbox</button></span>
  <button class="primary" data-cmd="run">Run (Ctrl+Enter)</button>
  <button data-cmd="check">Check</button><button data-cmd="step">Run + annotations</button><button data-cmd="fmt">Format</button>
  <span id="status"></span>
</header>
<main><aside id="lesson" hidden></aside><nav id="browser" hidden><input id="filter" placeholder="filter (depth · file = import depth)"></nav><textarea id="src"></textarea><div id="out"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="/helix-mode.js"></script>
<script src="/workbook.js"></script>
<script>
const stored = (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch (e) { return fallback; } };
const keep = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let builtins = {};
const helixMode = () => ({name:'helix', builtins});
const editor = CodeMirror.fromTextArea(document.getElementById('src'), {mode:'helix', theme:'material-darker', lineNumbers:true, indentWithTabs:false, tabSize:2, extraKeys:{'Ctrl-Enter':()=>go('run'), 'Tab':cm=>cm.replaceSelection('  ')}});

// Output is YAML too, so it gets the same mode, theme and builtins as the source buffer.
const output = CodeMirror(document.getElementById('out'), {mode:'helix', theme:'material-darker', readOnly:true, lineNumbers:false, lineWrapping:true});
const ready = fetch('/builtins').then(r => r.json()).then(list => {
  builtins = Object.fromEntries(list.map(b => [b.name, b.family]));
  editor.setOption('mode', helixMode()); output.setOption('mode', helixMode());
}).catch(() => {});
editor.on('change', () => Workbook.active ? Workbook.onEdit() : keep('helix-src', editor.getValue()));
// Two modes share one editor: the sandbox is a free buffer, the workbook a guided sequence of exercises.
async function setMode(mode) {
  keep('helix-mode', mode);
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('browser').hidden = mode !== 'sandbox';
  if (mode === 'workbook') await Workbook.enter();
  else { Workbook.leave(); editor.setValue(stored('helix-src', '!call [add, 1, 2]\n')); output.setValue(''); }
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
// Show an error report in the output pane and, when it has a source position, mark the failing line red and the exact column.
// Positions are 1-based like the editor's gutter. A parse error's hint may name the real culprit ("the `[` at line L column C ..."), marked too.
let marks = [];
function showError(text) {
  marks.forEach(m => m.clear ? m.clear() : editor.removeLineClass(m, 'background', 'failed-line')); marks = [];
  const line = text.match(/^  line: (\d+)$/m), column = text.match(/^  column: (\d+)$/m);
  if (!/^error:/m.test(text) || !line || !column) return;
  const mark = (line, column) => {
    if (line < 1 || line > editor.lineCount()) return;  // the probe (appended by the checker) is not in the buffer
    editor.addLineClass(line - 1, 'background', 'failed-line'); marks.push(line - 1);
    marks.push(editor.markText({line: line - 1, ch: column - 1}, {line: line - 1, ch: column}, {className: 'failed-at'}));
  };
  const hint = text.match(/^  hint: .*?at line (\d+) column (\d+)/m);
  if (hint) mark(+hint[1], +hint[2]);
  mark(+line[1], +column[1]);
}
editor.on('change', () => { marks.forEach(m => m.clear ? m.clear() : editor.removeLineClass(m, 'background', 'failed-line')); marks = []; });
async function go(cmd) {
  const status = document.getElementById('status');
  status.textContent = 'running…';
  try {
    const reply = await fetch('/' + cmd, {method:'POST', body:cmd === 'fmt' || !Workbook.active ? editor.getValue() : Workbook.program(editor.getValue())}), text = await reply.text();
    if (cmd === 'fmt' && reply.ok) { if (text !== editor.getValue()) editor.setValue(text); } else { output.setValue(text); showError(text); }
    status.textContent = '';
  } catch (e) { output.setValue(String(e)); status.textContent = 'failed'; }
}
fetch('/files').then(r => r.json()).then(files => {
  const nav = document.getElementById('browser'), filter = document.getElementById('filter'), links = [];
  for (const group of [...new Set(files.map(f => f.group))]) {
    const box = document.createElement('details'); box.open = true;
    box.innerHTML = '<summary></summary>'; box.firstChild.textContent = group + '/';
    for (const f of files.filter(f => f.group === group)) {
      const a = document.createElement('a'); a.textContent = f.depth + ' · ' + f.path.slice(group.length + 1); a.title = f.path;
      a.onclick = async () => {
        editor.setValue(await (await fetch('/file?path=' + encodeURIComponent(f.path))).text());
        links.forEach(l => l.classList.toggle('on', l === a)); output.setValue('');
      };
      links.push(a); box.append(a);
    }
    nav.append(box);
  }
  filter.oninput = () => links.forEach(a => a.hidden = !a.title.includes(filter.value));
}).catch(() => {});
document.querySelectorAll('button[data-cmd]').forEach(b => b.onclick = () => go(b.dataset.cmd));
ready.then(() => setMode(stored('helix-mode', 'workbook')));
</script></body></html>
