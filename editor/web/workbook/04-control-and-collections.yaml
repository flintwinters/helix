title: Control flow and collections
summary: Lazy branches, immutable collections, iteration to a fixed point and the standard list library.
steps:
  - id: cond
    title: Choosing
    teach: |
      `if` takes a test and two branches; `cond` takes test/value pairs and a final default. Only the
      branch that is taken is evaluated, and `and`/`or` are lazy too.

      ```helix
      !call [cond, !call [lt, 5, 0], negative, !call [eq, 5, 0], zero, positive]
      ```
    task: Define `status` of a balance, returning `overdrawn`, `empty` or `funded`. The checker maps it over `[-5, 0, 7]`.
    start: |
      status: ~
    probe: |
      result: !call [map, !ref status, [-5, 0, 7]]
    solution: |
      status: !call
        - fn
        - [n]
        - !call [cond, !call [lt, !ref n, 0], overdrawn, !call [eq, !ref n, 0], empty, funded]
    hint: 'One `cond` with two tests and a default.'
    expect: [overdrawn, empty, funded]

  - id: immutable
    title: Collections never mutate
    teach: |
      Values are immutable. `set` and `append` return new collections; `get` reads (with an optional
      default), `has` tests, `keys` lists in canonical order, `slice` takes `[from, to)`.

      ```helix
      !call [set, {a: 1}, b, 2]
      ```

      Retaining the old value is free to reason about: nothing else can change it.
    task: Define `credit account amount`, which returns the account with its `balance` increased by `amount` and every other field untouched. The checker credits Ada's account with 30.
    start: |
      credit: ~
    probe: |
      result: !call [credit, {owner: !ref owner, balance: !ref balance}, 30]
    solution: |
      credit: !call
        - fn
        - [account, amount]
        - !call [set, !ref account, balance, !call [add, !call [get, !ref account, balance], !ref amount]]
    hint: '`set` replaces one key and returns a new map.'
    expect: {owner: Ada, balance: 150}

  - id: until
    title: Iterating to a fixed point
    teach: |
      `until done step init` repeats `state = step(state)` until `done(state)` is `true`. State is any
      value, so a small map carries several variables with no mutation.

      ```helix
      !call
        - until
        - !call [fn, [s], !call [ge, !ref s.n, 100]]
        - !call [fn, [s], {n: !call [mul, !ref s.n, 2], steps: !call [add, !ref s.steps, 1]}]
        - {n: 1, steps: 0}
      ```

      More than 100000 iterations is a `limit` error, so a runaway loop fails instead of spinning.
    task: 'How long until the money doubles? Define `years_to_double amount`: with `accrue` (interest) applied once a year, count the years until the balance is at least twice the amount. The state is `{balance, years}`.'
    start: |
      years_to_double: ~
    probe: |
      result: !call [years_to_double, 8000]
    solution: |
      years_to_double: !call
        - fn
        - [amount]
        - !call
          - get
          - !call
            - until
            - !call [fn, [s], !call [ge, !ref s.balance, !call [mul, !ref amount, 2]]]
            - !call
              - fn
              - [s]
              - balance: !call [accrue, !ref s.balance]
                years: !call [add, !ref s.years, 1]
            - {balance: !ref amount, years: 0}
          - years
    hint: 'Step with `accrue`, stop when the balance reaches `2 * amount`, then read `years` from the final state with `get`.'
    expect: 15

  - id: std-list
    title: The standard library
    teach: |
      Libraries are ordinary Helix source. Import one and call through its name:

      ```helix
      !call [let, {l: !call [import, "std:list"]}, !call [l.frequencies, [a, b, a]]]
      ```

      Discover them from a shell without reading source: `helix std list` shows signatures,
      `helix std list.group_by` one export's source, and `helix find` ranks builtins and exports by
      what you want (for example parameter and result types).
    task: Define `kind_counts`, how many transactions there are of each kind. Use `map` to take the kinds and `l.frequencies` to count them.
    start: |
      l: !call [import, "std:list"]
      kind_counts: ~
    probe: |
      result: !call [kind_counts, !ref transactions]
    solution: |
      kind_counts: !call
        - fn
        - [txs]
        - !call [l.frequencies, !call [map, !call [fn, [t], !call [get, !ref t, kind]], !ref txs]]
    hint: Take the `kind` of each transaction, then count them.
    expect: {deposit: 2, withdraw: 2}
