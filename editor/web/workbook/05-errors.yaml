title: Errors are values
summary: Failures carry a kind, a message and a location. You catch, classify, re-raise and clean up explicitly.
steps:
  - id: try
    title: Catching
    teach: |
      `try expr handler` evaluates `expr`; if it fails, the handler is called with the error as an
      ordinary map: `kind`, `message`, `line`, `column`, `reference` (and `data`, `calls`, `cause`
      when present).

      ```helix
      !call [try, !call [div, 1, 0], !call [fn, [e], !ref e.kind]]
      ```
    task: 'Define `average xs` as `total` divided by the length. An empty list divides by zero, so it must give `0`. The checker averages the deposits and an empty list.'
    start: |
      average: ~
    probe: |
      result: [!call [average, !call [amounts_of, deposit, !ref transactions]], !call [average, []]]
    solution: |
      average: !call
        - fn
        - [xs]
        - !call [try, !call [div, !call [total, !ref xs], !call [len, !ref xs]], !call [fn, [e], 0]]
    hint: The handler ignores the error and returns `0`.
    expect: [35, 0]

  - id: raise
    title: Raising with data
    teach: |
      `raise kind message [data]` fails with a kind you choose. The optional data payload is ordinary
      data, visible to handlers as `e.data`.

      ```helix
      !call [try, !call [raise, boom, "it broke", {code: 7}], !call [fn, [e], !ref e.data]]
      ```
    task: 'Define `withdraw balance amount`. When `amount` exceeds `balance`, raise `insufficient_funds` whose data is `{short: <how much is missing>}`; otherwise return the new balance.'
    start: |
      withdraw: ~
    probe: |
      result: !call
        - try
        - !call [withdraw, 10, 25]
        - !call [fn, [e], !ref e.data]
    solution: |
      withdraw: !call
        - fn
        - [balance, amount]
        - !call
          - if
          - !call [gt, !ref amount, !ref balance]
          - !call [raise, insufficient_funds, "balance too low", {short: !call [sub, !ref amount, !ref balance]}]
          - !call [sub, !ref balance, !ref amount]
    hint: '`raise` takes kind, message, then the data map.'
    expect: {short: 15}

  - id: rethrow
    title: Handle some failures, not all
    teach: |
      A handler that swallows everything hides bugs. Match the kinds you expect and re-raise the rest
      with `!call [raise, e]`, which keeps the original as `cause`.

      ```helix
      !call
        - try
        - !call [div, 1, 0]
        - !call [fn, [e], !call [cond, !call [eq, !ref e.kind, divide_by_zero], 0, !call [raise, !ref e]]]
      ```
    task: 'Define `settle_tx balance tx`, which applies a transaction with the given `apply_tx`. An overdraft (`insufficient_funds`) is skipped and leaves the balance unchanged; every other failure, such as an unknown kind, must propagate.'
    start: |
      apply_tx: !call
        - fn
        - [balance, tx]
        - !call
          - cond
          - !call [eq, !ref tx.kind, deposit]
          - !call [add, !ref balance, !ref tx.amount]
          - !call [eq, !ref tx.kind, withdraw]
          - !call [withdraw, !ref balance, !ref tx.amount]
          - !call [raise, unknown_kind, "unknown transaction kind", {kind: !ref tx.kind}]
      settle_tx: ~
    probe: |
      result:
        - !call [settle_tx, 100, {kind: deposit, amount: 25}]
        - !call [settle_tx, 10, {kind: withdraw, amount: 50}]
        - !call [try, !call [settle_tx, 10, {kind: refund, amount: 5}], !call [fn, [e], !ref e.kind]]
    solution: |
      settle_tx: !call
        - fn
        - [balance, tx]
        - !call
          - try
          - !call [apply_tx, !ref balance, !ref tx]
          - !call [fn, [e], !call [cond, !call [eq, !ref e.kind, insufficient_funds], !ref balance, !call [raise, !ref e]]]
    hint: 'Inside the handler use `cond` on `e.kind`; the default branch re-raises `e`.'
    expect: [125, 10, unknown_kind]

  - id: assert
    title: Assertions and cleanup
    teach: |
      `assert cond [message]` returns `null` or fails with an `assertion` error. `finally expr cleanup`
      always runs the cleanup expression, then preserves the original result or error. Lists evaluate
      their items in order, which sequences an assertion before a value.

      ```helix
      !call [try, !call [assert, !call [gt, 1, 2], "one is not greater"], !call [fn, [e], !ref e.message]]
      ```
    task: 'Define `positive n`, which returns `n` when it is above zero and otherwise fails an assertion with the message `must be positive`. Then make `apply_tx` use it on every amount, so a bad transaction is rejected up front.'
    start: |
      positive: ~
    probe: |
      result:
        - !call [apply_tx, 100, {kind: deposit, amount: 25}]
        - !call [try, !call [apply_tx, 100, {kind: deposit, amount: -1}], !call [fn, [e], !ref e.message]]
    solution: |
      positive: !call
        - fn
        - [n]
        - !call
          - get
          - [!call [assert, !call [gt, !ref n, 0], "must be positive"], !ref n]
          - 1
      apply_tx: !call
        - fn
        - [balance, tx]
        - !call
          - cond
          - !call [eq, !ref tx.kind, deposit]
          - !call [add, !ref balance, !call [positive, !ref tx.amount]]
          - !call [eq, !ref tx.kind, withdraw]
          - !call [withdraw, !ref balance, !call [positive, !ref tx.amount]]
          - !call [raise, unknown_kind, "unknown transaction kind", {kind: !ref tx.kind}]
    hint: List items are evaluated in order, so a list of the assertion and `n` can be indexed for its last item.
    expect: [125, must be positive]

  - id: statement
    title: The finished ledger
    teach: |
      Everything you wrote is now one program, and each piece is a plain value. A name holds a
      number (chapter 2), a function turns it into a rule (3), `fold` replays a list (3 and 4), and
      failures are data you can absorb or pass on (5).

      The last piece is no new machinery: the same ordinary functions, composed.
    task: 'Define `statement`: a map with the `owner`, the `closing` balance after settling every transaction from `opening` (skipping overdrafts), and the `deposits` total.'
    start: |
      statement: ~
    probe: |
      result: !ref statement
    solution: |
      statement:
        owner: !ref owner
        closing: !call [fold, !ref settle_tx, !ref opening, !ref transactions]
        deposits: !call [total, !call [amounts_of, deposit, !ref transactions]]
    hint: '`fold` threads the balance through `settle_tx`, which takes the balance then the transaction. The 500 withdrawal is skipped.'
    expect: {owner: Ada, closing: 160, deposits: 70}
