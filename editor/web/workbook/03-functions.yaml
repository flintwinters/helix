title: Functions
summary: Functions are lexical closures and ordinary values. Iteration is just a function away.
steps:
  - id: fn
    title: Defining functions
    teach: |
      `!call [fn, [params], body]` makes a function. Naming one is just a map entry:

      ```helix
      double: !call [fn, [n], !call [mul, !ref n, 2]]
      answer: !call [double, 21]
      ```

      A wrong argument count is an `arity` error blamed on the call.
    task: 'Ada earns 5% interest. Define `interest_on amount` (5% of the amount, with integer division) and make the ledger''s `interest` use it. The checker calls `interest_on` on `200`.'
    start: |
      interest_on: ~
      interest: !call [interest_on, !ref balance]
    probe: |
      result: !call [interest_on, 200]
    solution: |
      interest_on: !call [fn, [amount], !call [div, !call [mul, !ref amount, 5], 100]]
    hint: The parameter list is a plain list of names; 5% is `amount * 5 / 100`.
    expect: 10

  - id: closures
    title: Closures
    teach: |
      Scope is lexical: a function sees the maps around its *definition*, not around its caller. A
      function can therefore build and return another function that remembers its argument.

      ```helix
      make_adder: !call [fn, [n], !call [fn, [x], !call [add, !ref x, !ref n]]]
      add10: !call [make_adder, 10]
      answer: !call [add10, 5]
      ```
    task: 'Rates will differ per product. Define `make_rate percent`, which returns a function of an amount, and define `interest_on` as `make_rate` at 5. The checker also builds a 10% rate and applies it to `50`.'
    start: |
      make_rate: ~
      interest_on: !call [make_rate, 5]
    probe: |
      result: [!call [interest_on, 200], !call [!call [make_rate, 10], 50]]
    solution: |
      make_rate: !call [fn, [percent], !call [fn, [amount], !call [div, !call [mul, !ref amount, !ref percent], 100]]]
    hint: The outer function returns an inner `fn` that mentions `percent`.
    expect: [10, 5]

  - id: map-filter
    title: Iteration takes the function first
    teach: |
      Like every actor, iteration takes the function first and the data last:
      `map f xs`, `filter f xs` (the predicate must return a boolean).

      ```helix
      !call [map, !call [fn, [x], !call [mul, !ref x, !ref x]], [1, 2, 3]]
      ```

      Swap the order and the error says exactly that:

      ```helix-error
      !call [map, [1, 2, 3], !call [fn, [x], !ref x]]
      ```
    task: 'The ledger needs transactions to work on. Define `amounts_of kind txs`, the amounts of the transactions of one kind. Use `filter` then `map`; the checker asks for deposits and withdrawals.'
    start: |
      transactions:
        - {kind: deposit, amount: 25}
        - {kind: withdraw, amount: 10}
        - {kind: deposit, amount: 45}
        - {kind: withdraw, amount: 500}
      amounts_of: ~
    probe: |
      result: [!call [amounts_of, deposit, !ref transactions], !call [amounts_of, withdraw, !ref transactions]]
    solution: |
      amounts_of: !call
        - fn
        - [kind, txs]
        - !call
          - map
          - !call [fn, [t], !call [get, !ref t, amount]]
          - !call [filter, !call [fn, [t], !call [eq, !call [get, !ref t, kind], !ref kind]], !ref txs]
    hint: Filter on the transaction's `kind`, then map `get amount` over what is left.
    expect: [[25, 45], [10, 500]]

  - id: fold
    title: Folding
    teach: |
      `fold f init xs` threads an accumulator through a list; `f` takes the accumulator, then the element.

      ```helix
      !call [fold, !call [fn, [acc, x], !call [add, !ref acc, !ref x]], 0, [1, 2, 3, 4]]
      ```
    task: Define `total`, the sum of a list of numbers, using `fold`. The checker totals the deposit amounts.
    start: |
      total: ~
    probe: |
      result: !call [total, !call [amounts_of, deposit, !ref transactions]]
    solution: |
      total: !call [fn, [xs], !call [fold, !call [fn, [acc, x], !call [add, !ref acc, !ref x]], 0, !ref xs]]
    hint: '`fold f init xs` starts from `0` here; `f` adds the element to the accumulator.'
    expect: 70

  - id: recursion
    title: Recursion
    teach: |
      A function reaches itself through its own name. Evaluation is iterative inside the engine,
      so depth is a configured limit (`depth` error), not a Rust stack overflow.

      ```helix
      fact: !call
        - fn
        - [n]
        - !call [if, !call [le, !ref n, 1], 1, !call [mul, !ref n, !call [fact, !call [sub, !ref n, 1]]]]
      answer: !call [fact, 5]
      ```
    task: 'Define `compound amount years`: the amount after earning `interest_on` it, year after year. Zero years leaves it unchanged. The checker compounds `8000` for 3 years.'
    start: |
      compound: ~
    probe: |
      result: !call [compound, 8000, 3]
    solution: |
      compound: !call
        - fn
        - [amount, years]
        - !call
          - if
          - !call [le, !ref years, 0]
          - !ref amount
          - !call [compound, !call [add, !ref amount, !call [interest_on, !ref amount]], !call [sub, !ref years, 1]]
    hint: '`if` evaluates only the branch it takes; the recursive call has one year fewer.'
    expect: 9261

  - id: compose
    title: Functions are values
    teach: |
      Pass them, return them, store them in maps. A parameter holding a function can head a call, and
      `!call [call, f, args...]` calls any computed function.

      ```helix
      twice: !call [fn, [f, x], !call [f, !call [f, !ref x]]]
      answer: !call [twice, !call [fn, [n], !call [add, !ref n, 3]], 10]
      ```
    task: Interest and the fee are separate steps. Define `compose f g` (apply `g` first, then `f`); `settle` already composes them into "earn interest, then pay the fee".
    start: |
      accrue: !call [fn, [b], !call [add, !ref b, !call [interest_on, !ref b]]]
      charge_fee: !call [fn, [b], !call [sub, !ref b, !ref fee]]
      compose: ~
      settle: !call [compose, !ref charge_fee, !ref accrue]
    probe: |
      result: !call [settle, 8000]
    solution: |
      compose: !call
        - fn
        - [f, g]
        - !call [fn, [x], !call [f, !call [g, !ref x]]]
    hint: 'The inner function closes over `f` and `g`; `settle 8000` is `8000 + 400 - 5`.'
    expect: 8395
