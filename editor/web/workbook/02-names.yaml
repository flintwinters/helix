title: Names
summary: Maps are scopes. References resolve lexically, so order never matters. The numbers in Ada's ledger get names.
steps:
  - id: refs
    title: Entries are names
    teach: |
      Every map entry is a name in scope for its siblings. `!ref name` reads one.

      ```helix
      base: 20
      answer: !call [add, !ref base, 2]
      ```
    task: 'The magic numbers deserve names. Add `opening` (100), `deposit` (25) and `fee` (5) as entries and compute `balance` from them, so the balance is still 120.'
    start: |
      # opening: ...
      # deposit: ...
      # fee: ...
    solution: |
      opening: 100
      deposit: 25
      fee: 5
      balance: !call [sub, !call [add, !ref opening, !ref deposit], !ref fee]
    hint: 'Each name is a map entry; `balance` becomes the same nested call with `!ref` in place of the numbers.'
    expect: {owner: Ada, opening: 100, deposit: 25, fee: 5, balance: 120}

  - id: order
    title: Order is irrelevant
    teach: |
      Entries are evaluated on demand, in canonical key order, so you can use a name before the line that defines it.
      Reordering a map never changes its meaning. When order *does* matter, use a list or explicit control flow.

      ```helix
      total: !call [mul, !ref price, !ref qty]
      price: 5
      qty: 6
      ```

      Two entries that depend on each other are a `cycle` error, not a hang.
    task: '`available` is what Ada can spend: the balance minus a `hold`. Add the missing `hold` of 20 so `available` is 100.'
    start: |
      available: !call [sub, !ref balance, !ref hold]
    solution: |
      available: !call [sub, !ref balance, !ref hold]
      hold: 20
    hint: Run the starter first and read the `unbound` error. It names what is missing.
    expect: {owner: Ada, opening: 100, deposit: 25, fee: 5, balance: 120, available: 100, hold: 20}

  - id: let
    title: Local names with let
    teach: |
      `let` binds names for one expression. Bindings see each other and are evaluated only when used.

      ```helix
      !call [let, {a: 2, b: !call [mul, !ref a, 3]}, !ref b]
      ```
    task: 'Add `interest`, 5% of `balance` (6). Keep the working out local: with `let`, bind `percent` to 5 and `scaled` to `balance * percent`, then divide `scaled` by 100.'
    start: |
      interest: ~
    solution: |
      interest: !call
        - let
        - percent: 5
          scaled: !call [mul, !ref balance, !ref percent]
        - !call [div, !ref scaled, 100]
    hint: 'The shape is `!call [let, {name: value}, body]`; the body can use `balance` from the enclosing map.'
    expect: {owner: Ada, opening: 100, deposit: 25, fee: 5, balance: 120, available: 100, hold: 20, interest: 6}

  - id: dotted
    title: Dotted references
    teach: |
      A dotted name selects members: `!ref person.address.city`. Missing members are errors that list
      what exists.

      ```helix
      person:
        address: {city: Lisbon}
      where: !ref person.address.city
      ```
    task: Record the `branch` that holds the account, with a nested `address`, and define `city` as the city inside `branch.address`. The checker reads `city`.
    start: |
      branch:
        name: Baixa
        address: {city: Lisbon, country: Portugal}
      city: ~
    probe: |
      result: !ref city
    solution: |
      branch:
        name: Baixa
        address: {city: Lisbon, country: Portugal}
      city: !ref branch.address.city
    hint: A single `!ref` with dots does it.
    expect: Lisbon
