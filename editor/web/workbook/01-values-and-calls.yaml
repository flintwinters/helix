title: Values and calls
summary: A program is a YAML document that evaluates to a value. The only operation is an explicit call. You start a ledger for Ada here and keep extending it through every chapter.
steps:
  - id: hello
    title: A program is a value
    teach: |
      A Helix program is one YAML document, and it **evaluates to a value**. There is no `main`,
      no statements, no ceremony: scalars evaluate to themselves.

      ```helix
      hello, world
      ```

      Press **Run** (Ctrl-Enter). The panel shows what the program evaluated to. Strings are strings
      whatever the quoting style, and numbers, booleans and `null` are what you expect.
    task: Make the program evaluate to the string `Ada`, the owner of the ledger you will build over the next chapters.
    start: |
      # Replace this line with a value.
      ~
    solution: |
      Ada
    hint: A bare scalar is already a complete program.
    expect: Ada

  - id: maps
    title: Maps and lists are data
    teach: |
      Maps and lists evaluate their parts and are otherwise just data. Map keys are always strings,
      and a list is *never* an implicit call.

      ```helix
      name: Ada
      tags: [maths, engines]
      ```

      The output panel on the right shows what you would expect from any language: a map holding a string and a list.
    task: Turn the owner into the first record of the ledger, a map with `owner` set to `Ada` and `balance` set to the integer `100`.
    start: |
      # owner: ...
      # balance: ...
      {}
    solution: |
      owner: Ada
      balance: 100
    hint: 'Two block-style entries, `key: value`, no quotes needed.'
    expect: {owner: Ada, balance: 100}

  - id: first-call
    title: Calls are explicit
    teach: |
      Code is data with a tag on it. `!call` marks a list as a call: the first element names the
      actor, the rest are its arguments.

      ```helix
      !call [add, 1, 2]
      ```

      `add` is a builtin. Run `helix builtins` (or the Sandbox) to see the whole catalog: it is small
      on purpose and grouped by family.

      Without the tag a list is plain data, so `[add, 1, 2]` is just three values.
    task: Ada deposits 25. Compute the new `balance` with `add` instead of writing the number down.
    start: |
      # balance: ...
    solution: |
      balance: !call [add, 100, 25]
    hint: 'Replace the value of `balance` with a call: `!call [add, 100, 25]`.'
    expect: {owner: Ada, balance: 125}

  - id: nesting
    title: Calls nest
    teach: |
      An argument can itself be a call. Arguments are evaluated left to right and then handed to the actor,
      so the tree you write is the tree that runs.

      ```helix
      !call [mul, !call [add, 1, 2], 4]
      ```
    task: The bank also charges a fee of 5 on that deposit. Make `balance` the single nested expression `(100 + 25) - 5`.
    start: |
      # balance: ...
    solution: |
      balance: !call [sub, !call [add, 100, 25], 5]
    hint: The deposit is the first argument of `sub`.
    expect: {owner: Ada, balance: 120}

  - id: reading-errors
    title: Errors name the fix
    teach: |
      Failures say what was rejected and what to do about it, with the exact source location. Here is
      one you will meet early:

      ```helix-error
      !call [add, 1, "2"]
      ```

      Read the output: `kind: type`, the message names the argument and what it expected, and
      `line`/`column` point at the call. Nothing coerces silently. A string is not a number.
    task: Someone typed the deposit as text, and the ledger fails. Fix it so `balance` is `120` again.
    start: |
      balance: !call [sub, !call [add, 100, "25"], 5]
    solution: |
      balance: !call [sub, !call [add, 100, 25], 5]
    hint: The deposit must be a number, not a string.
    expect: {owner: Ada, balance: 120}
